  notes_curator: 'SPLIT OUT OF THE BASE ENTRY 2026-10-14. The block holds three oligos - TSADHEXF1new, TSADHEXF2new
    and TSADHEXRnew - and the inner forward sat in oligos.alternates, where score.oligo_pools treated it as an
    interchangeable member of one pool with the outer forward and credited its product to an assay declaring 334
    bp. An alternate that makes a DIFFERENT PRODUCT is a second round, not a pool member.

    THE EVIDENCE IS WEAKER HERE THAN FOR THE OTHER SPLIT, AND IT IS WORTH SAYING SO. This assay is unpublished
    (`Tracies unpublished nested`), so there is no paper to read the design off. What there is: the entry''s own
    name says nested; the two forwards are named F1 and F2 against a single shared reverse, which is a semi-nested
    design; and scripts/check_amplicons.py over every Adenoviridae archive measures the F1 x R pair at a modal 334
    bp - exactly the stored size - and the F2 x R pair at a modal 248 bp on 1,116 records. A shorter product from
    the second forward inside the first product is what a semi-nested round 2 is. That is consistent, not
    conclusive: it rests on a naming convention and a measurement rather than on a protocol, so whoever holds the
    original protocol should confirm which forward is used in which round before either entry is promoted past
    draft.

    amplicon_bp 248 is the measurement, since there is no published figure to prefer over it.'
