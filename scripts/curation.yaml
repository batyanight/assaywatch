# Curation overlay for the WCS primer registry drafts.
#
# The parser (parse_wcs_primers.py) is deterministic and only writes what the
# spreadsheet says. Everything that needs outside knowledge lives here so the
# edit history of "who decided this taxid / this DOI" is a git diff of one file.
#
# Three sections, applied in order by apply_curation.py:
#   targets:   first regex (case-insensitive) that matches "<assay_group> — <gene>" wins
#   citations: first regex that matches citation.as_written wins
#   assays:    per-id overrides, applied last; keys mirror the draft YAML
#
# Provenance flags:
#   doi_verified: true   DOI seen in a search result or written in the spreadsheet
#   doi_verified: false  DOI recalled from memory or derived from the journal's
#                        DOI pattern; run resolve_citations.py before trusting it
#   taxid: null          taxon_name is given; run resolve_citations.py --taxids
#                        to fill from NCBI Taxonomy rather than trusting memory

# Assays that are out of scope for drift monitoring. They are still parsed
# into the drafts, so nothing is lost, but apply_curation.py does not write
# them to the registry. Two reasons an assay lands here:
#
#   use_context  host identification, DNA barcoding, eDNA species detection,
#                conservation genetics and internal controls target the host,
#                not a pathogen. The drift question does not apply in the same
#                form, and their targets (Vertebrata, Mammalia, Carnivora...)
#                are tens of millions of records that would dominate every run.
#   assay_ids    kingdom-level universal primers (pan-bacterial 16S, pan-fungal
#                ITS). Designed against regions conserved across a kingdom, so
#                nobody expects ITS4 to drift, and the target taxon is not
#                bounded in any way the retrieval stage can use.
#
# To bring one back, remove it from this list and rerun apply_curation.py.
exclude:
  use_context: [host_id, internal_control, barcoding, eDNA, conservation_genetics, metabarcoding]
  assay_ids:
    - GENERAL_BACTERIA_16S_rDNA_full_length
    - GENERAL_BACTERIA_16S_rDNA_full_length_2
    - GENERAL_BACTERIA_16S_rDNA_full_length_2000   # U3/U2 pair that carries the Lu 2000 citation row
    - Helicobacter_XREACTS_with_general_bac_3   # U3/U2 universal bacterial 16S, filed under Helicobacter in the sheet
    - Helicobacter_XREACTS_with_general_bac_4   # U4/U2/U5R universal bacterial sequencing primers

# Gene-targeted retrieval for taxa that are far too large to fetch whole.
# Matched by regex on the assay id; the first match wins and lands in
# target.query, which retrieve.py ANDs onto `txid<taxid>[Organism:exp]`.
# Entrez field tags: [Gene] matches annotated gene names, [Title] the record
# title. Both are OR'd generously because annotation is inconsistent: the same
# locus is `cytb`, `cob`, or only "cytochrome b" in the title depending on who
# submitted it. "complete genome"[Title] is included for viruses, since a
# complete genome always carries the target gene and is usually well
# annotated. A record the query misses is a record the assay is not judged
# against; that is a coverage cost, not a scoring error.
queries:
  # Fungal rDNA assays. Fetched whole, these taxa are mostly genome contigs and
  # transcripts (2026-10-04: Bsal 4,228 records, Ophidiomyces 32,645), on which
  # the assays only find chance primer pairs. The rDNA records are 12 and 196.
  - match: "^B_salamandrivorans_Internal_transcribes_spa"
    query: 'ITS[Title] OR ITS1[Title] OR ITS2[Title] OR "internal transcribed spacer"[Title] OR "5.8S"[Title] OR "ribosomal RNA"[Title] OR rRNA[Title] OR "ribosomal DNA"[Title]'
  - match: "^Snake_fungus_Ophidiomyces_ophi"
    query: 'ITS[Title] OR ITS2[Title] OR "internal transcribed spacer"[Title] OR IGS[Title] OR "intergenic spacer"[Title] OR 28S[Title] OR "large subunit"[Title] OR "ribosomal RNA"[Title] OR rRNA[Title] OR "ribosomal DNA"[Title]'
  - match: "^LEPTOSPIROSIS"
    query: '(flaB[Gene] OR flagellin[Title] OR "flaB"[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^Helicobacter"
    query: '("16S ribosomal RNA"[Title] OR "16S rRNA"[Title] OR 16S[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^E_coli_ETEC_enterotoxin_LT"
    query: '(eltA[Gene] OR eltB[Gene] OR elt[Gene] OR "heat-labile enterotoxin"[Title] OR "LT toxin"[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^E_coli_O157_H7_hlyA"
    query: '(hlyA[Gene] OR ehxA[Gene] OR "EHEC hemolysin"[Title] OR "enterohemolysin"[Title] OR "hlyA"[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^E_coli_malB"
    # "maltose"[Title] was dropped: it pulled in every maltose-binding-protein
    # construct. The malB promoter sits between malE and malK, hence both.
    query: '(malB[Gene] OR malE[Gene] OR malK[Gene] OR "malB"[Title] OR "malE-malK"[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^Shigella_ipah"
    query: '(ipaH[Gene] OR "invasion plasmid antigen"[Title] OR ipaH[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^Yersinia_enterocolitica"
    query: '(yst[Gene] OR ystA[Gene] OR "heat-stable enterotoxin"[Title] OR yst[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^Yersinia_pseudotuberculosis"
    query: '(inv[Gene] OR invasin[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'
  - match: "^Entamoeba"
    query: '18S[Title] OR "small subunit ribosomal"[Title] OR SSU[Title] OR "ribosomal RNA"[Title]'
  - match: "^Apicoplast"
    # Complete apicoplast genomes carry the 23S but are titled "apicoplast,
    # complete genome", so those title forms are included.
    query: '(apicoplast[Title] OR plastid[Title]) AND (23S[Title] OR "large subunit"[Title] OR LSU[Title] OR "ribosomal RNA"[Title] OR "complete genome"[Title] OR "complete sequence"[Title])'
  - match: "^Pan_coccidia"
    query: '18S[Title] OR "small subunit ribosomal"[Title] OR SSU[Title]'
  - match: "^CRYPTOSPORIDIA"
    query: '18S[Title] OR "small subunit ribosomal"[Title] OR SSU[Title]'
  - match: "^(Pan_Plasmodium|Pan_hemoparasite)"
    query: 'cytb[Gene] OR cob[Gene] OR "cytochrome b"[Title] OR cytb[Title] OR "complete genome"[Title]'
  - match: "^SSU_rRNA_gene_Plasmodium"
    query: '18S[Title] OR "small subunit ribosomal"[Title] OR SSU[Title]'
  - match: "^Pan_HERPES_dsDNA_Polymerase"
    query: '"DNA polymerase"[Title] OR UL30[Gene] OR pol[Gene] OR DPOL[Gene] OR "complete genome"[Title]'
  - match: "^Pan_HERPES_dsDNA_Terminase"
    query: 'terminase[Title] OR UL89[Gene] OR UL56[Gene] OR UL15[Gene] OR "complete genome"[Title]'
  - match: "^Pan_[Ff]lavivirus"
    query: 'NS5[Gene] OR NS5[Title] OR "complete genome"[Title] OR polyprotein[Title]'
  - match: "^CORONAVIRUS"
    # SARS-CoV-2 is excluded: nine million near-identical surveillance records
    # would swamp a pan-CoV wildlife statistic. Drop the NOT clause to include it.
    query: '(RdRp[Gene] OR orf1ab[Gene] OR ORF1ab[Title] OR "RNA-dependent RNA polymerase"[Title] OR "complete genome"[Title]) NOT txid2697049[Organism:exp]'
  - match: "^Paramyxovirinae"
    query: 'L[Gene] OR "L protein"[Title] OR "large protein"[Title] OR polymerase[Title] OR "complete genome"[Title]'
  - match: "^INFLUENZA_A"
    # Segment 7 is the matrix segment. Titles follow NCBI's influenza naming scheme.
    query: '"segment 7"[Title] OR ("matrix protein"[Title] AND M[Gene])'
  # Lineage-specific assays, scoped to the lineage they were designed for
  # (2026-10-04). Screened against the whole taxon they sat at the bottom of it
  # in every year, which reads as poor coverage of diversity they never targeted.
  # More specific entries first: the first matching rule wins.
  - match: "^RETROVIRUS_RNA_polymerase_SIV_Takehisa_2009$"
    query: '(pol[Gene] OR polymerase[Title] OR "complete genome"[Title]) AND (SIVcpz OR SIVgor OR chimpanzee OR gorilla OR "Pan troglodytes" OR "Gorilla gorilla")'
  - match: "^MYCOPLASMA_16S_Turtles_only_Feldman_2006$"
    query: '(turtle OR tortoise OR Testudines OR Terrapene OR Gopherus OR chelonian OR agassizii OR testudineum OR testudinis) AND (16S OR "ribosomal RNA" OR rRNA)'
  - match: "^RETROVIRUS_RNA_polymerase_SIV"
    query: 'pol[Gene] OR polymerase[Title] OR "complete genome"[Title]'
  - match: "^ENTEROVIRUS_ssRNA_5_UTR"
    query: "\"5' UTR\"[Title] OR \"5'UTR\"[Title] OR \"5' untranslated\"[Title] OR VP4[Gene] OR VP2[Gene] OR \"complete genome\"[Title]"
  - match: "^ENTEROVIRUS_ssRNA_VP3_VP1"
    query: 'VP1[Gene] OR VP1[Title] OR VP3[Gene] OR "complete genome"[Title]'
  - match: "^Salmonella_invA"
    query: '(invA[Gene] OR "invasion protein"[Title] OR invA[Title]) AND 1:30000[SLEN] NOT "whole genome shotgun"[Title]'

