assays:
  # Helicobacter: column B held a sensitivity note, not a gene; the block
  # inherited the previous gene label.
  Helicobacter_XREACTS_with_general_bac_2:
    name: "Helicobacter — 16S rRNA qPCR (Helico New F/R + PROBE1)"
    target: {gene: 16S rRNA}
    source: {notes_curator: "Detects to 1:10,000 dilution of blue iguana positive control (spreadsheet)"}
  Helicobacter_XREACTS_with_general_bac:
    name: "Helicobacter — 16S rRNA conventional (Helico F/R; cross-reacts with other bacteria)"
    target: {gene: 16S rRNA}
  Helicobacter_XREACTS_with_general_bac_3:
    name: "Helicobacter — 16S rRNA full length (U3/U2, universal bacterial)"
    target: {gene: 16S rRNA, taxon_name: Bacteria, taxid: 2}
  Helicobacter_XREACTS_with_general_bac_4:
    name: "Helicobacter — 16S sequencing primers (U4/U2/U5R, universal bacterial)"
    target: {gene: 16S rRNA, taxon_name: Bacteria, taxid: 2}
  # Influenza A: the primers/probe are the Spackman 2002 matrix set; the sheet
  # says they were modified at WCS.
  INFLUENZA_A_ssRNA_Matrix_gene_recognized_h_2003:
    target: {gene: M (matrix)}
    name: "Influenza A virus — matrix gene real-time RT-PCR (Spackman, WCS-modified)"
