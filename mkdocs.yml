site_name: AssayWatch
site_description: >-
  Continuous in-silico re-validation of published PCR and qPCR diagnostic assays
  against newly deposited GenBank sequences.
site_url: https://batyanight.github.io/assaywatch/
repo_url: https://github.com/batyanight/assaywatch
repo_name: batyanight/assaywatch
edit_uri: ""
copyright: >-
  Code MIT, registry and curated tables CC-BY-4.0.
  Figures are from the 2026-10-31 run; a status is worth reading, not quoting.

# `website/` rather than `docs/`: docs/ is 137 dated journals and the reference
# set, which are the project's working record and not a published site. The
# generated pages under website/assays/ are built by `assaywatch.site_render`.
docs_dir: website
site_dir: .site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/palette.css
  - stylesheets/extra.css

# BokehJS, pinned, loaded once for every chart on the site. Must match
# assaywatch.site_charts.BOKEH_VERSION; tests/test_site.py asserts it does.
extra_javascript:
  - https://cdn.bokeh.org/bokeh/release/bokeh-3.10.1.min.js
  - https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.10.1.min.js
  - javascripts/tables.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}

# The 217 generated assay pages are reachable from assays/index.md and from
# search; listing them in `nav` would put a 217-item tree in the sidebar.
not_in_nav: |
  /assays/*.md

nav:
  - What this is: index.md
  - What the output is worth: what-the-output-is-worth.md
  - How the scoring works: how-the-scoring-works.md
  - How it was tested: how-it-was-tested.md
  - Scoping: scoping.md
  - How a run works: pipeline.md
  - Assays:
      - Every assay: assays/index.md
  - Glossary: glossary.md
