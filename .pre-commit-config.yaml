repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pin in pyproject.toml and environment.yml: a hook
    # on a different version reformats what the local ruff just formatted, which
    # cost three aborted commits before anyone noticed the versions differed.
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: validate-registry
        name: validate registry YAML
        entry: conda run -n assaywatch python -m assaywatch.validate registry
        language: system
        pass_filenames: false
        files: ^registry/.*\.yaml$
      - id: check-citations
        # Every citation must match Crossref. A reference written from memory is
        # how doi:10.3390/v13071358 was briefly recorded as Nobach et al. when
        # the paper is Sigrist et al.; it was caught by luck, so it is a gate now.
        # Runs against the committed Crossref cache, so it needs no network.
        name: citations match Crossref
        entry: conda run -n assaywatch python scripts/check_citations.py --quiet
        language: system
        pass_filenames: false
        files: ^(registry/.*\.yaml|docs/papers-index\.cache\.json)$
