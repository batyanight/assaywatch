repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: validate-registry
        name: validate registry YAML
        entry: python -m assaywatch.validate registry
        language: system
        pass_filenames: false
        files: ^registry/.*\.yaml$
