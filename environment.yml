name: assaywatch
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy
  - primer3-py      # optional: thermodynamic columns (bioconda)
  - pydantic>=2
  - pyyaml
  - requests
  - snakemake-minimal>=8
  - pytest
  - ruff=0.16.10   # pinned to match .pre-commit-config.yaml and pyproject.toml
  - pre-commit
  - pip
  - pip:
      - -e .
