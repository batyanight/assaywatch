  notes_curator: 'PROMOTION TO ACTIVE ATTEMPTED AND WITHDRAWN 2026-10-21. The drift evidence supports it - detected
    share 90.0% (77%-96%) on 40 evaluable records in the 24-month window, status stable - and the entry meets every
    other schema precondition (taxid 10492, DOI verified, design_year 2007). It is held at draft by the amplicon
    defect below, found while checking the entry for promotion, which the validator correctly refuses to let an
    `active` entry carry. AMPLICON: THE DECLARED SCALAR IS WRONG AND IS HIDING RECORDS. Pallister et al. 2007
    answers this directly (papers/, p. 4): "The amplification product obtained using the 16R and 16F primers was
    substantially smaller for BIV than for EHNV, ECV and ESV - around 200 bp for BIV, approximately 700 bp for EHNV
    and slightly larger for ECV and ESV." So the product length is SPECIES-DEPENDENT by design - this is the
    variable intergenic region, and the variation is the locus - and 200 bp is the BIV figure only. Measured on the
    2026-10-21 run: of 128 records yielding a product the sizes are 244 bp (44), 228 (39), 212 (37), 227 (6), 209 (1)
    and 196 (1), all BIV-scale, and separately 61 records carry BOTH primer sites with no facing pair inside the
    150-250 bp window the scalar implies ("sites found but no facing pair within 150-250 bp; both primers match").
    Those 61 are the EHNV/ECV/ESV end of the assay and are counted as no_amplicon purely because of the declared
    size - a 48% understatement of the evaluable denominator. The fix is amplicon_bp_range plus species_sizes, the
    ORTHOPOXVIRUS ATI pattern, with the bands MEASURED per species by scripts/measure_species_sizes.py rather than
    taken from the paper words "around" and "approximately" (config.yaml amplicon: the measured size wins over the
    published one); that needs a rescreen under a wider window and is not done here. A related case, though not the
    identical defect: ALPHAVIRUSES_Togaviridae_ssRNA_NSP4_gene_round2 had a wrong SCALAR hiding 31 records on
    2026-10-21 and was corrected to a scalar, not a range. OLIGO ATTRIBUTION, established 2026-10-21: Pallister
    credits 16R and 16F to Jancovich et al. 2005 in five places - twice in Methods ("the PCR primers used to amplify
    the variable region - 16R and 16F (Jancovich et al. 2005)") and in the legends of Figures 2, 3 and 4 - so this
    entry cites the paper the sequences were READ FROM, not one shown to have designed them, and
    oligos_designed_here is false. The credited paper, exactly as Pallister''s reference list prints it and with no
    DOI printed there: "Jancovich J.K., Davidson E.W., Parameswaran N., Mao J., Chinchar G., Collins J.P., Jacobs
    B.L. & Storfer A. (2005) Evidence for emergence of an amphibian iridoviral disease because of human-enhanced
    spread. Molecular Ecology 14, 213-224." THE CITATION IS DELIBERATELY NOT MOVED. Nothing here establishes that
    Jancovich 2005 prints these sequences: it is not in papers/, no DOI for it is verified, the two primer sequences
    in this entry were read from Pallister''s own Methods text, and Pallister''s Introduction describes Jancovich
    2005 as having USED this variable region "to assign four different isotypes to salamander viruses" rather than
    as having designed primers for it. 16F/16R may trace back further still. Re-cite only once the Jancovich paper
    is on disk and its DOI is Crossref-verified, following NOSEMA_bombi_SSU_Kato_2020, which moved to Klee 2006 on
    exactly that evidence and still left oligos_designed_here null because Klee was unread.'
