  notes_curator: 'BOTH PRIMERS VERIFY EXACT against Prepens et al. 2007, confirmed 2026-10-05: they are that paper''s CM-gB round 2 pair, 2744s and 2745as, nesting inside the round 1 pair held by CMV_specific_HERPES_UL55_Glycoprotein_B_gB_Virol_2007_round1. Reading them needed a fix to scripts/verify_oligos_against_paper.py, because the paper spells ambiguous positions out as the literal string (N/I), "N or inosine" - 2745as is printed CGTTGTCCTC(N/I)CC(N/I)ARYTG(N/I)CC - and until that was normalised both primers reported absent. The registry''s N at those positions is the correct reading. BUT THE AMPLICON DISAGREES: the paper''s table gives 250 bp for this pair, where this entry stores 230. The round 1 sibling shows the same pattern, 320 stored against 330 stated, so both are likely one spreadsheet error. NOT CHANGED: this registry measures amplicons on real records rather than quoting them, no sequence database was reachable here, and the precedent cuts against simply believing the paper - the avipox entry measured an invariant 250 bp against a stated 234 and the measurement won. Run both CM-gB pairs against real cytomegalovirus UL55 records and correct the two entries together on what they measure. AMPLICON MEASURED 2026-10-05. The paper contradicts itself on these sizes: Table 1 prints 330 bp (round 1) and 250 bp (round 2), while the Figure 1 legend says ''Amplimers of the first and the second PCR round are 320 bp and 250 bp''. Measured with assaywatch.match against all 12,782 records in the 2026-10-03 Cytomegalovirus (taxid 10358) archive, allowing up to 5 mismatches per primer: this pair gives a product in 742 records, 250 bp in 687 of them and 247 bp in 47 (17 of the products are Macacine betaherpesvirus 3, rhesus CMV). Table and legend agree on 250 and so does the measurement; the stored 230 was wrong and amplicon_bp is corrected to 250. Not the same error as round 1, whose stored 320 the measurement confirms.'
