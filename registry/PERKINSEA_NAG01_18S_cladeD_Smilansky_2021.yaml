  notes_curator: 'Added 2026-10-05 from the paper''s own text, read out of the PDF in papers/ rather than transcribed from any secondary list. Candidate surfaced by the journal sweep in docs/journal/2026-10-04-literature-audit.md; sequences extracted with scripts/extract_candidate_oligos.py and then checked against real GenBank records before the entry was trusted. Amphibian Perkinsea - the pathogenic clade behind mass tadpole mortality events - was absent from the registry. VERIFIED on KP122572.1, the accession the paper itself names as the basis of the fragment: the primers span exactly 287 bp, matching the paper''s stated ''approximately 287-290 bp''. amplicon_bp is therefore both measured and corroborated by the text. PROVENANCE IS SPLIT AND THE PAPER SAYS SO, which is why oligos_designed_here is False. Table 1 marks the forward primer 300F-B as coming from its reference [6], while NAG01R_1 and both probes are marked ''this study''. So Smilansky et al. 2021 designed the reverse primer and the probes but not the forward, and the scope of the forward primer''s claim has to be read from that earlier paper. This is exactly the read-from-versus-designed-by distinction that produced the ranavirus scoping error, caught here before the entry was written because the paper labels its own table honestly. THE PAPER''S ASSAY IS A DUPLEX AND IS SPLIT INTO TWO ENTRIES, one per probe, because the two probes answer different questions on the same amplicon: PPC_P1 (FAM) detects Clade D, the pathogenic Perkinsea clade, and NAG01a-c_P1 (Cy5) detects Clades A-C. Pooling them would collapse a pathogen call and a non-pathogen call into one number. This entry carries the Clade D probe. The probe region is a 113-116 bp variant window inside the amplicon, so a record can yield the product and still not carry this probe''s site - KP122572 is one such record, which is expected rather than a failure. Its sibling is PERKINSEA_NAG01_18S_cladeAC_Smilansky_2021. SCOPED 2026-10-24 to scope_taxids [373149], "uncultured Perkinsea" (rank species, lineage Eukaryota > Sar > Alveolata > Perkinsozoa > Perkinsea > environmental samples), verified live with efetch -db taxonomy. target.taxid 27997 is the Perkinsea CLADE, whose named members are overwhelmingly Perkinsus - marinus, olseni, chesapeaki, mediterraneus and dozens of Perkinsus sp. isolates - which are oyster and mollusc parasites, while this assay is for amphibian NAG01 Perkinsea. THE SCOPE LIST WAS CHOSEN BY MEASUREMENT, not by reading the taxonomy. Grouping this assay''s rows in the 2026-10-24 calls table by record taxid puts EVERY SINGLE DETECTION inside 373149, for both this entry and its sibling, and zero detections anywhere else. The excluded taxa contribute 76 assessable records and 0 detections, almost all Perkinsus olseni (48) and P. marinus, chesapeaki and mediterraneus - exactly the molluscan parasites the primers should not amplify. So 373149 is where this assay''s real targets live and the rest of the clade is pure denominator padding. NOTE THE CONTRAST with Helicobacter_16S_Conley_2021, written up in docs/journal/2026-10-24-scope-audit.md: there, an "environmental samples" node was the WRONG scope because it was a catch-all that did not contain the target. Here the same kind of node is the RIGHT scope, because NAG01 Perkinsea is known almost entirely from environmental 18S clone libraries and that is where its sequences are actually filed. The lesson is that an environmental-samples node has to be checked for what it contains, not judged by its rank or its name. THIS ENTRY, Clade D / PPC (PPC_P1, FAM): the assessable denominator goes from 464 records to 388 and the detected share over the whole calls table from 35.8 percent (166/464) to 42.8 percent (166/388). Whole-archive figures, not the report''s recent window. AND A DISCLOSURE THE SCOPE LIST CANNOT FIX: this entry''s own reference sequence is not reachable. Smilansky et al. section 2.1 states "the PPC assay targets this region in a Rana sphenocephala pathogen (accession: EF675616)". EF675616 carries taxid 453764, Rana sphenocephala pathogen MJY-2007, whose lineage is Eukaryota > Sar > Alveolata > UNCLASSIFIED ALVEOLATA - not under Perkinsozoa at all, so txid27997[Organism:exp] provably cannot retrieve it. That is now flagged as retrieval_scope_incomplete. 453764 is deliberately NOT added to scope_taxids, because scope_taxids filters records that were retrieved and adding an unreachable taxid would look like coverage it does not give; if target.taxid is ever broadened to Alveolata, add 453764 to the scope list at the same time.'
