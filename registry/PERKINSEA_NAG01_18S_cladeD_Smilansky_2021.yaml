  notes_curator: 'Added 2026-10-05 from the paper''s own text, read out of the PDF in papers/ rather than transcribed from any secondary list. Candidate surfaced by the journal sweep in docs/2026-10-04-literature-audit.md; sequences extracted with scripts/extract_candidate_oligos.py and then checked against real GenBank records before the entry was trusted. Amphibian Perkinsea - the pathogenic clade behind mass tadpole mortality events - was absent from the registry. VERIFIED on KP122572.1, the accession the paper itself names as the basis of the fragment: the primers span exactly 287 bp, matching the paper''s stated ''approximately 287-290 bp''. amplicon_bp is therefore both measured and corroborated by the text. PROVENANCE IS SPLIT AND THE PAPER SAYS SO, which is why oligos_designed_here is False. Table 1 marks the forward primer 300F-B as coming from its reference [6], while NAG01R_1 and both probes are marked ''this study''. So Smilansky et al. 2021 designed the reverse primer and the probes but not the forward, and the scope of the forward primer''s claim has to be read from that earlier paper. This is exactly the read-from-versus-designed-by distinction that produced the ranavirus scoping error, caught here before the entry was written because the paper labels its own table honestly. THE PAPER''S ASSAY IS A DUPLEX AND IS SPLIT INTO TWO ENTRIES, one per probe, because the two probes answer different questions on the same amplicon: PPC_P1 (FAM) detects Clade D, the pathogenic Perkinsea clade, and NAG01a-c_P1 (Cy5) detects Clades A-C. Pooling them would collapse a pathogen call and a non-pathogen call into one number. This entry carries the Clade D probe. The probe region is a 113-116 bp variant window inside the amplicon, so a record can yield the product and still not carry this probe''s site - KP122572 is one such record, which is expected rather than a failure. Its sibling is PERKINSEA_NAG01_18S_cladeAC_Smilansky_2021.'
