source:
  nested_round: null
  notes_curator: 'Added 2026-10-19 from candidate oligo extraction (papers/10.1016_s0166-0934_99_00088-9.pdf). Hel1 and Hel2
    target the 2C helicase gene of Caliciviridae. The paper reports Hel1 as 25 nt and Hel2 as 18 nt; the OCR-extracted Hel1
    sequence is only 22 nt, so sequence may be incomplete - needs verification against the paper table. AMPLICON MEASURED
    2026-10-21 as 360 bp in all 5 amplifying records (Vesivirus exanthema and Rabbit vesivirus), a single band, agreeing with
    the paper''s stated ~357 bp within gel-reading error, so declared as a scalar 360 (config.yaml amplicon section says the
    measured size wins). Unimodal, so not a range; only 5 of 84,810 genus records amplify at all, hence thin_evidence below.
    BOTH OLIGOS CORRECTED 2026-10-23, and the cause is one mis-split table cell. Reid et al. 1999 Table 2 prints each primer
    as a 25-mer wrapped after a hyphen: Hel1 "GTCCCAGTATTCGGATTTGTCT-" / "GCG" and Hel2 "AGCGGGTAGTTCAGT-" / "CAAGTTCACC",
    both with length 25 in the table''s own nt column and a 357 bp product. The registry held Hel1 truncated to its first
    line (22 nt) and Hel2 as Hel1''s wrapped tail GCG glued onto Hel2''s first line (18 nt) - so the continuation of one primer
    had been prepended to the next. Corrected to the printed 25-mers. oligos_designed_here set to FALSE: Table 2''s footnote
    reads "** Originally described by Neill and Seal (1995)", i.e. Neill, J.D. and Seal, B.S., Mol. Cell. Probes 9, 33-38,
    which Reid''s own introduction also names as the source of Hel1/Hel2; Reid is where they are printed and read, not where
    they were designed. NEEDS A RESCREEN, and the declared 360 bp should be re-measured against the table''s 357. CONFIRMED
    AGAINST THE DESIGN PAPER, and the 0 percent that follows is a SCORING artefact, not drift. Reid''s footnote credits Neill,
    J.D. and Seal, B.S. 1995, Mol Cell Probes 9:33-38, which is 10.1016/S0890-8508(95)90962-1 and was fetched over the Elsevier
    API on 2026-10-23. Its Methods print the four oligonucleotides it designed, and Hel1 reads GTCCCAGTATTCGGATTTGTCTGCG and
    Hel2 AGCGGGTAGTTCAGTCAAGTTCACC - both exactly as now stored, and Hel1 ending GCG exactly as Reid prints it. So two independent
    papers agree on the sequences and the 25 nt lengths, and the corrected forms are right. MEASURED against the 84,805-record
    Caliciviridae archive: Hel2 has an exact site in 17 records where the old mis-split 18-mer had none, so that correction
    is a clear gain. Hel1 has an exact site in NONE, while its first 22 bases match 16 records - and on all 16, which are
    the designers'' own targets (vesicular exanthema of swine virus, San Miguel sea lion virus and skunk calicivirus, the
    U146xx series), the template base under Hel1''s 3''-terminal position is C where both papers print G. So the published
    primer carries a single 3''-terminal mismatch against its own target sequences. `terminal_mismatch_fails: true` makes
    that fatal on its own, which is why the detected share moved from 5/18 to 0/30 when the wrap was repaired; but this is
    a CONVENTIONAL PCR, Reid reports the assay working, and a 3''-terminal mismatch is far more tolerable in endpoint PCR
    than in a hydrolysis probe. This entry is therefore a worked example of the per-chemistry scoring gap in ROADMAP Phase
    2 and must not be read as coverage loss. The sequences stay as published, per the Circovirus precedent that where a paper
    and the records disagree the registry keeps the published sequence and discloses. SCOPED 2026-10-24 to scope_taxids [3433198]
    (Vesivirus exanthema), rank species under Caliciviridae > Vesivirus. Reid 1999 is titled "detection of marine caliciviruses"
    and reports feline calicivirus negative; taxid 11974 is the whole family and is 99.9 percent norovirus. Measured over
    the WHOLE 2026-10-24 calls table, which is not the report''s recent window and not patent-filtered: of 84,806 screened
    records, 67,509 are a known taxid outside the scope and drop out of the drift denominator, 49 are inside it and 17,248
    carry no taxid in data/retrieved/.meta.taxid.backfill.tsv.gz. drift.py keeps a record whose taxid is unknown (the filter
    drops only a KNOWN out-of-scope taxid), so the assessable denominator goes 30 -> 24, not 30 -> 7. The 0 percent does NOT
    move, and that is the expected result: 17 of the 24 remaining failures are the U146xx/U184xx and U1847x series, i.e. the
    designers'''' own vesicular exanthema and San Miguel sea lion sequences, which are exactly the records carrying the 3''''-terminal
    G/C mismatch documented above. So after scoping, this entry''''s 0 percent rests almost entirely on its own design targets
    and is unambiguously the terminal-mismatch SCORING artefact, no longer confounded with 67,509 noroviruses the assay was
    never meant to detect. The scope fix is still correct: it removes the confound, it is not a repair of the artefact, which
    waits on per-chemistry scoring (ROADMAP Phase 2). RE-CITED 2026-10-24 to the design paper, a maintainer decision. citation.doi
    moves from Reid et al. 1999 (10.1016/S0166-0934(99)00088-9) to Neill & Seal 1995 (10.1016/S0890-8508(95)90962-1), design_year
    from 1999 to 1995, and oligos_designed_here from false to TRUE, because the cited paper is now the paper that designed
    these primers rather than the one that printed them. The oligos_from_secondary_source flag is removed for the same reason:
    there is no longer a secondary source in the chain. THE EVIDENCE, and it is unusually strong for a provenance change here.
    Reid''s Table 2 footnote reads "** Originally described by Neill and Seal (1995)" and Reid''s own introduction names them
    as the source. The 1995 paper is titled "Development of PCR primers for specific amplification of two distinct regions
    of the genomes of San Miguel sea-lion and vesicular exanthema of swine viruses" - it declares itself the design paper
    in its own title, and the organisms it names are exactly the Vesivirus exanthema scope this entry was given earlier today.
    Its full text is held locally as the Elsevier JATS deposit papers/10.1016_s0890-8508(95)90962-1.xml, and searching it
    finds BOTH stored oligos verbatim: Hel1 GTCCCAGTATTCGGATTTGTCTGCG and Hel2 AGCGGGTAGTTCAGTCAAGTTCACC. So two independent
    papers print identical sequences and identical 25 nt lengths. SCOPED TO THIS ENTRY ONLY. Neill & Seal describe "two distinct
    regions", so the sibling CALICIVIRUS_ssRNA_Capsid was checked against the same full text and its primers are NOT there:
    Reid-1F GTGAGGTGTTTGAGAATTAG and Reid-1R ACATCAATTCCGCCAGACCA are both absent. Those are Reid''s own, which is what their
    names say, so that entry keeps its Reid citation and is not re-cited. WHAT THIS CHANGES BEYOND BOOKKEEPING, stated because
    it is not purely clerical: design_year dates the drift baseline, i.e. which deposits the designers could plausibly have
    seen. Moving it 1999 -> 1995 moves that boundary back four years for this entry. That is the correct boundary - the primers
    really were designed in 1995 - but it is a number that feeds scoring, not just a label. AND A TRANSCRIPTION ERROR CORRECTED
    ON THE WAY. The old reference string read "J Virol Methods 82:63-73", but Crossref gives 82:99-107 for 10.1016/S0166-0934(99)00088-9
    ("Development of a reverse transcription polymerase chain reaction procedure for the detection of marine caliciviruses..."),
    which is what the sibling Capsid entry already had - so the two entries disagreed about the pages of the one DOI they
    shared. The new reference uses Crossref''s own figures for the 1995 paper, 9:33-37; note the curator note above says 33-38,
    which is one page out and is superseded here.'
needs_review:
- flag: primer_site_polymorphic
  note: Hel1's 3'-terminal G mismatches the C in all 16 target records, so a qPCR-strength terminal rule scores every record
    as fail
- flag: thin_evidence
  note: the 360 bp size rests on 5 amplifying records of 84,810 in the genus; the assay detects almost nothing in GenBank
