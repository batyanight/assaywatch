  notes_curator: 'Added 2026-10-05 from the paper''s own Table 1, read out of the local PDF. The table prints the N3R assay
    as N3R-F319, N3R-R457 and the MGB probe N3Rp352S-MGB (6FAM/MGBNFQ), with a stated amplicon of 139 bp. amplicon_bp is the
    STATED size pending measurement against real records. MEASURED 2026-10-05 against a 50-genome sample of taxid 10244 drawn
    from the 12,274 nuccore records of 150-250 kb by date order and strided, so the sample spans 2003 to 2025 rather than
    the head of the list (which for monkeypox is almost all 2022 clade IIb). The full archive was not retrieved: 12,868 records
    at genome length is a download that belongs to a planned pipeline run, so the amplify check still reports WARN no-archive
    for these two entries and should be re-run after one. N3R gives a product in 35 of the 50, 139 bp in 34 of those and 140
    in one, so amplicon_bp 139 is the paper''s stated size confirmed by measurement. THE PROBE SITE HAS DRIFTED AND THAT IS
    THE FINDING WORTH HAVING: N3Rp352S-MGB is exact in only 5 of the 50 genomes, sits one mismatch away in 36 (template TATAACGGCGACGAATATACT
    against the probe''s TATAACGGCGAAGAATATACT, an A/C difference 10 bases in), and five or more mismatches away in 9. A single
    central mismatch under an MGB probe is where this chemistry is least forgiving, which is the reason the registry records
    chemistry per entry. The forward primer N3R-F319 is exact in 42 and effectively absent in 8, five of which are deposits
    labelled ''partial genome'' and so may simply not cover the locus. Nothing is changed: the oligos are what Table 1 prints,
    this is a drift observation for the report, and it wants the full archive and the proper screen behind it before any number
    is published. Compare the sibling entry MONKEYPOX_dsDNA_F3L_MGB_Kulesh_2004, whose probe is exact in all 50 - of the paper''s
    two assays, F3L is the one that has aged well.'
