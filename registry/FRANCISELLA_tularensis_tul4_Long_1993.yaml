  notes_curator: 'Added 2026-10-05 from the paper''s own text, read out of the PDF in papers/ rather than transcribed from any secondary list. Candidate surfaced by the journal sweep in docs/2026-10-04-literature-audit.md; sequences extracted with scripts/extract_candidate_oligos.py and then checked against real GenBank records before the entry was trusted. Tularemia was absent from the registry. VERIFIED on a tul4-containing contig (NZ_RJDA01000027.1): both primers match with ZERO mismatches and span a 250 bp product. amplicon_bp is measured; the paper states no size. ORIENTATION, which is worth recording because it looked wrong at first. On that contig Ff642 reads on the plus strand and Ff393 only as its reverse complement, i.e. the opposite of the assignment here. That is simply the gene lying on the contig''s minus strand: the primer names encode positions 393 and 642 in the tul4 reading frame, so in gene coordinates Ff393 is the forward and Ff642 the reverse, which is how they are stored. The screener accepts either orientation, so the call is unaffected either way. THE PAPER''S PROBE IS DELIBERATELY OMITTED. Long et al. detect the product by hybridisation with an oligonucleotide probe, FT443, rather than by fluorescence, so this is a conventional PCR and a probe is not required. More importantly the probe sequence as read from this 1993 scan carries 8 mismatches against the same contig where both primers match perfectly, which means the OCR mangled it. Entering a sequence known to be corrupt would be worse than leaving it out. A clean copy of Table/text would let it be added.'
