  notes_curator: 'ADDED 2026-10-27 from the open-access full text (PMC9633113, Europe PMC) Table 1 "Primers and probes designed
    in this study" and Section 2.3, which assigns each probe to its target by reporter dye. Panel 1 shares one primer pair
    across its probes; each probe is one entry here, the pattern the Li 2010 G2R trio uses. This probe is the one Section
    2.3 labels FAM/BHQ1, specific to MPXV clades IIa and IIb. The locus is the F3L region: Section 2.1 names F3L as the cloned
    target and Fig. 1A gives the probe-flanking positions 46313-46339 and 46467-46491. SCOPE: clade II has no NCBI node (see
    the Li 2010 siblings), so the entry is unscoped and carries scope_narrower_than_taxid. AMPLICON NOT STATED BY THE PAPER.
    MEASURED 2026-10-27 by screening this entry against every archive of taxids 10244 and 10242: 179 bp in 28,847 of 28,921
    products (185 bp in 67) over 35,539 records of the 10244 and 10242 archives; calls detect 20,675 / reduced 529 / fail
    7,696 / no_amplicon 6,618 -- the fails are the clade I records this probe is designed not to bind. DOI resolved through Crossref by scripts/resolve_citations.py on 2026-10-27; status draft; only a maintainer sets active.'
