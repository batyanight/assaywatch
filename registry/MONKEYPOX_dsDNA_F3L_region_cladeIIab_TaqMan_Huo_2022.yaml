  notes_curator: 'ADDED 2026-10-27 from the open-access full text (PMC9633113, Europe PMC) Table 1 "Primers and probes designed
    in this study" and Section 2.3, which assigns each probe to its target by reporter dye. Panel 1 shares one primer pair
    across its probes; each probe is one entry here, the pattern the Li 2010 G2R trio uses. This probe is the one Section
    2.3 labels FAM/BHQ1, specific to MPXV clades IIa and IIb. The locus is the F3L region: Section 2.1 names F3L as the cloned
    target and Fig. 1A gives the probe-flanking positions 46313-46339 and 46467-46491. SCOPE: clade II has no NCBI node (see
    the Li 2010 siblings), so the entry is unscoped and carries scope_narrower_than_taxid. AMPLICON NOT STATED BY THE PAPER.
    MEASURED 2026-10-27 by screening this entry against every archive of taxids 10244 and 10242: 179 bp in 28,847 of 28,921
    products (185 bp in 67) over 35,539 records of the 10244 and 10242 archives; calls detect 20,675 / reduced 529 / fail
    7,696 / no_amplicon 6,618 -- the fails are the clade I records this probe is designed not to bind. DOI resolved through
    Crossref by scripts/resolve_citations.py on 2026-10-27; status draft; only a maintainer sets active.


    EXCLUSIVITY TAXIDS ADDED 2026-10-28, from the paper''s own specificity claim: "All three new MPXV generic and specific
    assays did not cross-react with variola, cowpox, camelpox, taterapox, ectramelia, vaccinia and Raccoonpox virus DNA."
    ("ectramelia" is the paper''s spelling of ectromelia.) Taxids looked up live with esearch, not from memory: variola 10255,
    cowpox 10243, camelpox 28873, taterapox 28871, ectromelia 12643, vaccinia 10245 (NCBI''s Orthopoxvirus vaccinia), raccoonpox
    10256. All seven are siblings of monkeypox under Orthopoxvirus (10242), so none is inside this entry''s own target subtree.
    Together they are 3,772 nuccore records of 100-100,000,000 nt, against 1.6M already on disk, so the retrieval is cheap.
    NOT added to ORTHOPOXVIRUS_dsDNA_F3L_region_nonMPXV_TaqMan_Huo_2022, whose TARGETS they are, and not to the two B.1 SNP
    entries, whose claim is lineage-level inside MPXV and cannot be written as a taxid.'
