  notes_curator: 'Detects to 1:10,000 dilution of blue iguana positive control (spreadsheet) PUBLISHED, FOUND 2026-10-05 by
    a Europe PMC full-text search on the primer sequences. Conley et al. 2021 (PMC7894872) prints all three oligos exactly
    as stored - GCBI-Helico-F, GCBI-Helico-R and a 6FAM/MGBNFQ TaqMan probe - and states ''we developed a Taqman qPCR assay
    specific for Helicobacter sp. Grand Cayman Blue Iguana 1 (GCBI1)'', with a 194 bp product, matching the stored amplicon_bp
    and the sheet''s blue iguana positive control. SCOPE NOTE: the paper designs this for one provisional Helicobacter species,
    the probe sitting on a 14 bp insertion unique to it, while target is the whole genus Helicobacter (taxid 209). Judged
    against the genus it will look like poor coverage, and that is a scope mismatch, not drift. The sheet''s ''XREACTS with
    general bac'' is lab experience the paper does not report. CONFIRMED AGAINST THE PAPER ITSELF, later on 2026-10-05. The
    Conley 2021 PDF was fetched as gold open access, and all three oligos - both primers and the probe - now verify exact
    against it directly rather than through a full-text search. AMPLICON NOT MEASURABLE, AND THAT IS THE FINDING, 2026-10-05.
    The new scripts/check_amplicons.py flags this entry as disagreeing with its stored 194 bp, measuring 178 bp in 206 records
    and 180 in 178. The flag is an artefact of scope and the stored 194 should NOT be changed. Screening the whole Helicobacter
    archive for Conley''s probe, CTGGATACTCCCCAAGGGGATACC, returns ZERO records with an exact site - not one. The probe was
    designed on a 14 bp insertion the paper says is unique to Helicobacter sp. Grand Cayman Blue Iguana 1, a provisional species,
    and that organism is simply not represented in GenBank''s Helicobacter nucleotide records. So every product the measurement
    found came from a non-target Helicobacter, and 194 minus the 14 bp insertion is 180, which is exactly the second peak.
    The paper''s figure is right for the organism the assay is for; the database cannot corroborate it because the organism
    is not in the database. This is the general caveat for any species-specific assay screened against a genus archive, and
    it is the reason check_amplicons.py reports rather than edits.'
