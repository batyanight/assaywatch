  notes_curator: 'UNPUBLISHED PRIMER REMOVED 2026-11-01, due to insufficient documentation. The forward had been stored as
    ACTYCTACGGGAGGCAGCAGTA, a C->Y widening of the paper''s GPO-1 that no publication prints, while the paper''s own form
    appears in 54 open-access papers 2020-2026 (Europe PMC, both strands, 2026-11-01). The registry now stores the printed
    ACTCCTACGGGAGGCAGCAGTA. The oligo name GPO-1FMod is left as first entered and no longer describes the stored sequence.
    The reverse primer remains absent from the cited paper, which is a separate problem and keeps its own flag. A RESCREEN
    IS OWED. CHECKED against van Kuppeveld et al. 1992 on 2026-10-05 (doi:10.1128/aem.58.8.2606-2615.1992, verified against
    Crossref: van Kuppeveld, van der Logt, Angulo, van Zoest, Quint, Niesters). The id''s ''Van'' is van Kuppeveld; the citation
    had no author recorded and now does.\nGPO-1FMod is a ONE-BASE modification of the paper''s GPO-1, now pinned down exactly.
    The paper prints GPO-1 as ACTCCTACGGGAGGCAGCAGTA at 16S positions 338-359; the stored sequence is ACTYCTACGGGAGGCAGCAGTA,
    differing only at position 4, C -> Y. That broadens a fixed C to C/T, so it is a deliberate degeneracy widening consistent
    with the ''Mod'' in the oligo name, not a transcription slip. The published sequence is recorded as modified_from rather
    than substituted in; no publication of the modified form was found (Europe PMC full text, 2026-10-23), so modification_doi
    is empty. oligos_designed_here is False because only the backbone is van Kuppeveld''s.\nMycoRev1 (GCGRCTGCTGGCACATAGTTWG)
    is NOT in this paper - the checker found no listed oligo within four edits, and the paper''s own reverse primers are GPO-2,
    MGSO, UUSO and the Mseq set, none of which it resembles. So this pair is a composite: a modified van Kuppeveld forward
    with a reverse primer from an unnamed source. Flagged.'
