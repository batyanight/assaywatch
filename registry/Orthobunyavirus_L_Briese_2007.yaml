  notes_curator: 'Added 2026-10-04 from Briese et al. 2007 Table 1 (doi:10.1007/s00705-007-1069-z), read from the paper itself.
    The table gives each primer''s sequence and the genome position of its 3''-terminal base, numbered on the Bunyamwera virus
    prototype 1943 reference (D00353 = S, M11852 = M, X14383 = L). Degenerate positions are printed as lower-case IUPAC codes
    and are transcribed here in upper case; sequences are printed in triplets, which is how each primer''s length was checked.
    Non-authentic (cloning-tail) bases are marked in the table by a distinct italic font, and NONE of the primers in this
    entry carries one except where tail_5prime is set below. amplicon_bp is COMPUTED, not quoted: the paper gives 3'' positions,
    not product sizes, so the product is taken as the span from the forward primer''s 5'' base to the reverse primer''s 5''
    base using the printed 3'' positions and the primer lengths. BUNL-5n carries a 6 nt italic tail (CGCCGC); its 15 nt of
    authentic sequence has its 3'' base at 15, so it binds 1-15, the L-segment 5'' terminus. BUNL650R is 30 nt with its 3''
    base at 601, so it binds 601-630; the product is 1-630 = 630 bp. The arithmetic is corroborated by the primer names, which
    encode their own positions (BUNS-3-L947 at 947, BUNL650R at 601-630). Treat the size as approximate: it is exact only
    on the Bunyamwera reference, and these are consensus primers meant for a whole serogroup. SCOPE. The paper designed these
    from an alignment of ''orthobunyaviruses of the CE and BUN serogroups and Guaroa virus'', so the claim is the California
    encephalitis and Bunyamwera serogroups, not the whole genus. The registry target is genus Orthobunyavirus (~18 serogroups),
    so a low detected share here is very likely scope rather than drift. Screening the two assays already in the registry
    on 2026-10-04 showed the pattern plainly: strong on the design serogroups (Cache Valley 14/15, Maguari 4/5) and near-zero
    on Simbu-serogroup viruses (Oropouche 0/24, Akabane 0/7, Schmallenberg 0/7, Manzanilla 0/4). Left unscoped pending the
    registry-wide decision on lineage scoping. The L segment was not covered by the registry before this entry. Its own retrieval
    query, so it fetches a separate archive from the S/M assays. BUNL-5n''s authentic part is 15 nt, exactly at the oligo
    floor. CORRECTED 2026-11-06: the paper states its alignment for the M segment only; the design basis of the S and L primers
    isn''t stated. SIZE READ AND SETTLED 2026-11-10 (ROADMAP, "Sizes to read, from the verifier''s table"). One rule over
    all eleven entries on that list: amplicon_bp takes the measured modal product length where one mode holds a clear majority,
    and the measured median where none does, with amplicon_multimodal in the second case; the flag says whether the CITED
    paper publishes a size (amplicon_disagrees_with_paper) or does not (amplicon_measured_not_published); and a value is only
    moved where the new +/-25% window still admits every product measured, so a correction cannot silently delete calls. Measured
    on the 2026-11-01 calls. Briese L: 630 -> 584, the MEDIAN and not the modal 505 the verifier''s table noted, because a
    505 declaration would window 379-631 bp and drop the 641 and 642 bp products that are measured and real. 584 windows 438-730
    bp and admits all 158. Unlike its M3560_F and BUNS_5_U_6 siblings this entry gets no amplicon_bp_range: those were declared
    where a scalar CLIPPED the species continuum, and here the old window did not clip, so a range would only widen the window
    with nothing measured to justify it.'
