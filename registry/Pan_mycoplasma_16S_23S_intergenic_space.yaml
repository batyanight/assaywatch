  notes_curator: 'CITATION ADDED 2026-10-04 by the provenance audit, on sequence evidence rather than inference. This entry had no citation at all, but its forward primer ''16-23 F1 (Rebelo F)'' is byte-identical to RebeloF in Pan_mycoplasma_16S_23S_intergenic_space_Rebelo_2011, which carries doi:10.1177/1040638711416846 (verified against Crossref: Rebelo, Parker & Cai, J Vet Diagn Invest 23:932-936). So half of this pair is Rebelo 2011 and the partner is from elsewhere - unpublished or in-house, the source spreadsheet does not say. oligos_designed_here is False because the pair as entered is a composite, and Rebelo 2011''s claims bound only one of the two primers. Three registry entries share Rebelo oligos and only one named the paper; that is the same read-from-versus-designed-by confusion that produced the ranavirus scoping error. | Oligo annotations moved from name field: 16-23-F1 (forward): Rebelo F'
