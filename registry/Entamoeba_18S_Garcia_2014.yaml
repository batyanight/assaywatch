  notes_curator: 'UNPUBLISHED PRIMERS REMOVED 2026-11-01, due to insufficient documentation. Both oligos had been stored as
    degenerate widenings that no publication prints; the registry now stores the forms the cited paper prints. The entry is
    deprecated and do_not_use, so no verdict depends on this. Recorded as not for use: cross-reactive with host DNA, and GEI18SR
    as first entered is the wrong strand and needs reverse-complement. THE WRONG-STRAND ALTERNATE IS REMOVED, 2026-10-23.
    This entry held a second GEI18SR under `alternates`, TACGTCCCTGCCCTTTGTAC, the form the paper prints verbatim - but that
    is the TARGET strand at the reverse primer''s site, not the oligo. Checked against GenBank AF149905 (Entamoeba invadens
    18S): the printed GEI18SF site and the printed GEI18SR string both lie on the sense strand, at 1308 and 1799, giving a
    511 bp product inside the 450-535 bp the paper states. So the primary reverse slot, stored as the reverse complement with
    two widened positions, is the correct molecule and the alternate was a non-oligo being screened as a primer. Removed,
    and recorded here instead. GEI18SF and GEI18SR are both degenerate variants of the printed pair (CTT to YYY in the forward,
    two widened positions in the reverse), now carried in modified_from; an exact-phrase Europe PMC search finds neither stored
    form, so the widening is unpublished. CORRECTED 2026-11-10: the pairing flag''s note (''lists several primers in one block'')
    was false, and the closing sentence about degenerate variants in modified_from is stale: the stored forms are the printed
    ones.'
