  notes_curator: 'VERIFIED AGAINST THE PAPER FOR THE FIRST TIME 2026-10-20. This entry''s DOI is parenthesised, so verify_oligos_against_paper.py
    had never reached the local PDF - it read no-full-text, "no local PDF", while the file sat in papers/. Cause and fix in
    that script''s doi_stem(). Result: Borna-NF reads near:2. Stored GCCTTGTGTTTCTATGTTTG, paper prints GCCTTGTGTTTCTATCTTTC
    - same length, so this is not the end-glue case at all, and the two differences sit at positions 16 and 20, the second
    being the 3''-terminal base. A primer whose 3'' terminus is wrong is the single most consequential kind of registry error,
    and with terminal_mismatch_fails: true it would also change this assay''s calls. Not changed: this needs the PDF read
    by eye, and if the paper is right the entry''s calls are currently measuring a primer nobody used. CORRECTION ATTEMPTED AND REVERTED, 2026-10-23, by measurement.
    Zimmermann et al. 1994 prints its internal (nested) pair under "Internal (nested) primers:" as antisense
    5''-ATT CTT TAC CTG GGG ACT CA-3'' and sense 5''-GCC TTG TGT TTC TAT CTT TC-3'' (read by eye in the PDF and in the
    publisher XML, which agree, so this is not an extraction artefact). The stored forward was GCCTTGTGTTTCTATGTTTG: the
    last four bases were wrong, including the 3''-terminal base, which under terminal_mismatch_fails is the single most
    load-bearing position in the molecule. The stored form appears nowhere in Europe PMC full text, so it was a
    transcription error and not a modification. Corrected to the paper''s GCCTTGTGTTTCTATCTTTC, which is also what the
    sibling entry BORNA_VIRUS_N_gene_Zimmermann_1994_round2 already stored as BornaNestF. The likely origin of the error
    is the paper''s external sense primer GTCACGGCGCGATATGTTTC, whose tail the stored sequence ends with. NEEDS A
    RESCREEN: every call for this assay was made with the wrong 3'' end. THE REVERT, and why. Changing the stored sequence to the printed one
    and rescreening took this assay from 308/456 detected (67.5 percent) to 0/372 (0.0 percent). Measured over all
    1,516 records in the Orthobornavirus archive, the template bases following the shared 15-mer GCCTTGTGTTTCTAT are
    GTTTG in 260 records, GCTTG in 42 and GTCTG in 1 - and the paper''s CTTTC in NONE. So the printed form carries
    two mismatches to every known record, one of them at the 3''-terminal base, which `terminal_mismatch_fails`
    makes fatal by itself; a nested primer that never matched its own target is less likely than a transcription or OCR
    error in a 1994 scan. The stored form is restored and the printed form is recorded as modified_from so the
    disagreement stays visible. NOTE FOR THE MAINTAINER: the sibling BORNA_VIRUS_N_gene_Zimmermann_1994_round2 stores
    the PRINTED form as BornaNestF, so by this measurement that entry cannot detect anything by construction. It is
    flagged there and deliberately not changed here. SCOPED 2026-10-24 to scope_taxids [1714619, 12455]. taxid 178830 is the whole Bornaviridae family, while Zimmermann et al. 1994 is a Borna disease virus assay: its title is "Detection of Borna disease virus RNA in naturally infected animals by nested PCR". Both taxids are needed and the second is the trap: 1714619 is Orthobornavirus bornaense (rank species, under Bornaviridae > Orthobornavirus), but 12455 "Borna disease virus" sits under Bornaviridae > UNCLASSIFIED Bornaviridae, not under the genus, so a scope list built from the genus node alone silently drops 49 genuine BoDV-1 deposits. Both taxids verified live with efetch -db taxonomy on 2026-10-24. Measured over the WHOLE 2026-10-24 calls table, which is neither the report''s recent window nor patent-filtered: of 1,519 screened records 1,003 are a known taxid outside the scope, 513 are inside it and 3 carry no taxid, so about two thirds of the denominator was a different virus - carbovirus, cultervirus and the parrot, serin and estrildid orthobornaviruses. Note that drift.py''s filter drops only a KNOWN out-of-scope taxid, so the 3 unknowns stay in.'
