  notes_curator: 'Added 2026-10-04 from Briese et al. 2007 Table 1 (doi:10.1007/s00705-007-1069-z), read from the paper itself rather than from any secondary list. The table gives each primer''s sequence and the genome position of its 3''-terminal base, numbered on the Bunyamwera virus prototype 1943 reference (D00353 = S, M11852 = M, X14383 = L). Degenerate positions are printed as lower-case IUPAC codes and are transcribed here in upper case; sequences are printed in triplets, which is how each primer''s length was checked. Non-authentic (cloning-tail) bases are marked in the table by a distinct italic font, and NONE of the primers in this entry carries one except where tail_5prime is set below. amplicon_bp is COMPUTED, not quoted: the paper gives 3'' positions, not product sizes, so the product is taken as the span from the forward primer''s 5'' base to the reverse primer''s 5'' base using the printed 3'' positions and the primer lengths. Cac-2-FWD is 20 nt with its 3'' base at 290, so it binds 271-290; Cac-7-REV is 20 nt with its 3'' base at 722, so it binds 722-741; the product is 271-741 = 471 bp. The arithmetic is corroborated by the primer names, which encode their own positions (BUNS-3-L947 at 947, BUNL650R at 601-630). Treat the size as approximate: it is exact only on the Bunyamwera reference, and these are consensus primers meant for a whole serogroup. SCOPE. The paper designed these from an alignment of ''orthobunyaviruses of the CE and BUN serogroups and Guaroa virus'', so the claim is the California encephalitis and Bunyamwera serogroups, not the whole genus. The registry target is genus Orthobunyavirus (~18 serogroups), so a low detected share here is very likely scope rather than drift. Screening the two assays already in the registry on 2026-10-04 showed the pattern plainly: strong on the design serogroups (Cache Valley 14/15, Maguari 4/5) and near-zero on Simbu-serogroup viruses (Oropouche 0/24, Akabane 0/7, Schmallenberg 0/7, Manzanilla 0/4). Left unscoped pending the registry-wide decision on lineage scoping. This is the second of the two S-segment pairs in Table 1 and the only one run at 52 C, the highest annealing temperature in the paper, which suggests it is the more specific of the two. The paper never says what ''Cac'' stands for and cites its reference [8] for the consensus primer panel, so the intended target is not stated: Cache Valley virus is the obvious reading given the paper''s subject, but that is an inference and is flagged rather than recorded as fact. Screened on 2026-10-04 against the existing orthobunyavirus archive: 73 evaluable of 2,056, 40 detected (55%). What it detects supports the stated design scope and is better evidence than the guess about the name: Batai 8/8, Cache Valley 4/4, Guaroa 4/4 (the paper names Guaroa explicitly as one of the inputs to its design alignment), Ilesha 3/3, Germiston, Bunyamwera, Sororoca - Bunyamwera serogroup throughout.'
