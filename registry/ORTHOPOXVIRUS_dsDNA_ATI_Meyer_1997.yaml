species_sizes:
# Measured from the 2026-10-17 archive by scripts/measure_species_sizes.py, with
# 108 patent-division records excluded (they give a construct's length, not a
# species': docs/journal/2026-10-19-orthopox-ati-vaccinia.md). A length is kept at >= 2
# records and >= 2% of the species' records; kept lengths cluster where a step
# exceeds 12 bp. Bands cover 88% of monkeypox records, 93% of vaccinia, 94% of
# cowpox and all of every other species. Not a key: vaccinia 1587-1615 and
# cowpox 1598-1601 overlap, so a band in that region does not name one species.
# Only records the assay would amplify (detect or reduced) count. The skunkpox row
# below is the exception, added by hand on 2026-10-20: its product is bench-confirmed
# by Meyer's own Table 1 (530 bp) while this pipeline scores it fail at 3.5 against a
# 3.0 cutoff, on five mismatches 9-18 nt from the 3' end with the 3' octamer clean.
# See docs/journal/2026-10-20-meyer-ati-bench-panel.md.
# Two further fail-scored bands were left out on purpose, both measured:
#   vaccinia 1226 bp is Modified Vaccinia Ankara (U94848 and MVA-derived constructs),
#     a real strain with a real ATI deletion, but 6 bp from the ectromelia 1220 band,
#     so admitting it would make that reading ambiguous without adding a species.
#   camelpox 615 bp rests on two patent deposits titled "Modified Microbial Nucleic
#     Acid", which the patent-title fallback cannot see (assaywatch/metadata.py).
# `scripts/measure_species_sizes.py --include-fail` reproduces all three; it is not
# what populated this block, and should not be until the is_patent backfill lands.
