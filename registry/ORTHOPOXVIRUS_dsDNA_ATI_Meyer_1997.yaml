  notes_curator: 'Added 2026-10-06. WHAT THE PAPER IS (the index had no title): Meyer H, Ropp SL, Esposito JJ, J Virol Methods
    64:217-221 (1997), accepted 25 Oct 1996, ''Gene for A-type inclusion body protein is useful for a polymerase chain reaction
    assay to differentiate orthopoxviruses''. DOI: the paper prints its PII as S0166-0934(96)02155-6, which is DOI 10.1016/S0166-0934(96)02155-6;
    doi_verified stays false for the resolver. READ: papers/10.1016_s0166-0934_96_02155-6.pdf is a scan with an OCR text layer.
    The page carrying the primers (page 3) was rendered at 200 dpi and read by eye: ATI-up-1 5''-AATACAAGGAGGATCT-3'' (16
    nt) and ATI-low-1 5''-CTTAACTTTTTCTTTCTC-3'' (18 nt). The cycling is 25 cycles with 40 °C annealing, a low-stringency
    consensus pair; oligos_designed_here is null (the paper extends Meyer et al. 1994 but does not say the oligos were first
    published there). DIFFERENTIATION ASSAY: one consensus pair across the genus, with product LENGTH (and an XbaI digest)
    identifying the species. MEASURED AMPLICON SIZES BY SPECIES: now the structured `species_sizes` field above,
    remeasured 2026-10-19 from the whole archive with patent records excluded. The hand measurement this
    replaces (2026-10-06) read: volepox 542 bp; skunkpox 551 bp; ectromelia 1220 bp; camelpox 879 bp; variola
    1576–1583 bp; monkeypox 1067 bp (clade I) or 1533–1545 bp (clade IIb, mode 1538 bp); vaccinia 1594–1606 bp;
    cowpox 1673 bp. The remeasurement agrees except that it adds bands the hand pass missed (vaccinia 1547 and
    1671, cowpox 1598–1601 and 1505, akhmetapox 1505, taterapox 1628) and drops skunkpox, whose records score
    fail. APPROXIMATE RANGE: 540–1700 bp. The paper''s stated sizes differed
    by 1–32 bp from measured values for several species (unresolved whether paper error, gel sizing, or isolate-specific).
    Measured on: every GenBank Orthopoxvirus (txid10242) genome 100–400 kb (542 non-monkeypox records), plus 162 monkeypox
    strided every 80th, plus 155 ATI-titled records. Non-monkeypox genomes: 410 detect, 79 reduced, 48 fail, 5 no_amplicon
    (75.6% detect among spanning). Monkeypox: 157 detect of 162 (96.9%). Why non-detects in monkeypox and variola: consensus
    pair has obligate mismatches in some lineages; pipeline rules score them as reduced or fail. NO REGISTRY OVERLAP: no 15
    nt window of either primer occurs in existing poxvirus entries. SCOPE: genus-wide; interpret results by species, not by
    genus-wide share.'
