  notes_curator: 'Scoped away from the fish ranaviruses on 2026-10-04. Johnson et al. 2008 is a study of ranavirus infection in box turtles and tortoises with Frog virus 3 as the positive control, so the published claim is about FV3-like ranaviruses of amphibians and reptiles; it says nothing about the fish ranaviruses. Before scoping, 54 of this assay''s 61 failing records were fish viruses (Largemouth bass virus, Mandarin fish ranavirus, Siniperca chuatsi ranavirus, Singapore grouper iridovirus, short-finned eel ranavirus), i.e. the tool was reporting as assay failure the fact that the assay was being judged outside its scope. The query excludes the five ICTV fish species of the genus by taxid rather than by name: Ranavirus perca1 (EHNV/ECV/ESV), micropterus1 (Santee-Cooper/LMBV), epinephelus1 (grouper), gadus1 (cod) and Macropharyngodon choati ranavirus. 1,466 records before, 1,265 after, so the amphibian/reptile records and the 364 still-unclassified ones are all kept. CAUTION for anyone editing this: the query repeats txid10492 inside itself on purpose. retrieve.build_query wraps an assay query in parentheses and ANDs it, and Entrez silently DROPS a leading NOT in that position - the form `AND (NOT (fish))` returns the fish records only, which is the exact inverse of what is wanted and fails without an error. Note the two Pallister 2007 assays are deliberately NOT scoped this way: that paper is in J Fish Dis and develops its assays on Australian and European FISH ranaviruses, so for those the fish records are the design scope. The Santee-Cooper group that all three MCP assays miss is not covered by any assay in this registry.'
