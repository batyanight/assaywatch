  notes_curator: 'SCOPING REVERTED 2026-10-04, same day it was applied. These primers were scoped away from the fish ranaviruses on the reasoning that Johnson et al. 2008 is a box-turtle and tortoise study. Reading Grizzle et al. 2003 (doi:10.3354/dao054029) showed that was wrong on the facts. The oligos here are byte-identical to FV3-54F / FV3-584R of Mao et al. 1997, which Grizzle quotes in full and describes as amplifying ''DNA from all the ranaviruses tested, including LMBV'' while not amplifying red seabream iridovirus. So the published claim for this primer pair is PAN-RANAVIRUS, including the fish species; Johnson 2008 is the source this registry transcribed them from, not their design paper. The whole genus is the correct denominator and the query is removed. Provenance should properly read Mao et al. 1997, and the citation field still points at Johnson 2008 only because that is where the sequences were read from. amplicon_bp corrected from 500 to 531. Grizzle and Mao both report 531 bp, and the screen independently measures 531 on every LMBV genome, so the 500 in the seed list was simply wrong. KNOWN FALSE POSITIVE, and the best-evidenced one this registry has. On the four LMBV complete genomes PX879566.1, PV833272.1, PX463212.1 and PV459226.1 the tool calls `fail`. The mismatches are 3 per primer, at 13, 15 and 16 bases from the forward 3'' end and 6, 10 and 11 from the reverse 3'' end - none within 5 nt of either 3'' end, both 3'' termini clean for at least 5 bases. The additive penalty totals 4.0 against a reduced_max of 3.0, so the verdict turns entirely on summing six distal mismatches rather than on anything happening at an extending 3'' end. Grizzle''s Fig. 1 is a gel showing these primers amplifying LMBV. This is concrete evidence for the additive-scoring problem in section 3.5 of docs/journal/2026-10-04-pipeline-review.md, and is recorded in docs/validation-cases.tsv. SANTEE-COOPER. The Santee-Cooper group still accounts for most of this assay''s failing records, but on the evidence above that is the scoring model over-penalising distal mismatches, NOT the assay being judged out of scope and NOT demonstrated drift. For an assay that genuinely claims only LMBV, see LMBV_dsDNA_MCP_Grizzle_2003; for a modern LMBV-specific pair, LMBV_dsDNA_MCP_RPA_Li_2025. PROVENANCE CONFIRMED AGAINST THE DESIGN PAPER, 2026-10-26. Everything above about Mao et al. 1997 was read from Grizzle 2003 quoting Mao, because Mao could not be obtained. Mao is now held as papers/10.1006_viro.1996.8435.pdf, and its Table 2 prints both oligos directly: primer 4 GACTTGGCCACTTATGAC at amino acid position 15-20 and primer 5 GTCTCTGGAGAAGAAGAA at 191-186, both 18 nt and both byte-identical to the sequences stored here. So oligos_from_secondary_source is confirmed rather than merely asserted - these ARE Mao''s primers - and the flag stays, because it is a true statement about where the registry read them from. THIS ALSO CLOSES THE 18/19-MER QUESTION that docs/journal/2026-10-24-heldout-candidates.md left open: Stohr 2015 prints a 19-mer reverse with one extra 3'' T, and Mao''s own table prints 18, so the count is three transcriptions to one and Stohr''s T is an extension a later paper added, not a base this registry dropped. The amplicon 531 bp is unaffected - both forms share the same 5'' end.'
