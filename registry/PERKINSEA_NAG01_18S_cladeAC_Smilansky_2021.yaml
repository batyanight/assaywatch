  notes_curator: 'Added 2026-10-05 from the paper''s own text, read out of the PDF in papers/ rather than transcribed from
    any secondary list. Candidate surfaced by the journal sweep in docs/journal/2026-10-04-literature-audit.md; sequences
    extracted with scripts/extract_candidate_oligos.py and then checked against real GenBank records before the entry was
    trusted. Amphibian Perkinsea - the pathogenic clade behind mass tadpole mortality events - was absent from the registry.
    VERIFIED on KP122572.1, the accession the paper itself names as the basis of the fragment: the primers span exactly 287
    bp, matching the paper''s stated ''approximately 287-290 bp''. amplicon_bp is therefore both measured and corroborated
    by the text. PROVENANCE IS SPLIT AND THE PAPER SAYS SO, which is why oligos_designed_here is False. Table 1 marks the
    forward primer 300F-B as coming from its reference [6], while NAG01R_1 and both probes are marked ''this study''. So Smilansky
    et al. 2021 designed the reverse primer and the probes but not the forward, and the scope of the forward primer''s claim
    has to be read from that earlier paper. This is exactly the read-from-versus-designed-by distinction that produced the
    ranavirus scoping error, caught here before the entry was written because the paper labels its own table honestly. THE
    PAPER''S ASSAY IS A DUPLEX AND IS SPLIT INTO TWO ENTRIES, one per probe, because the two probes answer different questions
    on the same amplicon: PPC_P1 (FAM) detects Clade D, the pathogenic Perkinsea clade, and NAG01a-c_P1 (Cy5) detects Clades
    A-C. Pooling them would collapse a pathogen call and a non-pathogen call into one number. This entry carries the Clades
    A-C probe, which detects the NON-pathogenic part of NAG01. A detection here is not a disease finding, and reading it as
    one would invert the paper''s purpose. Its sibling is PERKINSEA_NAG01_18S_cladeD_Smilansky_2021. SCOPED 2026-10-24 to
    scope_taxids [373149], "uncultured Perkinsea" (rank species, lineage Eukaryota > Sar > Alveolata > Perkinsozoa > Perkinsea
    > environmental samples), verified live with efetch -db taxonomy. target.taxid 27997 is the Perkinsea CLADE, whose named
    members are overwhelmingly Perkinsus - marinus, olseni, chesapeaki, mediterraneus and dozens of Perkinsus sp. isolates
    - which are oyster and mollusc parasites, while this assay is for amphibian NAG01 Perkinsea. THE SCOPE LIST WAS CHOSEN
    BY MEASUREMENT, not by reading the taxonomy. Grouping this assay''s rows in the 2026-10-24 calls table by record taxid
    puts EVERY SINGLE DETECTION inside 373149, for both this entry and its sibling, and zero detections anywhere else. The
    excluded taxa contribute 76 assessable records and 0 detections, almost all Perkinsus olseni (48) and P. marinus, chesapeaki
    and mediterraneus - exactly the molluscan parasites the primers should not amplify. So 373149 is where this assay''s real
    targets live and the rest of the clade is pure denominator padding. NOTE THE CONTRAST with Helicobacter_16S_Conley_2021,
    written up in docs/journal/2026-10-24-scope-audit.md: there, an "environmental samples" node was the WRONG scope because
    it was a catch-all that did not contain the target. Here the same kind of node is the RIGHT scope, because NAG01 Perkinsea
    is known almost entirely from environmental 18S clone libraries and that is where its sequences are actually filed. The
    lesson is that an environmental-samples node has to be checked for what it contains, not judged by its rank or its name.
    THIS ENTRY, Clades A-C (NAG01a-c_P1, Cy5): the assessable denominator goes from 464 records to 388 and the detected share
    over the whole calls table from 44.8 percent (208/464) to 53.6 percent (208/388). Whole-archive figures, not the report''s
    recent window.


    THE FORWARD PRIMER''S ORIGIN NOW HAS A NAME, read 2026-10-28 from Karwacki et al. 2018 (Dis Aquat Org 129:85-98, doi:10.3354/dao03239,
    held in papers/). This entry''s `oligos_from_secondary_source` flag said only that 300F-B comes from an earlier paper,
    because Smilansky''s Table 1 marks it as from its reference [6] without naming it in the text we read. Karwacki names
    it twice: "The primer pair 300F-B and 600R (see Table 2), developed by Chambouvet et al. (2015)" and "Initial use of primers
    300F-B and 600R (Chambouvet et al. 2015)". So the attribution is CHAMBOUVET ET AL. 2015, and it is Karwacki''s attribution
    rather than ours -- no Chambouvet paper is on disk, so the citation is not changed and `oligos_from_secondary_source`
    stays. What this buys is a paper to fetch if the forward primer''s declared scope ever has to be read from its own source.
    Karwacki also prints 300F-B verbatim, which is a second independent printing of the sequence this entry stores.'
