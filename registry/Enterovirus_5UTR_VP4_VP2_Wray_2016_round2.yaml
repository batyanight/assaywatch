  notes_curator: 'CITED TO WRAY ET AL. 2016, NOT COIRAS, AND HERE IS WHY (2026-11-01). The four oligos of this nest are printed
    in Table 1 of Wray et al. 2016 (EcoHealth), doi 10.1007/s10393-016-1183-z, as EVRV1, EVRV2, EVRV3 and EVRV2anew, and every
    one matches what is stored here, EVRV2 identically once its inosine is read as the N this registry stores. THE ASSAY ITSELF
    IS OLDER: the nested 5''NCR-VP4/VP2 design is Coiras et al. 2004 (J Med Virol), doi 10.1002/jmv.20008, whose Table prints
    1-EV/RV and 2-EV/RV as the first round and 3-EV/RV and 4-EV/RV as the nested one, and Ren et al. 2009 (doi 10.1111/j.1469-0691.2009.02746.x)
    reuses Coiras''s forms and cites him. Coiras is NOT cited here because the stored sequences are not his: only the round-1
    forward is identical in both papers. Wray narrows two of Coiras''s degenerate positions in the round-1 reverse (S and
    Y to C) and two more in the round-2 forward (R and W to G and T), and replaces Coiras''s round-2 reverse 4-EV/RV (CTGTGTTGAWACYTGAGCICCCA)
    with EVRV2anew, a 19 nt truncation of the round-1 reverse -- so round 2 as stored is Wray''s re-pairing and not Coiras''s
    nested reaction, which is also why the measured 660 bp product is nowhere near Coiras''s published 226 bp nested product.
    Wray''s own source column for the row reads ''Unpublished'', and Ly et al. 2014 (doi 10.1186/s12985-014-0224-x), the only
    other paper printing these forms, gives no attribution at all; both are from one research network. Counted 2026-11-01
    in Europe PMC open-access full text: Coiras''s forms appear in 4 to 6 papers spanning 2009-2022 and Wray''s in 2, so the
    field uses Coiras''s assay while this registry holds Wray''s variant of it.AMPLICON_BP MEASURED, NOT PUBLISHED (2026-10-14).
    No product size was stored for this entry and none is quoted from its paper, which left it exempt from amplicon.declared_tolerance
    - the only entries still judged on the global 50-3000 bp window alone, and the ones where a long chance product could
    still be credited as a call. scripts/check_amplicons.py over every archive of this entry''s own retrieval group measures
    a modal 660 bp on 2054 products, with 100% of all products within the +/-25% the tolerance accepts, so one stored value
    gates this assay without rejecting anything it really amplifies. That last test is the criterion, not the mode: an entry
    whose products do not fit one window was left unset instead. See docs/journal/2026-10-14-amplicon-sizes-measured.md. A
    published figure, if one is found, should replace this - the flag is what marks it as measured.'
