  notes_curator: 'Added 2026-10-06 from Latimer et al. (papers/10.1016_j.vetmic.2010.05.042.pdf). Oligos read from Table 2,
    a text table printed sideways on page 24; sequences, L/R labels and pairing columns were checked by eye on a 220 dpi rendering
    of that page (pymupdf) and agree with the extracted text for every oligo used here. Table 2 lists 21 rows but 19 distinct
    oligos (6784 and 6785 each appear in two blocks). Designed in this paper (Methods: six new sets of EEHV DNA POL primers
    designed for these studies). Not designed here, not in Table 2, not entered: the CODEHOPS pan-herpes set 2595/2596/2597
    and the EEHV3 TER set 6707/6708/6727/6728, both credited to Garner et al. 2009. ORIENTATION was established by locating
    each oligo on GenBank records, not by trusting the table''s L/R column: in the EEHV blocks L is sense and R is antisense
    (as labelled), but in the PAN-EGHV block the labels are inverted (see the note on what was not entered). This entry =
    7485 (EB5P B2, sense) + 7483 (EB5P A1, antisense), Table 2 column 2B, the short alternative second-round pair (230 bp
    stated). 7485 is also the right-hand EEHV5 counterpart of the pan primer 6712 (7485 begins 5 nt inside the 6712 site).
    Verified on HM060764: 7485 at 256-276 and 7483 at 440-461 (both 0 mismatches). Table 2''s size columns for this oligo
    appear partly misplaced (row 12, 7485, shows only 230 under 2B, while row 10, 7484, shows a 210 under 3A that can only
    belong to the 7485/7424 pair), another sign the size columns are loosely set. HOW MEASURED. Every record the target.query
    returns was screened (all of them, not a sample; retrieved 2026-10-06 with NCBI esearch/efetch, min length 100 bp as in
    config.yaml) with assaywatch.screen. Whether a record SPANS the amplicon was decided independently of the screener: each
    record was mapped with blastn to complete reference genome(s) of the target species, the primer-to-primer interval was
    taken from the screen of the reference genome, and a record counts as spanning when its alignment covers that whole interval,
    both primer sites included (4 nt end slack for BLAST end trimming). Most GenBank EEHV POL deposits are the sequence BETWEEN
    the amplification primers, so one or both primer sites are absent: those records give no_amplicon because the site is
    missing, not because the primer fails, and are excluded from the detected share. Spanning counts include RefSeq NC_ copies
    of GenBank genomes (NC_020474, NC_024696, NC_028379, NC_077039), so the number of independent sequences is a few lower.
    RESULT. 20 records retrieved; calls over all of them {''detect'': 10, ''no_amplicon'': 10}. Spanning records: 10; calls
    among spanning {''detect'': 10}; by species EEHV5 {''detect'': 10}. Product sizes among spanning records: 206 bp x10.
    SIZE. Table 2 and the Results text print 230 bp. Measured 206 bp on every spanning record including HM060764 (direct).
    The paper''s figure is 24 bp too long. amplicon_bp is 206. All 10 spanning records detect. SCOPE. EEHV5 only; same species-restricted
    query (20 records). The PAN-EGHV/EGHV2/EGHV3 block of Table 2 (6784, 6785, 6786, 6787, 6788, 7486, 7489) was not entered;
    the reasons are in the note of the panEEHV_round1 entry.'
