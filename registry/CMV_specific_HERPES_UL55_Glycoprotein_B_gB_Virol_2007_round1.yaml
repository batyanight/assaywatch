  notes_curator: 'BOTH PRIMERS VERIFY EXACT against Prepens et al. 2007, confirmed 2026-10-05: they are that paper''s CM-gB round 1 pair, 2743s and 2746as. Reading them needed a fix to scripts/verify_oligos_against_paper.py - the paper spells its ambiguous positions out as the literal string (N/I), "N or inosine", so 2743s is printed CGCAAATCGCAGA(N/I)KC(N/I)TGGTG, and until the notation was normalised both primers reported absent. The registry''s N at those positions is the correct reading. BUT THE AMPLICON DISAGREES: the paper''s own table gives 330 bp as the product length for this pair, where this entry stores 320. The sibling round 2 entry shows the same pattern, storing 230 against the paper''s 250, so the two are likely one spreadsheet error rather than two. NOT CHANGED, because this registry measures amplicons on real records and does not quote them, and no sequence database was reachable from this environment - and the precedent cuts against simply taking the paper''s word: the avipox entry measured an invariant 250 bp against a stated 234, and the measurement won. So this needs the primer pair run against real cytomegalovirus UL55 records; whatever that measures is the answer, and if it comes out at 330 then the stored 320 and 230 are both transcription slips to correct together. AMPLICON MEASURED 2026-10-05. The paper contradicts itself on these sizes: Table 1 prints 330 bp (round 1) and 250 bp (round 2), while the Figure 1 legend says ''Amplimers of the first and the second PCR round are 320 bp and 250 bp''. Measured with assaywatch.match against all 12,782 records in the 2026-10-03 Cytomegalovirus (taxid 10358) archive, allowing up to 5 mismatches per primer: this pair gives a product in 693 records, 319 bp in 678 of them (325 in 6, 316 in 5), all human CMV. So the legend''s 320 is right and the table''s 330 is not; amplicon_bp set to the measured 319. The stored 320 was correct to within a base, which also means the sibling round 2 entry''s 230 was a separate error, not the same slip made twice.'
