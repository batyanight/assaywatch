  notes_curator: 'PREDICT panel protocol P-014 (RdRp), confirmed 2026-10-04 by exact match of every oligo to that protocol''s rounds 1 and 2 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Tong, S. et al, (2008). SCOPED 2026-10-24 by copying the scope_taxids list of its sibling Paramyxovirinae_Polymerase_L_gene_Tong_2008_round1, 931 taxids. The two entries share target.taxid, target.query and citation.doi and are rounds of one protocol, so a record that is out of scope for one is out of scope for the other. Having the list on only one sibling made the two rounds not comparable: they were scored against different denominators. No paper was needed for this, and no judgement is made here about whether the list itself is right. MEASURED EFFECT, and it is small: over the whole 2026-10-24 calls table the list excludes 73 of the 15,784 records retrieved for this group, so the change buys comparability between the rounds rather than a different coverage figure. These enumerated lists are near-complete, which is why they exclude so little. NOTE FOR A LATER FIX: this list is the ~931 enumerated species ids that docs/2026-10-24-scope-audit.md item 9 proposes replacing with the three subtree ids [2560076, 2560080, 2560069], because schema.py''s own comment on scope_taxids says to name the smallest covering subtrees rather than enumerate species. If that replacement is made it must be made on BOTH siblings, or they diverge again.'
