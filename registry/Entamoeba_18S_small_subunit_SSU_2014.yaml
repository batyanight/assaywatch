  notes_curator: 'Seed list: DO NOT USE, cross-reactive with host DNA; GEI18SR row 18 is the wrong strand and needs reverse-complement. | Oligo annotations moved from name field: GEI18SF (forward): Mod; GEI18SR (reverse): corrected Mod; GEI18SR (alternate[0]): incorrect, need reverse complement THE WRONG-STRAND ALTERNATE IS REMOVED,
    2026-10-23. This entry held a second GEI18SR under `alternates`, TACGTCCCTGCCCTTTGTAC, the form the paper prints
    verbatim - but that is the TARGET strand at the reverse primer''s site, not the oligo. Checked against GenBank
    AF149905 (Entamoeba invadens 18S): the printed GEI18SF site and the printed GEI18SR string both lie on the sense
    strand, at 1308 and 1799, giving a 511 bp product inside the 450-535 bp the paper states. So the primary reverse
    slot, stored as the reverse complement with two widened positions, is the correct molecule and the alternate was a
    non-oligo being screened as a primer. Removed, and recorded here instead. GEI18SF and GEI18SR are both degenerate
    variants of the printed pair (CTT to YYY in the forward, two widened positions in the reverse), now carried in
    modified_from; an exact-phrase Europe PMC search finds neither stored form, so the widening is unpublished.'
