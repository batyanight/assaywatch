  notes_curator: 'NEITHER PRIMER IS IN THE CITED PAPER, found 2026-10-05 by scripts/verify_oligos_against_paper.py against
    the PubMed Central full text of Prepens et al. 2007. That paper prints 13 oligos in four named sets - RH-gB, LC-gB, CM-gB
    and CM-MDBP - numbered 2743-2762 and 3730-3731. Neither 4007-s (GGTGACGTGGTTGACATNTCNCC) nor 4007-as (GCAATCGGTTTGTTGTANATNGC)
    appears in it, nor does the string "4007", nor any 10-base fragment of either sequence. The 4007 numbering is a different
    series from anything Prepens uses. Two sibling entries, _Virol_2007_round1 and _round2, DO store Prepens'' own CM-gB primers
    (2743s/2746as and 2744s/2745as) and both verify exact against this paper, which makes the contrast sharp rather than ambiguous:
    the spreadsheet carried two genuine Prepens pairs and two pairs from somewhere else under one citation. Where from is
    not answerable here - the sequences appear in none of the 21 papers held in this environment, and 4-digit numbering of
    this kind looks like the Ehlers lab''s own running primer numbers, so another paper from that group is the place to look.
    NOT DELETED and NOT RE-CITED: the oligos may be perfectly real, and the defect is the attribution. oligos_designed_here
    set to false, which is certain whatever the true source proves to be, because this paper demonstrably did not design them.
    To resolve, find the paper printing 4007-s/4007-as - the Ehlers-lab primate cytomegalovirus papers first - and re-cite.
    Fourth instance of this shape after Hellgren/Bensch, Blooi/Martel and Atkins/PREDICT. AMPLICON MEASURED 2026-10-05 against
    all 12,782 records in the 2026-10-03 Cytomegalovirus archive (up to 5 mismatches per primer): a product in 676 records,
    803 bp in 378, 797 in 144, 800 in 114, mostly human CMV with 17 Macacine betaherpesvirus 3. The stored 800 is within the
    strain spread; amplicon_bp set to the modal 803. The pair is real and amplifies its stated gene, so the problem remains
    provenance only. SOURCE FOUND AND RE-CITED 2026-10-05. A Europe PMC full-text search on each primer sequence returns exactly
    one paper for all four of 4007s, 4007as, 4125s and 4125as: Deckers M, Hofmann J, Kreuzer KA, Reinhard H, Edubio A, Hengel
    H, Voigt S, Ehlers B (2009) Virol J 6:210, PMC2789067 - an Ehlers-lab paper, as guessed. Its Table 1, primer set CMV-gBp1,
    prints 4007s GGTGACGTGGTTGACAT(n/i)TC(n/i)CC and 4007as GCAATCGGTTTGTTGTA(n/i)AT(n/i)GC for round 1 (800 bp) and 4125s
    GCGGACTCGGTGAT(b/i)TC(n/i)TGGGA and 4125as GCTGACGGGTTGATCTTGCT(r/i)AG for round 2 (550 bp), sizes footnoted as approximate.
    Every stored base agrees; the (n/i), (b/i) and (r/i) positions are ''base or deoxyinosine'' and are stored as N under
    this registry''s inosine convention. The paper states it designed them: ''deg/dI primers were deduced from the gB/UL55
    gene of HCMV strain AD169 in a nested format (primer set CMV-gBp1; Table 1)''. Citation moved from Prepens 2007 to Deckers
    2009, design_year 2009, oligos_designed_here true; the spreadsheet''s attribution kept in as_written.'
