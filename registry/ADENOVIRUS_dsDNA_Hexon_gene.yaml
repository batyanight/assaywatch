  notes_curator: 'SCOPE TRIAGE 2026-10-20, decision HELD for a maintainer; see docs/journal/2026-10-20-scope-curation.md. Casas et
    al. 2005''s own range is human adenovirus: it validated on 47 prototype HAdV serotypes covering species A to F in clinical
    samples, and tested no non-human adenovirus. But as_written is PREDICT PROTOCOL, a pan-adenovirus
    wildlife screening protocol, so this is an Atkins/PREDICT-style composite and the scope belongs to whichever source is operative.
    What the audit adds: the two rounds fire on different lineages, and only one of them turns on that question. Round 1 fires
    on Mastadenovirus caesari (3241411), whose records are Human mastadenovirus C - a species Casas explicitly typed, so IN
    range even under the narrowest reading, and scoping to human adenovirus would not remove that override. Round 2 fires
    on Aviadenovirus hepatitidis (3426530), fowl adenovirus, at 0 of 49 - out of Casas''s range and inside PREDICT''s. So
    the composite question decides one override and not the other.'
