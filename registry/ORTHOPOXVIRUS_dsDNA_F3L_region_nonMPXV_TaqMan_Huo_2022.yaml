  notes_curator: 'ADDED 2026-10-27 from the open-access full text (PMC9633113, Europe PMC) Table 1 "Primers and probes designed
    in this study" and Section 2.3, which assigns each probe to its target by reporter dye. Panel 1 shares one primer pair
    across its probes; each probe is one entry here, the pattern the Li 2010 G2R trio uses. This probe is the one Section
    2.3 labels HEX/BHQ1, specific to orthopoxviruses OTHER than MPXV, so the target is the genus and MPXV records are expected
    to read as probe mismatches by design; a specificity reading, not drift. Rooted at the genus taxid 10242. AMPLICON NOT
    STATED BY THE PAPER. MEASURED 2026-10-27 by screening this entry against every archive of taxids 10244 and 10242: 179
    bp in 28,847 of 28,921 products; against the MPXV-dominated archives the probe reads reduced on 28,242 records, which
    is its design (it excludes MPXV by one or two probe mismatches), so its detected share must be read against non-MPXV orthopoxvirus
    records only. DOI resolved through Crossref by scripts/resolve_citations.py on 2026-10-27; status draft; only a maintainer sets active.'
