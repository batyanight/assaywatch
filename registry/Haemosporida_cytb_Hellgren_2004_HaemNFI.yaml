  notes_curator: 'SCOPE FIXED 2026-11-01: taxid 31272 ''Plasmodium sp.'' added, OVERTURNING THE 2026-10-19 DECISION RECORDED
    BELOW that ''Plasmodium records with no subgenus are out of scope because NCBI does not say their host''. That reasoning
    is right about NCBI and wrong about these records. The scope enumerated five Plasmodium SUBGENERA plus Haemoproteus, and
    NCBI files 31272 under ''unclassified Plasmodium'', inside no subgenus, so taxonomy.within dropped every record filed
    there: 816 of this group''s 3,151 recent records on the 2026-10-31 run. Read them and the host is on the record after
    all -- the isolate labels are MalAvi-style avian lineage codes (GEOTRI09 Geothlypis trichas, CATUST05 Catharus ustulatus,
    BAEBIC04 Baeolophus bicolor and more of the same) on cytochrome b partials and mitochondrial genomes, which is what this
    assay generates. 181 of the 816 carry no isolate label and remain genuinely indeterminate; they are admitted with the
    rest rather than split, because the assay is a pan Plasmodium and Haemoproteus assay and an unlabelled avian cytochrome
    b fragment is its target by construction. Mammalian Plasmodium stays out, since the five subgenera are the avian and saurian
    ones: P. falciparum (77 recent records), P. inui (22) and the rest are untouched. MEASURED AFTER THE FIX by re-extracting
    the same 2026-10-31 calls -- NO RESCREEN WAS NEEDED, because scope is applied in drift.py over existing calls and changes
    neither retrieval nor screening: 155 -> 314 evaluable and 10.3 -> 27.1 percent detected, and the verdict moves from declining
    to LOW COVERAGE, because with the fuller denominator this no longer reads as a fall from a working baseline. The sibling
    Haemosporida_cytb_Hellgren_2004_HaemNFI took the same change: 193 -> 263 and 66.8 -> 72.6 percent, still declining.CONFIRMED
    2026-10-05 against the full text via the NYU library: HaemNFI and HaemNR3 are this paper''s own (''initial primers were
    constructed (HaemNFI ... and HaemNR3 ...)''), and both sequences match character for character, inosine included. AMPLICON
    SIZE IS SUSPECT. The stored 617 bp is the product of HaemNF/HaemNR2, which the paper attributes to Waldenstrom et al.
    2004 - a DIFFERENT first-round pair. For HaemNFI/HaemNR3 the paper states no size. 617 should not be trusted until it
    is measured on real records. | SCOPE 2026-10-19: scope_taxids is the avian haemosporidia the design paper names in its
    title, ''A new PCR assay for simultaneous studies of Leucocytozoon, Plasmodium, and Haemoproteus from avian blood'': the
    five avian Plasmodium subgenera in NCBI (Haemamoeba 418104, Huffia 418105, Novyella 418110, Giovannolaia 418112, Bennettinia
    419353; every species NCBI places under them is a bird parasite, checked 2026-10-19), Haemoproteus 77521, Parahaemoproteus
    587283 and Leucocytozoon 195944. Before this the assay was judged against all Haemosporida, and its records were mostly
    mammalian: on the 2026-10-17 calls, 2,240 Laverania (0% detected) and 1,618 subgenus Plasmodium (11%) against about 130
    in the avian subgenera (nearly all detected). Deliberately out of scope: Plasmodium records with no subgenus (e.g. 31272
    ''Plasmodium sp.'', 783 records at 73%), because NCBI does not say their host; some are avian lineages, and that is a
    known loss.

    GENE CORRECTED 2026-11-02, cytochrome c -> cytochrome b: Hellgren et al. 2004 designs these primers ''within the 5'' end
    of the cytochrome b gene'' of the parasite mitochondrial genome. The amplicon and oligos are unchanged; only the locus
    name was wrong. SCOPE BROADENED 2026-11-04 by decision of the maintainer, after rereading the paper: 1269 lineages under
    219829 unclassified Plasmodium whose GenBank records have a bird host and no mammal or reptile host. Host field read on
    all 9,159 records under the node, since names alone mislead (Emoia is a lizard). Left out: mammal or reptile hosts, mixed
    hosts, mosquito-only, no host field. The avian restriction stays. CORRECTED 2026-11-06: the oligos_not_in_cited_paper
    flag was wrong and is removed, since the paper prints both oligos, as this note records. amplicon_bp 617 -> 618, measured
    in 6,409 records on the 2026-11-01 calls; the paper''s 617 bp belongs to HaemNF/HaemNR2 and it gives no size for this
    pair. DESCRIBED AS NESTED 2026-11-06: a nested PCR with a shared first round (HaemNFI/HaemNR3) and two parallel second-round
    reactions: HaemF/HaemR2 for Plasmodium and Haemoproteus, and HaemFL/HaemR2L for Leucocytozoon. The rounds share no oligo.'
