  notes_curator: 'Imported 2026-10-04 from the PREDICT panel''s own protocol sheet (Anthony et al. 2015, Nat Commun 6:8147, Supplementary Methods, CC-BY); sequences read from that document, not transcribed from a secondary list. Single round. Pairs with the S-segment assay P-022; the panel recommends screening with at least two segments. All three terminal primers (BUNS-5-U-6, BUNS-3-L947, BUN-S3-R) carry a non-templated 5'' cloning tail; while they were entered untailed, 0 of 2056 orthobunyavirus records yielded an amplicon. Evidence that first identified the tails (2026-10-04): the conserved terminus is present in only 4% of deposits, and even in records that carry it the full primer finds no site within 6 mismatches, while dropping CGGCGCC from BUNS-5-U-6 matches perfectly (0 mismatches in 6 of 6 records) and dropping GCGGCC from BUNS-3-L947 leaves 1. GGCGCC is a KasI/NarI site. Tails CONFIRMED 2026-10-04 against Briese et al. 2007 Table 1 (doi:10.1007/s00705-007-1069-z), obtained in full. The table''s footnote reads "Non-authentic bases added to some primers are indicated by italics", and the italics are carried by a distinct font face in the PDF, so the boundary is readable rather than inferred: CGGCGCC on BUNS-5-U-6, GCGGCC on BUNS-3-L947, CGCGCC on BUN-S3-R, and no italic run on M3560-F or on any of the paper''s internal primers. All three boundaries match what was inferred from sequence data on 2026-10-04 character for character, which is the one independent check this registry has had of the tail-inference method. tail_5prime is now set. Note BUN-S3-R''s authentic part is 14 nt, one below the registry''s oligo floor; the floor for a declared tail''s binding part was lowered to 14 rather than the published primer being rewritten. AMPLICON: declared 898 bp replaced by amplicon_bp_range [201, 1090] on 2026-10-21. The 898 is one orthobunyavirus'' segment length (Briese 2007''s reference virus); this is a pan-genus consensus assay and the segment length is a species continuum, so a scalar clipped most of it. MEASURED by rescreening the 11572 archives with the size window opened: 51 amplifying (detect/reduced) records span 211-1080 bp across ~15 species, modal 211. Declared range-only (no species_sizes: 15 species with a near-continuous length spread, so length does not cleanly name one) as the measured envelope + 10 bp cushion; declared_tolerance adds +/-25% at screen time. config.yaml amplicon section: the measured size wins. Needs a rescreen to take effect.'
