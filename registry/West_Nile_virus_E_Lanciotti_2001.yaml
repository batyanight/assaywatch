  description: Two primers for NASBA (isothermal RNA amplification) of a 162 bp piece of the West Nile virus envelope 
    gene, each with a non-templated tail (T7 promoter on the reverse, a capture sequence on the forward). Designed with 
    the NASBA kit manual's guidelines so a molecular beacon or ECL probe can read the product in under an hour.
