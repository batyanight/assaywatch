  notes_curator: 'PRIMERS FROM ANOTHER PAPER: this entry is the conventional PCR pair Nbombi-SSU-Jf1/Nbombi-SSU-Jr1 that Kato et al. 2020 use as the reference assay against which they compare their LAMP assay. Their Table 1 attributes the pair to Klee et al. (2006) and the text names the same paper (their ref 38: Klee, Tay & Paxton, J Invertebr Pathol 91:98-104, 2006, ''Specific and sensitive detection of Nosema bombi ... by PCR of partial rRNA gene sequences''). Klee 2006 is not in papers/ and its DOI is not printed in the Kato paper, so the DOI stored here is the Kato paper''s (taken from the file name), oligos_designed_here is false, and if Klee 2006 is added later this entry should move to it. Read from Table 1 (PDF page 5): text layer and page rendered at 200 dpi and read by eye agree. VERIFIED against GenBank AY008373.1 (Nosema bombi 16S rRNA gene, complete sequence, 1,247 nt, the record Kato et al. name as their sequence template): Jf1 sits at 48-73 and Jr1 at 343-370, both with 0 mismatches, product 323 bp. The paper states no PCR product size; its Fig. 6a gel shows the positive-control band between the 100 and 500 bp markers, which is compatible. MEASURED on 259 records of Vairimorpha (Nosema) bombi (txid40135, 2026-10-06) whose titles carry 16S, 18S, small subunit, SSU or rRNA: that is every SSU/rRNA record of the species with length >= 100 bp. (The whole taxon is 327 records; the other 68 are LSU rRNA, methionine aminopeptidase 2 and the contigs of a draft genome assembly, none of which holds either primer site, so the query is restricted to SSU/rRNA titles and loses no spanning record.) Calls: detect 61, reduced 1, fail 19, no_amplicon 178. 81 records give a product: 323 bp in 57, 324 bp in 20, 322 bp in 4, so amplicon_bp 323 is the measured mode. COVERAGE: of the 178 no_amplicon records, 88 end inside a primer window (tool label truncated) and 90 hold no site for either primer; the latter are short internal fragments (21 records of 269-282 bp, shorter than the 323 bp product) and records that cover other parts of the rDNA (the 3'' end of the SSU plus ITS, 344-567 bp, and LSU). No record that is long enough to hold the product and carries the primer region (positions 48-370 of AY008373.1) fails to give a product. Among the 81 spanning records, detect = 61 (75.3%), detect+reduced = 62 (76.5%). THE 19 FAILS are one lineage: 6 isolates named *_WS2 (HM370547-HM370552, 718 bp) and cloned sequences of the same isolates (KF188756 onward, 1,704 bp), where the forward primer Jf1 carries 4 mismatches at 1, 2, 4 and 5 nt from its 3'' end while the reverse primer is exact. N. bombi is known to carry more than one SSU rRNA copy, which is a plausible reading, but that is not established here; the wet-lab behaviour of such templates is not tested in the Kato paper. SPECIFICITY (in silico, not the paper''s): against a 350-record strided sample (every ~4th id) of the 1,535 SSU/rRNA records of Vairimorpha ceranae (txid40302), 349 give no product and 1 (PP326210.1) gives a 317 bp product with a penalty of 15.5 (fail). WHY THE LAMP SET IS NOT ENTERED: the paper''s own assay is LAMP (F3, B3, FIP, BIP, LF, LB, designed here on AY008373; not stored). The registry has no LAMP chemistry, F3/B3 are only the outer displacement primers and never drive detection on their own, the paper itself shows the LAMP set also amplifies N. ceranae, and a LAMP product has no PCR amplicon length. Screening F3/B3 as a PCR pair would test the least informative two of eight binding sites. See the final report for the numbers. NOT ENTERED UNDER THIS ID: the N. ceranae PCR pair 218MITOC-FOR/REV in the same Table 1 (credited there to Martin-Hernandez et al. 2007): on every N. ceranae reference record checked (including RefSeq XR_002966746.1, the record Kato et al. cite) both primers mismatch at their 5'' ends (2 bases on the forward, the 5 terminal bases on the reverse), so 136 of 152 product-bearing records in a 350-record sample are called fail on 5''-end penalties alone while their 3'' ends match; the original paper is Martin-Hernandez et al. 2007, Appl Environ Microbiol 73:6331-6338 (doi 10.1128/AEM.00270-07; open access, PMC2075036), read 2026-10-07. Its Table 2 prints 218MITOC-FOR 5''-CGGCGACGATGTGATATGAAAATATTAA-3'' and 218MITOC-REV 5''-CCCGGTCATTCTCAAACAAAAAACCG-3'', identical to Kato''s table, and underlines the first 3 bases of the forward (CGG) and the first 5 of the reverse (CCCGG) as non-template tails (the paper: G or GC tails were added to the 5'' end of all primers to make the melting temperatures of each primer set equal). The 5'' mismatches counted here are therefore those tails, not a difference between Kato''s table and the paper. That pair is entered as its own draft assay from that paper. Not sources for the primers: Higes et al. 2007 J Invertebr Pathol 94:211-217 (checked, no primers in it) and Nabian et al. 2011 Iran J Parasitol 6:89-95 (reuses the pair). SCOPE: single species. use_context lists wildlife because the target host is bumblebees. RE-CITED 2026-10-17 TO THE PAPER THAT PUBLISHED THE PRIMERS. Kato 2020''s Table 1 attributes Nbombi-SSU-Jf1/Jr1 to Klee et al. 2006 but prints no DOI; that DOI is now resolved and checked directly against Crossref, which returns ''Specific and sensitive detection of Nosema bombi (Microsporidia: Nosematidae) in bumble bees (Bombus spp.; Hymenoptera: Apidae) by PCR of partial rRNA gene sequences'', Klee, Tek Tay & Paxton, J Invertebr Pathol 91:98-104, 2006 (PMID 16376373) - matching Kato''s attribution on authors, journal, volume and pages. citation.doi, design_year and reference now point at Klee 2006 and the DOI was added to docs/papers-index.cache.json. doi_verified was set TRUE by scripts/resolve_citations.py on 2026-10-17, the house path for that flag, once a contact email was available; Crossref''s year and first author both matched. oligos_designed_here set to null (unknown) rather than true: Klee 2006 is still not in papers/, so nothing here has confirmed it prints these oligos - the sequences remain as read from Kato''s Table 1 and verified against AY008373.1. NOT RENAMED: the entry id still says Kato_2020 although the citation is now Klee 2006, because renaming touches every reference to the id; worth doing in a dedicated pass.'
