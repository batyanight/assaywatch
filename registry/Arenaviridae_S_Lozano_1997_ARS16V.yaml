  notes_curator: 'PREDICT panel protocol P-003 (S-gene), confirmed 2026-10-04 by exact match of every oligo to that protocol''s
    round 1 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Lozano,
    M. et al (1997). SCOPED 2026-10-20 to the mammarenaviruses, from Lozano et al. 1997''s own range. Its title calls the
    set "family-specific", but in 1997 the family was the mammarenaviruses alone: the paper divides arenaviruses into Old
    World (LCM, Ippy, Lassa, Mobala, Mopeia) and New World (Junin, Tacaribe, Pichinde and relatives) and designed the primers
    on the published S RNA sequences of LCM WE and Armstrong, Lassa Nigeria and Josiah, Mopeia, Pichinde, Machupo, Tacaribe,
    Junin MC2 and XJ, and Oliveros. CORRECTED 2026-11-10: until today this sentence read "and amplified" that list, and the
    list is the ALIGNMENT set, not what the paper put through a reaction. It is Fig. 2, the HinfI pattern CALCULATED for "different
    arenaviruses S RNAs" from sequence, for "those arenaviruses for which the S RNA sequence is available". What ARS1/ARS16V
    amplified is four viruses: Junin MC2, LCM WE and Tacaribe on cultured-cell RNA (Fig. 3a, lanes J, L and T, confirmed by
    HinfI in Fig. 3b), and the novel Pampa isolate (lane P, about 600 bp). The abstract says the same: "tested with Old World
    (LCM) and New World (Junin and Tacaribe) arenaviruses", plus the novel isolate. Pichinde is propagated in section 2.2
    and appears in no amplification figure. The scope decision recorded above is unaffected: it was taken from the range the
    paper CLAIMS, not from the panel it ran. This correction supersedes a 2026-11-05 one that `next-run-prep` carried, which
    said the same thing and listed the alignment set as ending "Oliveros, Sabia". Fig. 2 names no Sabia: its lanes are JUN-MC2,
    JUN-XJ, MAC, TAC, OLV, PIC, LCM-WE, LCM-Arm, LAS-Jos, LAS-Nig and MOP, so Machupo is in the set and Sabia is not. The
    two were merged at the freeze and folded into one here. Reptarenavirus, Hartmanivirus, Antennavirus and Innmovirus were
    all described after it, so scope_taxids is 1653394 Mammarenavirus plus 208898 unclassified Arenaviridae -- the latter
    deliberately, since it holds the 164 Arenavirus sp. records, the legacy genus 11618 with the Mopeia/Lassa reassortants,
    and field isolates such as Cardamones and Middle Pease River that are mammarenaviruses in all but assignment. It also
    admits 10 Boid arenavirus records that sit under 208898 rather than under Reptarenavirus, which is an NCBI placement artefact,
    not a decision here. Snake reptarenaviruses have their own registry entry, so leaving them in this denominator scored
    them twice against an assay not designed for them. MEASURED on the 2026-10-17 calls: 473 records go out of scope, of which
    45 were evaluable here and all 45 at 0 percent detected, but none is in the recent window, so the pooled share and the
    verdict are unchanged to the digit (low coverage, 52.9 percent of 51). Expect this to matter later rather than now: reptarenavirus
    and antennavirus deposits are growing and will land in a future recent window. VERIFIED AGAINST THE PAPER FOR THE FIRST
    TIME 2026-10-20. This entry''s DOI is parenthesised, so verify_oligos_against_paper.py had never reached the local PDF
    - it read no-full-text, "no local PDF", while the file sat in papers/. Cause and fix in that script''s doi_stem(). Result:
    ARS1 reads exact, but ARS16V reads near:2. Stored GGCATWGANCCAAACTGATT (20 nt); Lozano et al. 1997 prints GGCATWGANCCAAACTGA
    (18 nt). The stored form carries two extra bases, TT, at its 3'' END. The verifier''s standing caveat is that bases at
    the ends of a printed run can be table text glued on by the extraction, but that caveat is about the PAPER''s run, and
    here the extra bases are on the STORED oligo and at the priming end, where two bases decide whether the 3'' terminus matches.
    Either the primer was lengthened when first entered or the extraction truncated the table. Not changed: read the Table
    in the PDF by eye before touching the sequence. RESOLVED BY EYE 2026-10-23 (pdftotext -layout, Lozano Table 1): ARS16V
    is printed GGCATWGANCCAAACTGA- with TT wrapped onto the next line, which is the stored sequence exactly; the near:2 was
    the wrap. Both oligos are Lozano''s as printed, and the verifier now reads both exact. SCOPE BROADENED 2026-11-04, on
    rereading the paper: The paper claims all members, including undescribed ones, from an alignment of 11 sequences of 8
    viruses. Reptarenavirus, Hartmanivirus, Antennavirus and Innmovirus are added on that wording. The paper did not test
    them.'
