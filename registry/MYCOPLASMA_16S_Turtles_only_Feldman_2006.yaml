  notes_curator: 'Scoped 2026-10-04 to the three named chelonian mycoplasmas (Mycoplasmopsis agassizii
    33922, Mycoplasma testudineum 244584, Mycoplasmoides testudinis 33924): 534 records. The assay is
    chelonian-specific by design ("turtles only" in the sheet; Feldman 2006 describes a novel Mycoplasma
    of eastern box turtles), so that is the denominator its published claim is about; against the whole
    genus (24,523 records) it detected 0-4% in every year, which is specificity, not drift. The retrieval
    root is the phylum because two of the three species have been reclassified out of genus Mycoplasma
    (Mycoplasmopsis, Mycoplasmoides), so a query under txid2093 reached only 94 of the 534 records.
    Scoped by organism, not free text: an untagged Entrez keyword searches every field, which is how the
    first attempt picked up assembly contigs and missed most of the right records.'
