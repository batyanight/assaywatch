  notes_curator: 'Oligos read from Table 1 of the paper (PDF page 5): the text layer and the page rendered at 200 dpi and
    read by eye agree. The paper''s Tenebrio molitor RNA extraction control oligos (TeneF/TeneR/TeneP, taken from Koppel et
    al. per the paper) are an exogenous control, not honeybee virus targets, and are deliberately excluded from all six honeybee
    virus entries made from this paper; its synthetic RNA calibrators carry no oligos. The paper tests the six assays singly
    and as duplexes (ABPV/BQCV, DWVA/DWVB, CBPV/SBV; also BQCV/DWVA and ABPV/DWVB); each virus is its own entry here. One-step
    RT-qPCR, 50 C 15 min RT, 95 C 2 min, 50 cycles of 95 C 15 s / 54 C 30 s, 0.2 uM each primer and probe. Screened with assaywatch.screen
    on 2026-10-06 against GenBank records fetched by esearch/efetch the same day. ''Spanning'' below means a record that gives
    a product, or that the tool labels diverged or chance-only, or that the tool labels no_site but whose sequence still carries
    the cited reference amplicon region (an 11-mer chain covering at least 80% of it); records the tool labels truncated (they
    end inside a primer window) are not counted as spanning. DESIGN: MIXED. The forward primer and probe are derived from
    those validated by Blanchard et al. (ref 41 of the paper); the reverse primer SBVR is new (Table 1 ''This study [41]'';
    alignment of 106 sequences). Blanchard''s paper not available locally; oligos_designed_here left null and flagged. The
    probe SBVP carries Cy5 and BHQ2 (not an MGB quencher), so the chemistry is hydrolysis_probe; the other five probes are
    MGB. VERIFIED against the cited accession MN082652.1 (SBV isolate AcSBV-TW, complete genome, 8,776 nt): SBVF 430-451,
    probe SBVP 456-484, SBVR 529-551, all 0 mismatches. THE PAPER''S STATED SPAN DISAGREES WITH ITS OWN PRIMERS: Table 1 gives
    430-548 (119 bp) but the reverse primer as printed ends at 551, so the product on that record is 122 bp. The measurement
    wins: amplicon_bp 122. MEASURED on every record of Sacbrood virus with length >= 100 bp (txid3048309, species rank; 899
    records): detect 305, reduced 41, fail 18, no_amplicon 535. 364 records give a product: 361 at 122 bp, one each at 120,
    121 and 123; the probe has a site inside the product in 364 of 364. COVERAGE: 534 of the 535 no_amplicon records do not
    span the site (partial deposits and incomplete genomes, median 535 bp); 1 spans it but has no reverse site. Among the
    365 spanning records, detect = 305 (83.6%), detect+reduced = 346 (94.8%), 18 fail.'
