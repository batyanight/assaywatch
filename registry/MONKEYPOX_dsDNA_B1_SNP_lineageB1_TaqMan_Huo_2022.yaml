  notes_curator: 'ADDED 2026-10-27 from the open-access full text (PMC9633113, Europe PMC) Table 1 "Primers and probes designed
    in this study" and Section 2.3, which assigns each probe to its target by reporter dye. Panel 2 shares one primer pair
    across its probes; each probe is one entry here, the pattern the Li 2010 G2R trio uses. This probe is the one Section
    2.3 labels HEX/BHQ1, specific to the 2022 B.1 lineage, a single-nucleotide-polymorphism probe at 183519-183542 of MPXV_USA_2022_MA001
    (ON563414.2). A lineage that has no NCBI node; unscoped, scope_narrower_than_taxid. AMPLICON NOT STATED BY THE PAPER.
    MEASURED 2026-10-27 by screening this entry against every archive of taxids 10244 and 10242: 81 bp in 28,882 of 28,888
    products over 35,539 records; calls detect 18,909 / reduced 1,396 / fail 8,530 / no_amplicon 6,651 -- a single-nucleotide
    probe, so the fails are non-B.1 clades by design. DOI resolved through Crossref by scripts/resolve_citations.py on 2026-10-27; status draft; only a maintainer sets active.'
