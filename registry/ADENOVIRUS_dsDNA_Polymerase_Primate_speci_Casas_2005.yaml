  notes_curator: 'SOURCE FOUND AND RE-CITED 2026-10-05. The entry cited Casas et al. 2005 J Clin Microbiol 43:6176, and that
    paper does not print these primers: its local PDF carries exactly four oligo-like runs, all of them the hexon primers
    held by ADENOVIRUS_dsDNA_Hexon_gene and its round 2 sibling, which verify exact. The polymerase pairs are absent from
    it. A Europe PMC full-text search finds both pairs in Roy S et al. 2009 PLoS Pathog 5:e1000503 (PMC2698151), which prints
    them in one sentence as a single nested polymerase PCR - ''outer primers, TGATGCGYTTCTTACCTYTGGTYTCCATGAG and AGTTYTACATGCTGGGCTCTTACCG,
    and inner primers, GTGACAAAGAGGCTGTCCGTGTCCCCGTA and TCACGTGGCCTACACTTACAAGCCAATCAC'' - matching the registry base for
    base. Roy gives no citation of its own for them, and it is the earliest publication of them that is findable: the only
    other open texts printing them are later and downstream (Roy 2011 PLoS One 6:e24859, Medkour 2020 Viruses 12:657 ''Fw/Rw
    inere'', Kosoltanapiwat 2022 One Health 15:100434 ''Adeno-pol F2/R2''). Cited to Roy 2009 as first publication. This is
    the same shape as the CMV gB case settled earlier today: one spreadsheet citation covering a paper''s own pair plus a
    pair from somewhere else. The two entries also belong together - they are rounds of one nested assay, which the ids do
    not say. F1/R1 are the OUTER pair. AMPLICON MEASURED against all 30,139 records in the 2026-10-03 Mastadenovirus archive
    (up to 4 mismatches per primer): a product in 4,103 records, 1512 bp in 2,068 and 1515 bp in 1,903. The stored 1560 matches
    none of them; corrected to the modal 1512. Note for the drift report rather than an error: R1 sits one mismatch from the
    template in 3,020 of those records and matches perfectly in only 67, which is a property of the target population and
    of a primer published with one Y, not a transcription slip - the sequence is what Roy prints. CONFIRMED AGAINST THE PAPER
    ITSELF, later on 2026-10-05. The Roy 2009 PDF was fetched as gold open access, and this entry''s outer pair F1/R1 now
    verifies exact against it directly. (The inner pair in the sibling entry reads in-text rather than exact, because Roy
    prints all four primers inside one running sentence rather than in a table, which is the weaker of the two matches the
    verifier distinguishes - not a discrepancy in the sequence.)'
