  notes_curator: 'Added 2026-10-05. THE SEQUENCES WERE READ OFF AN IMAGE, because this paper gives no primer table: Figure 1 prints two sections of Bd mtDNA with the primer and probe footprints drawn as boxes over the double-stranded sequence. Text extraction returns nothing, so the page was rendered and read, the boxes transcribed, and the reverse primers reverse-complemented off the bottom strand by hand. That is exactly the kind of transcription this registry has been burnt by before, so none of it was trusted until it was checked against real sequence. VERIFIED against Bd mitochondrial records CP161941.1 and CP161942.1. Two details confirm the reading beyond doubt. First, the MGB_BdGPL probe is drawn across a line break in the figure, with a lone CGC boxed at the start of the next line; the joined 21-mer TATAATTGAAGTATGAGGCGC occurs contiguously in the record, which proves both that the two printed lines are contiguous and that the probe spans them. Second, for BdCAPE the 64 bp product recovered from the record matches the figure''s printed sequence at every position EXCEPT two - position 31 T->G and position 36 C->A - and both of those fall inside the probe footprint while the primers match perfectly. THOSE TWO MISMATCHES ARE THE ASSAY WORKING, NOT A TRANSCRIPTION ERROR. They are the lineage-diagnostic sites: the primers are conserved across Bd and only the probe discriminates, so a BdGPL genome carries the GPL allele at both positions and is correctly invisible to the CAPE probe. CP161941 and CP161942 both carry the non-CAPE allele and CP161941 carries the GPL probe site perfectly, which is consistent. WHAT THIS MEANS FOR THE DRIFT METRIC, and it is the sharpest example in the registry. These two assays are DESIGNED NOT TO DETECT most Bd. A detected fraction computed over all Bd records is meaningless for them - a low share is the assay succeeding at discrimination, not failing at detection. They cannot be read with the same threshold as a pan-lineage assay such as CHYTRID_Bd_Internal_transcribes_spa_Boyle_2004, and they are the concrete case the per-clade estimand discussion in section 3.1 of docs/2026-10-04-pipeline-review.md is about. This entry is the BdGPL probe. Measured on CP161941.1: forward at 117701, reverse at 117770, a 98 bp product with the probe inside it. amplicon_bp is measured; the paper states no size. BdGPL is the panzootic lineage behind global amphibian declines, so a detection here is the finding that matters epidemiologically. Its sibling is CHYTRID_Bd_mtDNA_lineage_BdCAPE_Ghosh_2021.'
