  notes_curator: "SEQUENCE CORRECTED 2026-10-05 from VanDevanter et al. 1996, read from the paper\n(doi:10.1128/jcm.34.7.1666-1671.1996). The paper prints the five consensus DPOL primers in\nMaterials and Methods, not in a table:\n    DFA   5'-GAYTTYGCNAGYYTNTAYCC-3'      (upstream, primary)\n    ILK   5'-TCCTGGACAAGCAGCARNYSGCNMTNAA-3'  (upstream, primary)\n    KG1   5'-GTCTTGCTCACCAGNTCNACNCCYTT-3'    (downstream, primary)\n    TGV   5'-TGTAACTCGGTGTAYGGNTTYACNGGNGT-3' (upstream, secondary; see round2 entry)\n    IYG   5'-CACAGAGTCCGTRTCNCCRTADAT-3'      (downstream, secondary; see round2 entry)\nHV-DFA was stored as GAYTTYGCNAGYYTNTAYCCR, one base LONGER than the published primer: an\nextra R on the 3' end. The string TAYCCR does not occur anywhere in the paper. Four of the\nfive oligos from this paper (ILK, KG1, and TGV/IYG in the round2 entry) match it exactly,\nso DFA was the only discrepancy. Truncated to the paper's 20-mer on Batya's instruction to\nuse the published version.\nWHY THE EXTRA BASE MATTERED. It sat at the 3' terminus, the position that governs extension,\nand R excludes C and T. Screening therefore demanded an extra base pair at the priming end\nand charged a terminal mismatch to every record carrying a pyrimidine there - a mismatch the\nreal 20-mer never sees. For a consensus assay spanning a family as divergent as\nHerpesviridae that plausibly depressed the detection rate across the board. The size of the\neffect is NOT yet measured: unlike the Yersinia correction, this entry has not been\nre-screened both ways. Do that before reading any coverage number for this assay.\nPROVENANCE QUESTION LEFT OPEN. citation.as_written is 'PREDICT Protocols', so the sequence\nreached the spreadsheet through PREDICT rather than from the paper directly, and the R is\neither a PREDICT-era modification the lab actually orders or a transcription slip somewhere\nbetween the paper and the spreadsheet. The PREDICT protocol document is not in papers/. If\nit prints DFA with the R, this entry should hold the 21-mer and declare the modification\nexplicitly, the way Pan_mycoplasma_16S_All_Van_1992 records GPO-1FMod - the registry's job\nis to record what the lab runs, not to prefer what is published. Flagged until that is\nchecked.\nHOW IT WAS FOUND, and a checker bug worth fixing. verify_oligos_against_paper.py reported\nHV-DFA as `absent` rather than `near:1`, because the paper breaks the primer across a line:\n'GAYT' ends one line and 'TYGCNAGYYTNTAYCC-39' begins the next. The oligo-run scanner sees\ntwo fragments, neither containing the stored sequence. The same break explains the four\nadenovirus pan-polymerase oligos reported as `in-text` (polRouter splits as ...RTABARNG +\nMRTT). A dehyphenate-and-rejoin pass over the extracted text before scanning would recover\nboth. Until that lands, an `absent` verdict on a pre-2000 PDF means 'not found', not\n'not in the paper'. TAXON RENAMED: NCBI now calls txid10292 'Orthoherpesviridae'; this entry carried the superseded name 'Herpesviridae'. Checked 2026-10-05 during the repo-wide audit. The taxid is unchanged and is what retrieval uses, so nothing about the screening changes - but a report naming the old taxon would not match what GenBank now says."
