  notes_curator: 'Added 2026-10-05 from the paper''s own Methods text, read out of the local PDF. The high-GC half of Li 2010''s
    two universal poxvirus PCRs; the low-GC one is PANPOX_dsDNA_lowGC_IMV_Li_2010, and the pair exists because the subfamily''s
    GC content ranges from about 25% to about 64% and no single primer pair spans it. Both primers target an RNA polymerase
    subunit gene. AMPLICON MEASURED: the text says ''about 630 bp''; measured against all 28,387 records in the 2026-10-03
    Chordopoxvirinae archive (up to 4 mismatches per primer) it gives a product in 211, 627 bp in 134 and 630 bp in 77. amplicon_bp
    is the modal 627, with the paper''s 630 the second most common real size rather than a disagreement. SCOPE, flagged rather
    than scored: the hits are orf virus, molluscum contagiosum, bovine papular stomatitis, pseudocowpox and saltwater crocodilepox
    - Parapoxvirus, Molluscipoxvirus and the unclassified crocodilepox, the high-GC genera, with no orthopox among them. The
    complement of its sibling''s hit list, which is the cleanest evidence available that the two assays partition the subfamily
    the way the paper says they do. A low detected share against the whole subfamily is the design. ON THE AMPLIFY CHECK,
    so a future reader is not alarmed by it: scripts/check_submission.py over a 400-record sample reports 205 no_amplicon,
    194 fail and 1 detect. That is the right answer, not a defect in the entry. The archive is overwhelmingly orthopoxvirus,
    this assay is for the high-GC genera, and an orthopox record SHOULD fail it. The 194 fail calls also sit on products the
    scoring accepts only because config.yaml''s amplicon.declared_tolerance is still null, so a 627 bp assay is credited with
    anything from 50 to 3000 bp; turning that on would move most of them to no_amplicon, which is the more honest label. The
    sibling low-GC entry, screened the same way, reports 202 detect of 203 amplicons.'
