  notes_curator: 'Added 2026-10-05 from the paper''s own Methods text, read out of the local PDF. The high-GC half of Li 2010''s two universal poxvirus PCRs; the low-GC one is PANPOX_dsDNA_lowGC_IMV_Li_2010, and the pair exists because the subfamily''s GC content ranges from about 25% to about 64% and no single primer pair spans it. Both primers target an RNA polymerase subunit gene. AMPLICON MEASURED: the text says ''about 630 bp''; measured against all 28,387 records in the 2026-10-03 Chordopoxvirinae archive (up to 4 mismatches per primer) it gives a product in 211, 627 bp in 134 and 630 bp in 77. amplicon_bp is the modal 627, with the paper''s 630 the second most common real size rather than a disagreement. SCOPE, flagged rather than scored: the hits are orf virus, molluscum contagiosum, bovine papular stomatitis, pseudocowpox and saltwater crocodilepox - Parapoxvirus, Molluscipoxvirus and the unclassified crocodilepox, the high-GC genera, with no orthopox among them. The complement of its sibling''s hit list, which is the cleanest evidence available that the two assays partition the subfamily the way the paper says they do. A low detected share against the whole subfamily is the design. ON THE AMPLIFY CHECK, so a future reader is not alarmed by it: scripts/check_submission.py over a 400-record sample reports 205 no_amplicon, 194 fail and 1 detect. That is the right answer, not a defect in the entry. The archive is overwhelmingly orthopoxvirus, this assay is for the high-GC genera, and an orthopox record SHOULD fail it. The 194 fail calls also sit on products the scoring accepts only because config.yaml''s amplicon.declared_tolerance is still null, so a 627 bp assay is credited with anything from 50 to 3000 bp; turning that on would move most of them to no_amplicon, which is the more honest label. The sibling low-GC entry, screened the same way, reports 202 detect of 203 amplicons. DENOMINATOR SCOPED 2026-10-17, FROM MEASURED GC AND NOT FROM MEMORY. The pair partitions Chordopoxvirinae by GC content, so a share against the whole subfamily was never this assay''s coverage - it was the design. NCBI lists 18 genera in the subfamily (an earlier hand-written list had 11 and would have silently dropped 494 records). One record of 100-400 kb was fetched per genus and its GC computed: Sciuripoxvirus 66.7%, Parapoxvirus 64.4%, Molluscipoxvirus 63.5%, Crocodylidpoxvirus 61.9% | Macropopoxvirus 53.9% | Leporipoxvirus 43.2% | Salmonpoxvirus 37.4%, Pteropopoxvirus 33.8%, Orthopoxvirus 33.0%, Mustelpoxvirus 31.3%, Avipoxvirus 30.8%, Centapoxvirus 29.5%, Suipoxvirus 27.4%, Yatapoxvirus 27.0%, Cervidpoxvirus 26.8%, Capripoxvirus 25.9%, Oryzopoxvirus 23.6%, Vespertilionpoxvirus 23.5%. That reproduces the paper''s stated ~25-64% span and falls into two clusters with a clear gap. HIGH-GC = the four genera above 60%, which contains the three the earlier screen actually hit (Parapoxvirus, Molluscipoxvirus, crocodilepox) plus Sciuripoxvirus, which sits in the same band and simply had no record in that measurement. LOW-GC = the twelve below 40%. LEPORIPOXVIRUS (43.2%) AND MACROPOPOXVIRUS (53.9%) ARE IN NEITHER QUERY, 783 records: Li 2010 does not say where the crossover between its two pairs sits, and putting them in one denominator could hide a real failure while putting them in the other could invent one. They are excluded and flagged rather than assigned. THIS CHANGES RETRIEVAL, so this entry''s archive and calls are stale until the group is re-retrieved and rescreened.'
