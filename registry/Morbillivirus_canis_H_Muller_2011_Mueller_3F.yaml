  notes_curator: 'TAXON RENAMED: NCBI now calls txid11232 ''Morbillivirus canis''; this entry carried the superseded name
    ''Canine morbillivirus''. Checked 2026-10-05 during the repo-wide audit. The taxid is unchanged and is what retrieval
    uses, so nothing about the screening changes - but a report naming the old taxon would not match what GenBank now says.
    CITATION RESOLVED 2026-10-22. The ''candidate'' in the old reference string is confirmed by sequence, not by plausibility:
    Müller et al. 2011 (J Wildl Dis 47:725-729, 10.7589/0090-3558-47.3.725) prints this entry''s primers, and all four Mueller_2011
    entries'' primer pairs verify exact against that PDF. The paper is paywalled, which is why the open-access routes never
    found it.


    TAXID RETIRED 2026-10-27: NCBI has merged 11232 into 3052342 (Morbillivirus canis), so this entry now carries the canonical
    id. Retrieval resolved the old id and nothing had noticed, which is the point -- an entry on a retired id is one taxonomy
    release from an empty archive. data/retrieved/11232/ moved to data/retrieved/3052342/ and the manifest was rebuilt in
    the same commit, so no archive was re-fetched. Found by scripts/check_taxids.py''s containment check; see docs/journal/2026-10-27-retired-taxids.md.
    CORRECTED 2026-11-06: the paper states the pairing, so that flag is removed. The arctic alternates are not printed by
    the paper and their source isn''t recorded. SIZE READ AND SETTLED 2026-11-10 (ROADMAP, "Sizes to read, from the verifier''s
    table"). One rule over all eleven entries on that list: amplicon_bp takes the measured modal product length where one
    mode holds a clear majority, and the measured median where none does, with amplicon_multimodal in the second case; the
    flag says whether the CITED paper publishes a size (amplicon_disagrees_with_paper) or does not (amplicon_measured_not_published);
    and a value is only moved where the new +/-25% window still admits every product measured, so a correction cannot silently
    delete calls. Measured on the 2026-11-01 calls. Mueller 3F: 563 -> 544. New window 408-680 bp admits every product measured
    (525-545).'
