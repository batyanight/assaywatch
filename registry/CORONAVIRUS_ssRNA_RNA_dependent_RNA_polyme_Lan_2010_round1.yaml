  notes_curator: 'PREDICT panel protocol P-005 (RdRp), confirmed 2026-10-04 by exact match of every oligo to that protocol''s round 1 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Quan, P.L. et al (2010). THE CITED PAPER AND THE PROTOCOL DISAGREE ON THE REVERSE PRIMER, found 2026-10-05 by scripts/verify_oligos_against_paper.py reading the PubMed Central full text of the cited paper. Quan et al. 2010 prints its first-round reverse consensus primer in the Methods as 5''-GGTCATKATAGCRTCAVMASWWGCNACNACATG-3'', 33 nt. The stored sequence is GGTCATKATAGCRTCAVMASWWGCNACATG, 30 nt: the two agree for 27 bases and then the stored form lacks NAC before the ATG tail. This is not a transcription slip made in this registry - the 2026-10-04 check above found the stored form matching PREDICT P-005 in the Anthony et al. 2015 supplement, so it is the two published sources that differ. Which one is right cannot be settled from here, and the sequence was therefore NOT CHANGED: Anthony 2015 keeps its primer tables in Supplementary Information, which PubMed Central does not carry, and no sequence database was reachable to ask which form has a binding site in real RdRp records. To resolve it, read the P-005 table in the Anthony 2015 supplement and screen both forms against real coronavirus RdRp records. If the 33-mer is correct then this is a three-base deletion inherited from the protocol, and the other P-005 entries need the same check. Note the shape of this, because it is now the second instance: as with Atkins/PREDICT on the astrovirus entries, the panel''s oligo is not the oligo the panel''s cited paper printed, so citing the source paper while storing the panel''s sequence misattributes it either way.'
