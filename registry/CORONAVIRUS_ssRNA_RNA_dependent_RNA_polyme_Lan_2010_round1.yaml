  notes_curator: 'PREDICT panel protocol P-005 (RdRp), confirmed 2026-10-04 by exact match of every oligo to that protocol''s
    round 1 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Quan, P.L.
    et al (2010). THE CITED PAPER AND THE PROTOCOL DISAGREE ON THE REVERSE PRIMER, found 2026-10-05 by scripts/verify_oligos_against_paper.py
    reading the PubMed Central full text of the cited paper. Quan et al. 2010 prints its first-round reverse consensus primer
    in the Methods as 5''-GGTCATKATAGCRTCAVMASWWGCNACNACATG-3'', 33 nt. The stored sequence is GGTCATKATAGCRTCAVMASWWGCNACATG,
    30 nt: the two agree for 27 bases and then the stored form lacks NAC before the ATG tail. This is not a transcription
    slip made in this registry - the 2026-10-04 check above found the stored form matching PREDICT P-005 in the Anthony et
    al. 2015 supplement, so it is the two published sources that differ. Which one is right cannot be settled from here, and
    the sequence was therefore NOT CHANGED: Anthony 2015 keeps its primer tables in Supplementary Information, which PubMed
    Central does not carry, and no sequence database was reachable to ask which form has a binding site in real RdRp records.
    To resolve it, read the P-005 table in the Anthony 2015 supplement and screen both forms against real coronavirus RdRp
    records. If the 33-mer is correct then this is a three-base deletion inherited from the protocol, and the other P-005
    entries need the same check. Note the shape of this, because it is now the second instance: as with Atkins/PREDICT on
    the astrovirus entries, the panel''s oligo is not the oligo the panel''s cited paper printed, so citing the source paper
    while storing the panel''s sequence misattributes it either way. RESOLVED 2026-10-05: THE STORED 30-MER IS CORRECT AND
    QUAN 2010 PRINTS A 3-NT DUPLICATION. The local PDF of the cited paper confirms the 33-mer is what Quan et al. 2010 print
    in Methods (GGTCATKATAGCRTCAVMASWWGCNACNACATG). Both forms were screened with assaywatch.match against one complete genome
    per distinct title stem in the 2026-10-03 Coronaviridae archive (884 genomes, alpha-, beta-, gamma- and deltacoronaviruses).
    The stored 30-mer finds a site with 0-3 mismatches in 685 of 884 (77%) and, paired with CoV-FWD1, gives a 532 bp product
    in 514 genomes and 529 bp in 337. The 33-mer never does better than 4 mismatches in any genome (mode 6-7): the template
    carries a single NAC before the ATG (bovine CoV reads ...GAAGCAACATG...), so the printed NACNAC is an insertion relative
    to every real RdRp. PREDICT P-005 carries the corrected primer; the paper''s Methods text does not. The sequence is therefore
    kept and the citation kept, with this note as the record that the cited paper''s printed form does not bind. amplicon_bp
    changed 520 -> 532, the measured majority (529 in the genomes where the forward site sits 3 nt closer). The only other
    P-005 entry, the round 2 pair, verifies exact against the same paper. | Oligo annotations moved from name field: CoV-FWD1
    (forward): U630; CoV-RVS1 (reverse): L1150 SCOPE QUESTION ASKED AND CLOSED 2026-10-20. The override fires on Gammacoronavirus
    galli (3433766, infectious bronchitis virus) at 159/221 = 72.0 percent against a pooled 52.2 percent of 1,606 - again
    better than the pool. IBV is in range: Quan et al. 2010 frames the three genera including Gammacoronavirus explicitly,
    and the 2026-10-05 work recorded above screened the stored primers against 884 complete genomes spanning alpha-, beta-,
    gamma- and deltacoronaviruses. Fourth worked example of the above-pooled pattern.'
