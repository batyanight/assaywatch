  notes_curator: 'SPLIT OUT OF THE PRIMARY ENTRY 2026-10-14, on the evidence the primary entry''s own notes_curator
    had already assembled. Xiao et al. 1999 prints a nested pair of pairs: primary PCR, ''about 1,325 bp'', with TTCTAGAGCTAATACATGCG
    and CCCTAATCCTTCGAAACAGGA; secondary PCR, ''819 to 825 bp (depending on the species)'', with GGAAGGGTTGTATTTATTAGATAAAG
    and AAGGAGTAAGGAACAACCTCCA. This entry is the SECONDARY pair, which sat in the primary entry''s oligos.alternates
    until now. WHY THAT MATTERED RATHER THAN BEING UNTIDY: score.oligo_pools treats alternates as interchangeable
    members of one pool and takes the best product over the cross product, which is right for a consensus cocktail
    and wrong for a second round. Screened as one entry, the secondary pair''s 822 bp product was being credited
    to an assay declaring 1319 bp - and with amplicon.declared_tolerance on (2026-10-14) it was instead discarded,
    taking the entry from `stable` to `insufficient data` in the tier-2 retrospective because the records carrying
    it no longer counted for anything. Split, each round is screened and reported on its own product.

    AMPLICON MEASURED, NOT COPIED. scripts/check_amplicons.py over every Cryptosporidium archive gives a modal 822
    bp on 240 records for this pair (871 bp on 13 for the cross-pairing F1 x R2, which is not an assay), against
    the paper''s stated 819-825. amplicon_bp is the measurement; the paper''s range is consistent with it. The primary
    entry measures 1319 exactly, which is why its stored value stands.

    The oligos themselves were verified against this paper by scripts/verify_oligos_against_paper.py: Ziao18SF2 and
    Ziao18SR2 both read exact. Neither carries the in-house correction that the primary entry''s reverse does.'
