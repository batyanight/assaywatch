  notes_curator: 'Added 2026-10-06. OLIGOS READ FROM THE PAPER''S METHODS (p. 2044, ''Genus-specific first-step primers''
    and ''Species-specific second-step primers'' paragraphs) and CHECKED BY EYE against a 300-dpi render of that page made
    with pymupdf: this PDF is a scan with an OCR text layer, so the layer was not trusted alone. The layer and the image agree
    on every base of all seven oligos; the only OCR damage is the prime mark printed as ''59339'' (5''->3''). This is the
    same paper (Messmer et al., J Clin Microbiol 1997; 10.1128/jcm.35.8.2043-2046.1997) that docs/2026-10-05-list2-worklist.md
    records as ''both rounds found no product in 8 strided 16S records, OCR-damaged''. The primer text is in fact intact,
    and the earlier null is explained by coverage: many C. psittaci 16S deposits are 3''-half fragments that do not contain
    the sites (see below). THE PAPER IS A NESTED, MULTIPLEX 16S rRNA PCR: step 1 is genus-specific (436 bp); step 2 puts five
    primers in one tube (a shared C. pneumoniae/C. psittaci sense primer, a C. psittaci antisense, a C. pneumoniae antisense,
    and a C. trachomatis pair) and tells the species apart by product size on agarose (trachomatis 412, pneumoniae 221, psittaci
    127). It is therefore entered as four files: this paper''s round 1 (genus) and three round 2 species pairs. The paper
    presents the primers as its own and cites no source or GenBank accession for them, so oligos_designed_here is true. design_year
    is the publication year by registry convention; the paper was received 1996-12-23. THE PAPER''S SIZES ARE ONE BELOW THE
    MEASURED ONES IN ALL FOUR CASES (436/127/221/412 stated; 437/128/222/413 measured, counting both primers, confirmed by
    exact string search in CP002549.1 for psittaci). The measurement wins. THIS FILE: ROUND 1, THE ''GENUS-SPECIFIC'' OUTER
    PAIR (ACGGAATAATGACTTCGG / TACCTGGTACGCTCAATT, paper 436 bp), read by eye from the page image. THE SEQUENCES ARE ENTERED
    EXACTLY AS PRINTED, AND TWO PROBLEMS WITH THEM ARE FLAGGED, NOT FIXED. MEASURED on 579 GenBank Chlamydia records, de-duplicated:
    all C. psittaci 16S/genome records (271), all C. pneumoniae (48), 87 C. trachomatis (all 45 16S records and 42 strided
    genomes), and a STRIDED sample of the 1,162 16S-titled records of the whole genus (txid810; every 5th uid, 233 records,
    of which 173 were not already in the species sets), queried 2026-10-06. 243 records give a product: 155 at 437 bp (all
    psittaci and pneumoniae products plus 30 others), 76 at 438 (all 72 C. trachomatis products plus 4 others), 6 at 436,
    2 at 435 and 4 spurious short ones (88 and 51 bp, all fail). The modal measured size is 437 (paper: 436). PROBLEM 1, THE
    ANTISENSE PRIMER AS PRINTED DOES NOT MATCH ANY REAL RECORD AT ITS PENULTIMATE 3'' BASE. The page image prints TAC CTG
    GTA CGC TCA ATT. Across psittaci, pneumoniae, trachomatis and the other species sampled, the 16S sense strand reads ATTTGAGCGTACCAGGTA
    at this site (checked by direct alignment on C. psittaci and C. trachomatis records), whose reverse complement is TACCTGGTACGCTCAAAT:
    the printed primer has T where the records need A, a T:T mismatch one base in from the 3'' end. The tool scores it as
    penalty 3 on 238 of the 243 product-bearing records and 3.5-8 on the other five (extra mismatches), so NO record scores
    better than 3. This looks like a typo in the paper, but nothing independent was available to say what the authors actually
    ordered (no second source prints this primer), so the printed form is kept and the discrepancy is recorded here; the corrected
    form TACCTGGTACGCTCAAAT is a hypothesis, not a finding. Its consequence in the tool: no record can score ''detect'' for
    this entry (0 of 243 do), the best call is ''reduced''. PROBLEM 2, THE SENSE PRIMER IS NOT GENUS-WIDE. ACGGAATAATGACTTCGG
    matches C. psittaci and C. pneumoniae records exactly (the very sequence of the paper''s shared inner sense primer, shifted
    4 nt upstream) but carries 5 mismatches (6, 7, 8, 12 and 13 nt from its 3'' end; 6 mismatches, adding the terminal base,
    in the 32 trachomatis records of the serovar-variant type) against C. trachomatis (all 72 trachomatis products are ''fail'';
    the C. trachomatis inner sense primer begins 5 nt downstream of this primer''s start, where C. trachomatis reads ACGGAGCAATTGTTTCGG
    against the primer''s ACGGAATAATGACTTCGG). Calls among product-bearing records: psittaci 108 reduced and 4 fail; pneumoniae
    12 reduced and 1 fail; trachomatis 72 fail; other genus members sampled (C. abortus, felis, pecorum, muridarum, avium,
    gallinacea, uncultured Chlamydia): 20 reduced, 26 fail. So in silico this is a psittaci/pneumoniae-clade 16S primer, not
    a genus primer, although the paper reports that 5 IFU of each of the three species amplified in step 1; with the 3'' five
    bases matching, a nested design can tolerate the trachomatis mismatches in later cycles, so the wet claim is not contradicted,
    but the screen will report trachomatis (and several other species) as failing. Of the 173 sampled records outside the
    species sets, 46 give a product and 127 give none: 63 are truncated and 59 have no site (coverage: 3''-half 16S and spacer
    fragments, 156-3,529 bp), 3 are called diverged (1,359-1,374 bp records FR714401, FR714406 and LN810453, whose forward-primer
    window is present but has no credible match) and 2 are chance-only (OQ058824, OQ058829). Entered at the genus level (txid
    810) because that is the paper''s claim; narrowing the taxon to the C. psittaci/C. pneumoniae clade is a maintainer decision.'
