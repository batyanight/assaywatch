  notes_curator: 'Added 2026-10-05. SEQUENCES READ OFF A FIGURE IMAGE: this paper has no primer table in text form. Figure 2C prints the primer and probe sequences, and Figure 2B shows their footprints boxed over an alignment of orthobornavirus X/P gene sequences, positions 90/93 to 222/225. The page was rendered and read as an image. THE REVERSE PRIMER IS STORED REVERSE-COMPLEMENTED FROM WHAT THE FIGURE PRINTS, and the records are why. Figure 2''s caption says the boxes mark primer BINDING REGIONS, and screening confirms it: BornaPCA6(-) as printed matches the SAME strand as the forward primers in real records, so taking it literally as an oligo would give a pair that can never amplify. The stored reverse oligo is therefore GAGATCATGGANGGRTTCTT, the reverse complement of the printed AAGAAYCCNTCCATGATCTC. This is the failure mode CONTRIBUTING.md warns about - a reverse primer stored without being reverse-complemented - caught by screening rather than by reading. VERIFIED: 3 of 24 strided Orthobornavirus records gave a product, every one exactly 123 bp, which is consistent with the alignment''s stated span. amplicon_bp is measured; the paper states no size. The hit rate is low because most deposits are partial sequences of other genes. THE FORWARD IS A POOL of two primers that differ only in their 5'' extension, BornaPCA3 and BornaPCA3A, which the alignment shows matching different virus groups. Both are recorded, with the second as an alternate. THE PAPER''S ASSAY IS A TRIPLEX AND IS SPLIT INTO THREE ENTRIES, one per probe, on the same reasoning used for the Perkinsea and Bd lineage assays: the three probes identify different host groups on one amplicon, so pooling them would collapse three different findings into one number. This entry carries BornaA_A647N, the probe for AQUATIC BIRD bornaviruses (ABBV). It was not present in the 3 sampled records that amplified, which is expected: those are psittacine viruses and this probe is for a different host group. A proper retrieval group is needed before any detected share from this entry means anything. CITATION CORRECTED before commit: the reference was first written from memory as Nobach et al. and was wrong. Crossref gives Sigrist, Geers, Albini, Rubbenstroth & Wolfrum, ''A New Multiplex Real-Time RT-PCR for Simultaneous Detection and Differentiation of Avian Bornaviruses''. The entry ids were renamed to match. Recorded because this registry has been bitten by misattributed citations repeatedly, and the only reason this one did not land was that every DOI is checked against Crossref before the entry is kept. | Oligo annotations moved from name field: BornaPCA3 (forward): +; BornaPCA6 (reverse): -; BornaPCA3A (alternate[0]): + EVERY OLIGO CONFIRMED 2026-10-23, and the
    `near:1` was a different assay. All of this entry''s oligos live only in Sigrist et al. 2021 Figure 2C, an image,
    so BornaPCA3, BornaPCA3A and BornaA_A647N read `absent` and will always do so; the probes additionally carry their dye
    labels in the figure. Page 4 was rendered at 600 dpi and read: the figure prints BornaPCA3(+) CCCGCAGACAGYACGT,
    BornaPCA3A(+) GATCCGCAGACAGYACGT, BornaPCA6(-) AAGAAYCCNTCCATGATCTC and the three dye-labelled probes, all matching
    what is stored, with BornaPCA6 stored as the reverse complement as this entry already records. The `near:1` reported
    for BornaPCA6 is NOT a near-miss against its own primer: it matched PaBVcon_1401+ AAGAAGAAYCCYTCCATGATCTC, one of
    the previously published comparison assays listed in supplementary Table S4, which overlaps the same site. So the
    verifier was scoring this registry against a third party''s primer. Nothing is in doubt. One chemistry detail is worth a second eye:
    the reporter is stored as "Alexa 647N" while Figure 2C labels the probe A647N, which is the conventional short form
    of Atto 647N - Alexa Fluor dyes carry no N suffix. The dye name is not screened and has not been changed here.'
