  notes_curator: 'Added 2026-10-05 from the paper''s own text in papers/, extracted with scripts/extract_candidate_oligos.py and then screened against strided GenBank samples before the entry was trusted - strided rather than from the head of the archive, because archives are accession-ordered and their first records are never representative. Avian pox was absent from the registry. TRANSCRIPTION IS SOUND, on strong internal evidence: of 40 strided Avipoxvirus records, 6 gave a product, every one of them exactly 250 bp, and the probe site was present in all 6. Three independent oligos landing in the same place with an invariant spacing is not something a mistyped sequence does. AMPLICON DISAGREES WITH THE PAPER AND THE MEASUREMENT WINS. The paper states a 234 bp fragment; every record measured here gives 250. amplicon_bp is set to the measured 250 and the disagreement is flagged rather than averaged away - it may be a strain indel, a numbering convention, or an error in the text, and it is not resolvable from what is in hand. COVERAGE IS NARROW AND THAT IS PROBABLY REAL. Only 6 of 40 sampled records yield a product. Avipoxvirus is a diverse genus - fowlpox, canarypox, pigeonpox and more - and this assay was developed on avipox from Hawaiian honeycreepers, so being judged against the whole genus is almost certainly a scope mismatch rather than drift. Left unscoped pending the registry-wide lineage-scoping decision, with the number recorded here so a low detected share is not read as assay failure. SECOND LOOK, 2026-10-05: a run against this paper''s PubMed Central full text reports 1R as absent, and that is a fact about the text rather than a question about the primer. 1F and the Pox1 probe both appear in the PMC narrative; 1R does not, nor does its reverse complement, because PMC drops table-wrap content and that is where the primer pair was printed - the PDF this entry was built from carried it. Nothing to re-investigate here: an invariant 250 bp product across 6 independent records with the probe site present in all 6 cannot arise from a wrong reverse primer. Written down because `absent` otherwise reads as evidence that an oligo is not this paper''s, which is the opposite of the truth in this case.'
