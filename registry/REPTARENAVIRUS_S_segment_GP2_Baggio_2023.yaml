  notes_curator: 'Primers read from Table 1 of the paper (PDF pages 7-8): the text layer and the pages rendered at 200 dpi
    and read by eye agree for all 13 oligos. THE PAPER RUNS ONE TUBE, NOT PAIRS. Six forward (F1-F6) and seven reverse (R1-R7)
    primers are mixed in a single Phusion Flash RT-PCR (cDNA from random hexamers; F1-F5 and R1-R6 at 0.4 uM, F6 and R7 at
    0.2 uM; 98 C 10 s, then 38 cycles of 98 C 1 s / 58 C 2 s / 72 C 3 s) and products are read on a 2.3% agarose gel; there
    is no probe and no designated F/R pairing. The registry has no schema for a cocktail, so it is stored as ONE entry: F1
    and R1 are the primary pair only because they head the table, and the other 11 primers are `alternates` with an orientation.
    assaywatch scores a record by the best of all 6 x 7 forward/reverse combinations, which is what the tube does, but it
    also means combinations nobody designed together (for example F6 with R2) can be the winner, and the winning pair is not
    written to the TSV. DESIGN: all 13 primers were designed in this paper from reptarenavirus S segments in GenBank (UGENE/MUSCLE
    alignment), aimed at about 140 bp inside the GP2 region of the glycoprotein precursor ORF. VERIFIED against the GenBank
    records the paper itself names or uses as controls, with the tool''s own matcher: on UGV-1 KR870012.1, F1 is exact at
    1020-1040 and R4 exact at 1142-1164 (145 bp); on UGV-2 KR870015.1 the same (145 bp); on S5-like KX527581.1 and MH483080.1,
    F5 and R6 are exact (141 bp); on TSMV-2 NC_039007.1, F4 and R2 are exact (141 bp); on UGV/S6-Costa Rica OM456554.1, F6
    and R7 are exact (148 bp); on UHV-2 KR870016.1, R5 is exact. Those are the 100%-identity assignments Table 1 lists for
    each primer, so the transcription is consistent with the paper''s own table and with the records. MEASURED. Retrieval:
    every Reptarenavirus record with length >= 100 bp (txid1653395, 2026-10-06; 387 records, not a sample). Of these, 263
    are L-segment records and 124 are S-segment records. The primers target the S segment only, and screened against all 387
    the L records produce 53 chance pairs at 228-2,773 bp (tool E-value 0.002-0.01, all calls fail) and 202 no_site, so the
    entry''s query restricts retrieval to S records by title: ("segment S" OR "S segment" OR nucleoprotein OR glycoprotein
    OR GPC)[Title]. Checked against the 387-record set, this query returns exactly the 124 S records: all 114 records that
    give a product, none of the 53 L chance pairs. RESULT on the 124 S-segment records: 114 give a product of 139-148 bp (145
    in 48, 141 in 27, 144 in 15, 139 in 12, 148 in 10, 147 in 2), so amplicon_bp 145 is the measured mode and the paper''s
    ''approximately 140 bp'' is the low end of a real spread that depends on which F/R combination wins (the primers start
    and end a few nucleotides apart). Calls among the 114 spanning records: detect 94 (82.5%), reduced 15, fail 5 (detect+reduced
    109, 95.6%). The 5 fails are all CAS virus / Corallus annulatus S segments (JQ717262.1, NC_018481.1, KP071528.1, KP071530.1,
    KP071532.1), a lineage the paper''s Table 1 does not list, with five mismatches in the 5'' half of a forward primer and
    four on the reverse primer (three of them 6-8 nt from its 3'' end). The other 10 S records do not span the site: 5 are
    451-453 bp nucleoprotein fragments of Boa arenavirus NL, 4 are 234 bp nucleoprotein fragments that end before the forward
    window, and 1 is a 1,895 bp partial UHV-3 S segment with no site for either primer. READ THE SHARE WITH CARE. The primers
    were designed on these same GenBank S segments, so a high in-silico share here is not independent validation; and 62 of
    the 114 spanning records are titled ''Unidentified Reptarenavirus'' (the ones inspected are California snake strains),
    so the share is weighted toward the lineages most often sequenced. The paper''s own evidence is wet-lab: 245 blood samples
    against segment-specific RT-PCR, and detection limits of 10 to 10^4 S-segment copies per reaction by lineage. SCOPE: S
    segment only; the L segment (ZP and RdRp, the more diverse one per the paper) is not targeted, so a reptarenavirus carrying
    only an undetected S lineage would be missed even though L records are numerous in GenBank. taxid 1653395 is the genus.
    Hartmaniviruses and mammarenaviruses are not retrieved. DEDUPLICATION: no other registry entry uses these oligos. Reptarenavirus_GP_Aqrawi_2015
    (MDS402/MDS400, 287 bp) targets the same genus and a nearby GPC region with different primers; its forward primer overlaps
    the F1/F2 site, so the two assays are related but not duplicates. EXCLUDED: nothing in the paper''s primer table; the
    qRT-PCR primers and probes it uses to quantify virus stocks are cited to an earlier paper and are not printed in this
    one.'
