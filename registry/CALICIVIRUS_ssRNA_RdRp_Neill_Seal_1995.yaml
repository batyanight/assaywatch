  notes_curator: 'ADDED 2026-10-24. This is the SECOND of the two primer pairs Neill & Seal 1995 designed; the registry already
    held the first as CALICIVIRUS_ssRNA_Helicase_Reid_1999. The paper''s own title is "Development of PCR primers for specific
    amplification of two distinct regions", the two regions being the 2C-like RNA helicase (the sibling entry, 357 bp) and
    the RNA-dependent RNA polymerase (this entry). It was found while re-reading the held design-paper deposit for the helicase
    entry''s Hel1 terminal-base question on 2026-10-24, and it was simply never entered: the sibling''s own note had checked
    only whether the CAPSID entry''s primers were in this paper, not whether this paper held a pair of its own that nothing
    in the registry carried. OLIGOS read from the design paper''s Methods, held locally as the Elsevier JATS deposit papers/10.1016_s0890-8508_95_90962-1.xml:
    "Pol1 (5''- GCCTTCTGGTATGC CACTAACATCC-3''); Pol2 (5''- GACGAGCGGTATGATCTTGTTG GTG-3'')". CAUTION, AND IT IS WHY THESE
    ARE SAFER THAN THAT DEPOSIT''S HELICASE PRIMER: this deposit is OCR''d and inserts a spurious space inside three of its
    four printed oligos, including both of these (the space before CACTAAC in Pol1 and before GTG in Pol2). The spaces were
    closed to give two 25-mers. Unlike the sibling''s Hel1, where the disputed 3''-terminal base matches NO record, BOTH closed-up
    forms here are CORROBORATED BY THE SEQUENCE DATA: measured over the 152,379-record Caliciviridae archive on 2026-10-24,
    Pol1 has an exact site in 11 records and Pol2 in 19, and the pair gives a product in 8, every one exactly 520 bp - the
    size the paper states ("520 bp, 9 of 11 viruses"). A primer whose transcription was wrong could not match real records
    exactly nor reproduce the published product size, so the space-closing is confirmed rather than assumed. Orientation confirmed
    the same way: Pol1 is the forward and Pol2 the reverse, product 520 bp, on San Miguel sea lion virus, bovine calicivirus
    and vesicular exanthema of swine virus (DQ666630, U18741, U18737 among others). SCOPED to scope_taxids [3433198] (Vesivirus
    exanthema), rank species under Caliciviridae > Vesivirus, identical to the helicase sibling and for the same reason: taxid
    11974 is the whole family and is ~99.9 percent norovirus, which this assay was never meant to detect, while the paper
    reports feline calicivirus negative. AMPLICON 520 bp is the paper''s stated size AND the measured size, which agree exactly,
    so no amplicon_disagrees flag. SCREENED 2026-10-24 with the project''s own scorer over the whole 152,379-record archive,
    then scope-filtered exactly as drift.py does (taxonomy-cache.json.gz, within 3433198): 27 IN-SCOPE evaluable records,
    40.7 percent detection (9 detect, 2 reduced, 16 fail), 8 known out-of-scope records dropped. Note the gap from the raw
    exact-match count: pasting each oligo in found 8 records with a perfect product, but the scorer tolerates mismatches and
    so finds 27 evaluable Vesivirus-exanthema records, 11 of them passing - the same exact-match-understates-the-scorer lesson
    the monkeypox trio taught the same day. The 16 in-scope fails are vesiviruses the 1995 pair scores below threshold; whether
    that is breadth of the modern 3433198 node or genuine divergence is not worth adjudicating on 27 records. THIN, therefore:
    27 evaluable is too few for a drift verdict, which is what thin_evidence records. The value is coverage of a
    wildlife/marine-mammal calicivirus target the registry otherwise reached only through the helicase region. status: draft
    and doi_verified: false on entry; only a maintainer sets active.'
