  notes_curator: 'CITATION FOUND 2026-10-22. EntF and EntR verify exact against McFarland et al. 2021 (J Zoo Wildl Med 52:232-240), which prints both in its Materials and Methods and says the degenerate pair was developed from an alignment of 16 GenBank Entamoeba SSU sequences for a 502 bp product. This is the publication of the seed list''s assay and not a different one. design_year LEFT NULL on purpose: the assay is already in the 2018 seed list, so it was designed on or before 2018 and the 2021 publication year is not its design year. The paper states no design date, so the drift baseline stays open.'
