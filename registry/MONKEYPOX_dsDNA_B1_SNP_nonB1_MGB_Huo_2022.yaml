  notes_curator: 'ADDED 2026-10-27 from the open-access full text (PMC9633113, Europe PMC) Table 1 "Primers and probes designed
    in this study" and Section 2.3, which assigns each probe to its target by reporter dye. Panel 2 shares one primer pair
    across its probes; each probe is one entry here, the pattern the Li 2010 G2R trio uses. This probe is the one Section
    2.3 labels FAM with a 3-prime minor groove binder, specific to MPXV clades IIa/IIb other than B.1 (a 16-mer SNP probe
    at 183524-183539 of ON563414.2); chemistry mgb for that reason. AMPLICON NOT STATED BY THE PAPER. MEASURED 2026-10-27
    by screening this entry against every archive of taxids 10244 and 10242: 81 bp in 28,882 of 28,888 products over 35,539
    records; calls reduced 18,915 / detect 1,388 / fail 8,528 / no_amplicon 6,651 -- a 16-mer MGB SNP probe reads one mismatch
    (reduced) on B.1 records by design. DOI resolved through Crossref by scripts/resolve_citations.py on 2026-10-27; status draft; only a maintainer sets active.'
