  notes_curator: 'Added 2026-10-19 from candidate oligo extraction (papers/10.1016_s0016-5085_98_70589-x.pdf). Same forward
    primer (C97) as the long-amplicon entry Helicobacter_Pan_Helicobacter_16S_Jim_Fox_1998 (C97+C05, 1196 bp), but paired
    with C98 instead of C05 to give a shorter product. The paper states the C97+C98 pair produces "approximately 400" bases
    and the C97+C05 pair "approximately 1200" bases. 16S rRNA positions from paper: C97 at 276-291 (forward), C98 at 681-698
    (reverse). AMPLICON_BP: not set; the paper says ~400 bp, needs measurement against GenBank Helicobacter 16S sequences. MADE SCREENABLE 2026-10-24, and it had never been screened once. This is the entry behind the standing `209/all` item in docs/RESUME-HERE.md and behind the finding that "an assay can sit in CURRENT_ASSAYS and never be screened at all". It had no target.query, so its retrieval group was 209/all - every Helicobacter record, 843,447 of them, over retrieve''s 100,000 cap - and retrieval skipped it with `SKIP 209/all: ... Add 209 to retrieve.large_taxa_allowed ... or narrow the assays'' target.query`. There is no results/screened/209/all directory at all, which is the proof. THE FIX IS THE SECOND OPTION THE WARNING OFFERS, not the first. target.query is now character-for-character the query its sibling Helicobacter_Pan_Helicobacter_16S_Jim_Fox_1998 already carries, which Helicobacter_16S_Conley_2021 carries too, so the 16S query is the established pattern for this taxon in this registry. Because the string is identical the group slug is identical, so this entry joins the EXISTING 209/qea281b18a4 archive of 6,008 records and needs no new retrieval - nothing is downloaded. Adding 209 to large_taxa_allowed was rejected: it would fetch 843,447 records to screen a 16S assay whose product is 398 bp, and the sibling already demonstrates the query is sufficient. Note the consequence the Snakefile documents: adding an assay to a group changes that group''s screen signature, so 209/qea281b18a4 rescreens on the next run. amplicon_bp MEASURED as 398 and amplicon_size_unresolved removed. Measured over all 6,008 records of that archive: C97 and C98 both have exact sites in 1,926 records, and the product is 398 bp in 1,848 of them (96 percent), with a narrow tail of 397 (22), 399 (28), 400 (10), 402 (6), 396 (4), 405 (2) and 388 (2). Unimodal, so a scalar and not an amplicon_bp_range, on the same reasoning the CALICIVIRUS Helicase entry records. NO amplicon flag is set, and that is deliberate: the paper DOES publish a size, but as an approximation - "primer pairs C97 and C98 or C97 and C05 were used to generate 16S rRNA amplicons of approximately 400 or 1200 bases" and later "produced the expected 400-bp amplicon in 9 of 23 samples". 398 is the measured realisation of "approximately 400", so amplicon_disagrees_with_paper would be false and amplicon_measured_not_published would be false too. (For a maintainer: the sibling entry carries amplicon_measured_not_published for its 1196 bp against the same paper''s "approximately 1200", which looks mis-set for exactly this reason. Not changed here.) The paper also gives primer coordinates, C97 at 276-291 forward and C98 at 681-698 reverse, which span 423 in that reference numbering; the 25 bp difference from the measured 398 is indels between the reference numbering and real Helicobacter 16S, not a disagreement about the oligos. CITATION PAGE RANGE CORRECTED from 114:1174-1180 to 114:755-763. Crossref gives 755-763 for 10.1016/S0016-5085(98)70589-X, titled "Hepatic Helicobacter species identified in bile and gallbladder tissue from chileans with chronic cholecystitis", Gastroenterology 114, 1998 - and that is the paper whose Methods print C97, C98 and C05, read here directly. The sibling entry already had 755-763, so the two entries disagreed about the pages of the one DOI they share; 1174-1180 was a transcription error.'
