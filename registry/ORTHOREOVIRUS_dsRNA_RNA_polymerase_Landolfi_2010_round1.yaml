  notes_curator: 'SPLIT OUT OF THE BASE ENTRY 2026-10-14, on the paper itself (obtained that day and saved to
    papers/10.1177_104063871002200106.pdf). The methods are explicit and this is a SEMI-NESTED design sharing one
    forward primer: "The first round utilized forward primer 2090F ... and reverse primer 2334R ..., which was the
    second round of the original protocol. The second round utilized 2090F and a different reverse primer, 2200R".
    This entry is the FIRST round, 2090F x 2334R; the base entry holds the second round, 2090F x 2200R, which is
    the pair it stored all along.

    THE 2334R REVERSE HAD BEEN SITTING IN THE BASE ENTRY''S oligos.alternates, where score.oligo_pools treated it
    as an interchangeable member of one pool with 2200R and took whichever product scored better - so a 274 bp
    round-1 product was being credited to an entry declaring 163 bp. An alternate that makes a different product
    is a round, not a pool member.

    AMPLICON MEASURED, BECAUSE THE PAPER GIVES NO SIZE FOR ROUND 1. scripts/check_amplicons.py over the
    Orthoreovirus archive measures 2090F x 2334R at a modal 274 bp (216 records at 3 mismatches). The paper''s
    only stated product is the second round''s, and only after processing: the abstract reports a "109-base pair
    (bp) product", while the round-2 pair measures 161 bp - the difference is the two 26-mer primers, since the
    methods say "primer sequences were edited out prior to analyses" (161 - 26 - 26 = 109). That arithmetic is the
    reason to trust the base entry''s stored 163 and this entry''s measured 274.

    WHY THE ORIGINAL PROTOCOL MATTERS FOR READING THIS. Landolfi adapted a published protocol and deliberately
    chose a shorter target "to increase chances of success with probable shorter fragments of RNA present in FFPE
    tissues", promoting that protocol''s second round to its own first round. So round 1 here is not the ancestral
    outer PCR, and a drift verdict on it speaks to this adaptation rather than to the original assay.'
