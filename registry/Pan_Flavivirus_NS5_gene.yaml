  notes_curator: 'PREDICT panel protocol P-009 (NS5), confirmed 2026-10-04 by exact match of every oligo to that protocol''s
    round 1 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Moureau,
    G. et al, (2007). TAXON RENAMED: NCBI now calls txid11051 ''Orthoflavivirus''; this entry carried the superseded name
    ''Flavivirus''. Checked 2026-10-05 during the repo-wide audit. The taxid is unchanged and is what retrieval uses, so nothing
    about the screening changes - but a report naming the old taxon would not match what GenBank now says.


    TAXID RETIRED 2026-10-27: NCBI has merged 11051 into 3044782 (Orthoflavivirus), so this entry now carries the canonical
    id. Retrieval resolved the old id and nothing had noticed, which is the point -- an entry on a retired id is one taxonomy
    release from an empty archive. data/retrieved/11051/ moved to data/retrieved/3044782/ and the manifest was rebuilt in
    the same commit, so no archive was re-fetched. Found by scripts/check_taxids.py''s containment check; see docs/journal/2026-10-27-retired-taxids.md.'
