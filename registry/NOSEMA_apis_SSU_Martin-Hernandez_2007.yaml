  notes_curator: 'Added 2026-10-07 from Table 2 of Martin-Hernandez et al. 2007 (doi 10.1128/AEM.00270-07; open access, PMC2075036),
    read on the PMC table page (sequences from its text, tails from its underline markup). Table 2 prints two pairs for one
    duplex PCR, entered as sibling entries: 218MITOC (N. ceranae) and 321APIS (N. apis). TAILS: the paper underlines the tail
    bases and states that G or GC tails were added to the 5'' end of all primers to make the melting temperatures of each
    primer set equal; they are recorded in tail_5prime so matching uses only the template-binding bases. The tail lengths
    are taken from the underlining and are flagged for review (TAIL_LENGTHS_FROM_PAPER_UNDERLINE). DESIGN: oligos_designed_here
    is true on the paper''s own methods: primers were selected by eye from a ClustalW alignment of GenBank 16S rRNA sequences
    (N. apis DQ235446, U76706, U97150, U26534, X73894, X74112; N. ceranae DQ329034, U26533, DQ078785, DQ286728; plus N. bombi,
    N. portugal and N. trichoplusiae for specificity), with a second requirement of two amplicon lengths separable on agarose;
    annealing 61.8 C by gradient. MEASURED 2026-10-07 by screening the 78 records of the query 16S[Title] OR 18S[Title] OR
    "small subunit"[Title] OR SSU[Title] OR rRNA[Title] within txid 35231, fetched the same day (counted by call): 55 no_amplicon,
    23 detect; the no_amplicon rows by exclusion are 31 truncated, 24 no_site. Product length between the binding sites is
    312 bp in 23 of 23 products; adding the 10 tail bases (4 + 6) gives 322, one more than the paper''s stated 321, which
    is not explained here (the tail lengths and the paper''s count were not reconciled). amplicon_bp is the measured 312.
    Only 23 of 78 records carry the amplicon, so this is a small sample and no coverage statistic is claimed. SCOPE: single
    species.'
