  notes_curator: 'Spreadsheet lists STerR before STerF; parser assigned by name suffix. Probe fluorophore flagged ''VERIFY'' in sheet. PROVENANCE SPLIT, found 2026-10-05 by scripts/check_primer_provenance.py and confirmed by reading Blooi et al. 2013''s Methods. This entry is a COMPOSITE and the citation covers only part of it:\n  - STerF and STerR are NOT Blooi''s. The paper says ''The previously described forward primer     STerF ... and reverse primer STerR ... were used to detect the 5.8S rRNA gene of B.     salamandrivorans (6)''. Its reference (6) is Martel, A., Spitzen-van der Sluijs, A., Blooi,     M. et al., ''Batrachochytrium salamandrivorans sp. nov. causes lethal chytridiomycosis in     amphibians'', PNAS 110, 15325-15329 (2013), doi:10.1073/pnas.1307356110 (verified against     Crossref). The scope of these two primers must be read from Martel 2013.\n  - The probe IS Blooi''s: ''The B. salamandrivorans-specific Cy5-labeled probe STerC ... was     developed using Kodon''. Note the paper calls it STerC where this registry stores STerPROBE.\nSo Blooi 2013 contributed the probe and the qPCR, not the primer pair, and oligos_designed_here is False. All three sequences match the paper exactly. The primers target the 5.8S rRNA gene; GenBank KC762295 is the reference the paper names.'
