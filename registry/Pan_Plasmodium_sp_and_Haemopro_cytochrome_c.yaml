  notes_curator: 'PROVENANCE CORRECTED 2026-10-05, from the full text of Hellgren et al. 2004 read through the NYU library. HaemF and HaemR2 are NOT this paper''s primers. Its Methods say so in as many words: ''For the second PCR, we used HaemF-HaemR2 primers (Bensch et al., 2000) for Plasmodium spp. and Haemoproteus spp.'' The design paper is Bensch, S., Stjernman, M., Hasselquist, D. et al., ''Host specificity in avian blood parasites: a study of Plasmodium and Haemoproteus mitochondrial DNA amplified from birds'', Proc R Soc Lond B 267, 1583-1589 (2000), doi:10.1098/rspb.2000.1181 (verified against Crossref). Hellgren 2004 is where this registry read the sequences from and is the paper that nests them, so the citation is kept and oligos_designed_here is set False - the scope of these two primers has to be read from Bensch 2000, not from Hellgren. Both sequences match the Hellgren text exactly, and the 480 bp product size is confirmed there (''480 bp for Haemoproteus spp. and Plasmodium spp.''). This is the same error class as the ranavirus MCP assay, found on the first paper fetched through the library, which suggests the registry''s other nested second-round entries deserve the same check. | SCOPE 2026-10-19: scope_taxids follows the primers'' design paper, Bensch et al. 2000, ''Host specificity in avian blood parasites: a study of Plasmodium and Haemoproteus mitochondrial DNA amplified from birds'': the five avian Plasmodium subgenera in NCBI (Haemamoeba 418104, Huffia 418105, Novyella 418110, Giovannolaia 418112, Bennettinia 419353), Haemoproteus 77521 and Parahaemoproteus 587283. Leucocytozoon is excluded because Hellgren 2004 uses this pair for Plasmodium and Haemoproteus and a separate pair (HaemFL/HaemR2L) for Leucocytozoon. Before this the assay was judged against all Haemosporida: 2,250 Laverania records (0%) and 1,621 subgenus Plasmodium (8%) dominated. Plasmodium records with no subgenus are out of scope because NCBI does not say their host. BOTH OLIGOS CONFIRMED 2026-10-23, and a
    claim in this note was wrong. It said both sequences match the Hellgren text exactly; they are not in that text at
    all. Hellgren et al. 2004 prints only HaemNFI, HaemNR3, HaemFL and HaemR2L in running text, and gives HaemF and
    HaemR2 only in Figure 1, an image. The `near:4` reported for HaemR2 is a match to HaemR2L,
    CATTATCTGGATGAGATAATGGIGC - Hellgren''s Leucocytozoon reverse, a different primer - so correcting HaemR2 towards
    it would have replaced one primer with another. Both stored sequences are printed verbatim, named HaemF and HaemR2
    and alongside HaemR2L, in the methods of 10.1590/s1984-29612025027 (PMC12164655) and 10.1007/s00436-025-08509-w
    (PMC12149002); the first credits them to Bensch et al. 2000 (10.1098/rspb.2000.1181), which is scan-only and could
    not be read here, so the existing oligos_from_secondary_source flag stands.'
