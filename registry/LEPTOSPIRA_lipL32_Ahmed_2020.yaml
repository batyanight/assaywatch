  notes_curator: 'Added 2026-10-05 from the paper''s own text in papers/, extracted with scripts/extract_candidate_oligos.py and then screened against strided GenBank samples before the entry was trusted - strided rather than from the head of the archive, because archives are accession-ordered and their first records are never representative. The registry''s only Leptospira entry targeted flaB, so lipL32 - the standard target for PATHOGENIC Leptospira - was a gene gap on a taxon already tracked. VERIFIED: of 24 strided lipL32 records, 6 gave a product, all exactly 114 bp, with the probe present in all 6. amplicon_bp is measured; the paper states no size. THE PAPER''S INTERNAL-CONTROL OLIGOS ARE DELIBERATELY EXCLUDED. Its oligo table also lists IntoF2, IntoR2, IntoP1 and PlasintS1, which target a synthetic internal control rather than Leptospira. Entering those as part of the assay would have the tool screening a plasmid sequence against Leptospira records and reporting the inevitable non-detection as drift. The table labels them ''Internal Control'', which is the only reason the distinction was visible - a good argument for reading tables rather than harvesting sequences. SCOPE. taxid 171 is the whole genus, which includes saprophytic species the assay intentionally does not detect: lipL32 is largely restricted to pathogenic Leptospira. So a detected share below 100% here is expected by design, and this entry is a candidate for lineage scoping once that decision is made.'
