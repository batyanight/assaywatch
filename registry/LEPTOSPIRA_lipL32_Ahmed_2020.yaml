  notes_curator: 'Added 2026-10-05 from the paper''s own text in papers/, extracted with scripts/extract_candidate_oligos.py and then screened against strided GenBank samples before the entry was trusted - strided rather than from the head of the archive, because archives are accession-ordered and their first records are never representative. The registry''s only Leptospira entry targeted flaB, so lipL32 - the standard target for PATHOGENIC Leptospira - was a gene gap on a taxon already tracked. VERIFIED: of 24 strided lipL32 records, 6 gave a product, all exactly 114 bp, with the probe present in all 6. amplicon_bp is measured; the paper states no size. THE PAPER''S INTERNAL-CONTROL OLIGOS ARE DELIBERATELY EXCLUDED. Its oligo table also lists IntoF2, IntoR2, IntoP1 and PlasintS1, which target a synthetic internal control rather than Leptospira. Entering those as part of the assay would have the tool screening a plasmid sequence against Leptospira records and reporting the inevitable non-detection as drift. The table labels them ''Internal Control'', which is the only reason the distinction was visible - a good argument for reading tables rather than harvesting sequences. SCOPE. taxid 171 is the whole genus, which includes saprophytic species the assay intentionally does not detect: lipL32 is largely restricted to pathogenic Leptospira. So a detected share below 100% here is expected by design, and this entry is a candidate for lineage scoping once that decision is made. SCOPE WAS CONSIDERED ON 2026-10-24 AND DELIBERATELY NOT CHANGED, and the investigation found something better than a scope fix. docs/2026-10-24-scope-audit.md item 10 proposed a scope_taxids list of the pathogenic species, on the grounds that taxid 171 is the whole genus and includes saprophytes. The paper does support that intent - Ahmed et al. 2020 say the assay "has the ability to detect all pathogenic Leptospira species currently known" and Table 1 tests 73 strains across pathogenic, intermediate and non-pathogenic species - but no clade node exists for "pathogenic Leptospira", so it would mean enumerating species by hand against a classification that has been revised since 2020, for a measured gain of about 1.5 points. Not done; it is a maintainer''s call and the numbers to decide on are below. WHAT THE MEASUREMENT ACTUALLY FOUND, and it is a paper-versus-screen disagreement on three named species. Over the whole 2026-10-24 calls table this assay reads 1,831 detected of 1,969 assessable (93.0 percent), and the 138 misses are not spread out - they concentrate in species described AFTER the primers were designed, every one of them scored `fail` rather than excluded, meaning the binding sites are present and mismatched rather than absent. The pattern is identical across them: the reverse primer carries a mismatch at position 1 from its 3'' terminus. Under `terminal_mismatch_fails: true` that is fatal on its own.
  species            screen                 paper Table 1
  L. kmetyi          0 detected of 13 fail   Pathogenic, scored +
  L. adleri          0 of 4 fail             Pathogenic, scored +
  L. gomenensis      0 of 8 fail             Pathogenic, scored +
  L. yasudae         0 of 18 fail            not in Table 1 (described later)
  L. wolffii         0 of 14 fail            Intermediate, scored -
So for three species the design paper reports a WET-LAB POSITIVE and this pipeline reports a complete in-silico failure. L. wolffii is the control that makes the finding credible rather than an artefact: the paper scores it negative and the screen fails it too, so the screen is not simply failing everything new. THE CONTRAST WITH THE SPECIES THE ASSAY WAS BUILT ON is sharp and is the reason this is worth recording. L. interrogans (578 records), L. borgpetersenii (209), L. santarosai (59), L. weilii (47), L. noguchii (36) and L. kirschneri (35) all match at penalty 0 with NO mismatch at any oligo. The assay is perfect on the classical pathogens and uniformly fatal on the newer ones, at one position. WHY THIS IS NOT ENTERED AS A VALIDATION CASE: docs/validation-cases.tsv requires a paper reporting how an assay ALREADY IN THE REGISTRY performed, and explicitly excludes "a new assay''s own panel validation". Ahmed 2020 is this assay''s own design and validation paper, so it does not qualify, and it is not added. It is however exactly the kind of evidence docs/2026-10-24-scoring-strategy-test-plan.md is short of: three lab-confirmed positives that the current scoring model calls `fail` for a single 3''-terminal mismatch, on a hydrolysis-probe assay where a terminal primer mismatch is far more tolerable than the rule assumes. Same mechanism as the CALICIVIRUS Helicase entry''s 3''-terminal G/C mismatch, and the same conclusion: this is the per-chemistry scoring gap in ROADMAP Phase 2, not coverage loss, and the 93.0 percent must not be read as drift. RECOUNT WHEN NCBI RECLASSIFIES, and note that if the pathogenic-species scope list is ever built, L. kmetyi, L. adleri and L. gomenensis are PATHOGENIC and so stay inside it - scoping would not hide this disagreement, it would only drop L. wolffii and L. yasudae, about 32 of the 138 misses, taking 93.0 percent to roughly 94.5 percent.'
needs_review:
- flag: primer_site_polymorphic
  note: the reverse primer mismatches at its 3'-terminal base in L. kmetyi, L. adleri,
    L. gomenensis, L. yasudae and L. wolffii, which terminal_mismatch_fails makes fatal;
    the six classical pathogens match at penalty 0 with no mismatch anywhere
- flag: scope_narrower_than_taxid
  note: the paper claims pathogenic Leptospira only and tests intermediates and
    saprophytes as negatives, while the taxid is the whole genus; no clade node exists,
    so no scope_taxids list is set

