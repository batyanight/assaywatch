  notes_curator: 'Added 2026-10-06 from the paper''s own Table 1 (papers/10.3390_v13081632.pdf), rendered at 220 dpi and read
    by eye as well as extracted as text; both agree, and the same three sequences are printed in Table 2 of Geiselhardt et
    al. 2022 (10.1128/jcm.02505-21) as ''CDV-Mix 3, Halecker et al.''. PROVENANCE: this is the Scagliarini et al. 2007 P-gene
    assay (10.1007/s11259-007-0020-9, registry entry CDV_P_gene_Scagliarini_2007) ''decisively
    adapted'' to newer genotypes. CDV3-R is byte-identical to Scagliarini''s CDVR3. The forward (CDV4.1-F, degenerate, starts
    2 nt upstream of CDVF4, hence 116 bp instead of 114) and the probe (CD3.1-FAMas, degenerate at positions 13 and 16, FAM/BHQ1,
    antisense) are Halecker''s modifications, so oligos_designed_here is true for the modified pair but the shared reverse
    primer means the two registry entries overlap. EXCLUDED from this paper''s Table 1: the ELIA-Mix (Elia 2006, entered separately
    as CDV_N_gene_Elia_2006), CDV-Mix 7 (entered separately), and the EGFP-Mix 2-HEX and beta-Actin-Mix 2-HEX internal controls
    (heterologous and host-gene controls, not CDV targets). VERIFIED on MN267060.1 (S460/15, Europe-1): forward at 2204-2225,
    reverse site 2297-2319, probe 2251-2274 (minus strand): a 116 bp product, the paper''s figure. Retrieval: the archive
    is every GenBank nuccore record under txid11232 (Morbillivirus canis; 4,063 records on 2026-10-06), fetched whole rather
    than strided because the total is small. ''Spanning'' below means the record holds the whole primer-to-primer window,
    judged by the screen producing a product or, for records with none, by a BLAST of the MN267060.1 window covering both
    ends. MEASURED: 605 records span the amplicon and all 605 give exactly 116 bp with the probe present: 536 detect, 25 reduced,
    44 fail (88.6% detect, 92.7% detect+reduced); 299 are genomes. The other 3,458 give no_amplicon (3,446 with no primer
    site: records that do not cover the P region; 11 truncated; 1 labelled diverged, MT932497.1, whose reverse site lies under
    a run of Ns). For comparison, the existing Scagliarini 2007 entry screened on the same archive gives 604 spanning records
    at 114 bp, 435 detect, 78 reduced, 91 fail (72.0% detect), and its CDVF4 mismatches at position 4 in 499 of 604 records,
    which is the weak spot this modification repairs. Halecker''s ROC/LOD/diagnostic-sensitivity (98.9%) figures are the paper''s
    and were not checked. Screened against 116 PDV records (txid3052347) all 72 spanning records fail, consistent with the
    paper''s report that PDV is not detected. SCOPE: CDV-wide, one of two P-gene assays the paper pairs as a ''double check'';
    the paper''s panel was mostly European lineages and the authors say the other lineages are untested.'
needs_review:
