  notes_curator: 'Added 2026-10-05 from the paper''s own Table 1, read out of the local PDF. The table prints the F3L assay
    as F3L-F290, F3L-R396 and the MGB probe F3Lp333S-MGB (6FAM/MGBNFQ), with a stated amplicon of 107 bp. amplicon_bp is the
    STATED size pending measurement against real records. MEASURED 2026-10-05 against a 50-genome sample of taxid 10244 drawn
    from the 12,274 nuccore records of 150-250 kb by date order and strided, so the sample spans 2003 to 2025 rather than
    the head of the list (which for monkeypox is almost all 2022 clade IIb). The full archive was not retrieved: 12,868 records
    at genome length is a download that belongs to a planned pipeline run, so the amplify check still reports WARN no-archive
    for these two entries and should be re-run after one. F3L gives a product in all 50, invariably 107 bp, which is exactly
    the size Table 1 states, and the probe site is exact in all 50. THE MEASUREMENT AGREES WITH THE PAPER, so amplicon_bp
    107 is now measured rather than quoted. One drift observation to carry into the report rather than a correction: the reverse
    primer F3L-R396 sits one mismatch from the template in 40 of the 50 genomes, the template reading AACGATACTCCTCCTCGTTGGT
    against the primer''s GACGATACTCCTCCTCGTTGGT - a G/A difference at the primer''s 5''-terminal base, the position that
    costs least, so this is near-certainly still a working assay. The sequence is what the paper prints and is unchanged.'
