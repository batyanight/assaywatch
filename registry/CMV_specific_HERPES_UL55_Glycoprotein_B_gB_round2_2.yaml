  notes_curator: 'NEITHER PRIMER IS IN THE CITED PAPER, found 2026-10-05 by scripts/verify_oligos_against_paper.py against
    the PubMed Central full text of Prepens et al. 2007, exactly as for the sibling entry CMV_specific_HERPES_UL55_Glycoprotein_B_gB
    (4007-s/4007-as). Neither 4125-s (GCGGACTCGGTGATNTCNTGGGA) nor 4125-as (GCTGACGGGTTGATCTTGCTRAG) appears in that paper,
    nor the string "4125", nor any 10-base fragment of either sequence. Prepens numbers its own primers 2743-2762 and 3730-3731;
    4007 and 4125 are a different series, and the two pairs are presumably round 1 and round 2 of one nested assay from whatever
    paper that is. Also note this entry is marked nested_round round2 while no entry holds a matching round 1 for the 4125
    series, so the pair it was meant to nest inside is missing as well as unattributed. NOT DELETED and NOT RE-CITED; oligos_designed_here
    set to false, which holds whatever the true source is. To resolve, find the paper printing the 4007 and 4125 primers -
    the Ehlers-lab primate cytomegalovirus papers are the place to start - and re-cite both entries together. AMPLICON MEASURED
    2026-10-05 against all 12,782 records in the 2026-10-03 Cytomegalovirus archive (up to 5 mismatches per primer): a product
    in 585 records, 599 bp in 347, 593 in 111, 596 in 107, all human CMV. The stored 550 matches none of them and is 8% short
    of the mode. amplicon_bp set to the measured 599, flagged so the source paper, once found, is checked for which number
    it prints. SOURCE FOUND AND RE-CITED 2026-10-05. A Europe PMC full-text search on each primer sequence returns exactly
    one paper for all four of 4007s, 4007as, 4125s and 4125as: Deckers M, Hofmann J, Kreuzer KA, Reinhard H, Edubio A, Hengel
    H, Voigt S, Ehlers B (2009) Virol J 6:210, PMC2789067 - an Ehlers-lab paper, as guessed. Its Table 1, primer set CMV-gBp1,
    prints 4007s GGTGACGTGGTTGACAT(n/i)TC(n/i)CC and 4007as GCAATCGGTTTGTTGTA(n/i)AT(n/i)GC for round 1 (800 bp) and 4125s
    GCGGACTCGGTGAT(b/i)TC(n/i)TGGGA and 4125as GCTGACGGGTTGATCTTGCT(r/i)AG for round 2 (550 bp), sizes footnoted as approximate.
    Every stored base agrees; the (n/i), (b/i) and (r/i) positions are ''base or deoxyinosine'' and are stored as N under
    this registry''s inosine convention. The paper states it designed them: ''deg/dI primers were deduced from the gB/UL55
    gene of HCMV strain AD169 in a nested format (primer set CMV-gBp1; Table 1)''. Citation moved from Prepens 2007 to Deckers
    2009, design_year 2009, oligos_designed_here true; the spreadsheet''s attribution kept in as_written. The paper''s 550
    is one of its approximate sizes; the measured 599 stands. VERIFIER NOTE: 4125-as reports near:1 against Deckers 2009 and
    that is expected, not a discrepancy. The paper prints the position as (r/i), R or inosine; the verifier reads any (X/I)
    as N, the registry stores the R, and N against R counts as one edit. 4125-s, with (b/i) and (n/i), reads exact.'
