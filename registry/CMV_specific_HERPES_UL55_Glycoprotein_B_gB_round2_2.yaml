  notes_curator: 'NEITHER PRIMER IS IN THE CITED PAPER (Prepens et al. 2007), BUT THEIR SOURCE IS KNOWN: Deckers M et al. 2009, Virol J 6:210 (PMID 19941648, PMC2789067; DOI 10.1186/1743-422X-6-210 as returned by PubMed, NOT yet checked against Crossref, which was unreachable). Found missing from Prepens 2026-10-05 by scripts/verify_oligos_against_paper.py, exactly as for the sibling entry CMV_specific_HERPES_UL55_Glycoprotein_B_gB (4007-s/4007-as); source identified 2026-10-06 from the PubMed Central full text of Deckers 2009. Its Table 1 prints primer set CMV-gBp1 as a nested pair, and this entry is ROUND 2: 4125s GCGGACTCGGTGAT(b/i)TC(n/i)TGGGA and 4125as GCTGACGGGTTGATCTTGCT(r/i)AG, product 550 bp. The round 1 pair is 4007s/4007as, which IS in the registry, as CMV_specific_HERPES_UL55_Glycoprotein_B_gB, so nested_round round2 here has its partner. 4125-as matches the paper exactly and so does the stored 550. 4125-s differs at ONE position: position 15 is printed (b/i), B or inosine, and the stored sequence has N. N includes B, so the stored form is the more permissive of the two; it was left as the spreadsheet had it, to be set to the paper''s reading when this entry is re-cited. Prepens 2007 does not print either sequence: the string "4125" does not occur in it and no ACGT-only fragment of 8 or more bases of 4125-s occurs in its text in either orientation. 4125-as is the one qualification: its reverse complement shares an exact 11-base stretch (AAGATCAACCC) with Prepens'' RH-gB primer 2760s and is IUPAC-compatible over 17 bases with its CM-gB round 2 sense primer 2744s. That is two primers designed on the same conserved gB site, which is what designing against a conserved site produces; it is not evidence the primer is Prepens''. NOT RE-CITED YET and NOT DELETED, for the reason given on the 4007 entry: the Deckers DOI is not Crossref-verified, and check_citations.py checks DOIs against the committed Crossref cache. oligos_designed_here stays false, which is certain for Prepens. To resolve, re-cite both CMV-gBp1 entries to Deckers 2009 together once its DOI is verified.'
