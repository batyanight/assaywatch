  notes_curator: 'PUBLISHED, FOUND 2026-10-05. A Europe PMC full-text search on TSPoxPolF1 finds Vila AR et al. 2019 PLoS
    One 14:e0213667 (PMC6469779, huemul deer parapoxvirus), whose Table 1 prints this entry''s six oligos exactly as stored
    here - TSPoxPolF1 TATAGAGCGAGTACAGTCATCAAG, F2 GCGAGYACCTGCATCAAG, F3, F4, R1 and R2 with I where the registry has N -
    with the 192 bp amplicon, and cites them to McAloose et al. 2016 Dis Aquat Organ 119:17-36, a WCS paper with T. Seimon
    (the TS of the primer names) as an author. Vila also describes the design: consensus regions from an alignment of some
    20 chordopox and parapox species, short enough for FFPE tissue. So ''Developed at WCS-TC (unpublished)'' was true when
    the sheet was written and is no longer. Cited to McAloose 2016 as the first publication; the sequences are confirmed through
    Vila''s table, not McAloose''s own, because the int-res.com open-access PDF answers scripted requests with 401. Confirm
    against McAloose by eye. The sibling POXVIRUSES_dsDNA_Polymerase_short (DO_NOT_USE) holds the longer forms with GGNCC
    3'' tails, which Vila does not print. FLAG ADDED 2026-10-05 for consistency with Nipah_N_gene_2, which was traced the
    same way on the same day: this entry''s sequences were read from Vila 2019''s Table 1 and its citation taken from that
    table''s Reference column, not from McAloose 2016 itself, whose open-access PDF answers a scripted request with 401. The
    attribution is well supported - Vila names McAloose per primer set, and McAloose is a WCS paper with T. Seimon, the TS
    of the primer names, among its authors - but it is second-hand, and the flag makes that visible rather than implied.'
