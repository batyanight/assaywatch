  notes_curator: "None SIZE READ AND SETTLED 2026-11-10 (ROADMAP, \"Sizes to read, from the verifier's table\"). One rule
    over all eleven entries on that list: amplicon_bp takes the measured modal product length where one mode holds a clear
    majority, and the measured median where none does, with amplicon_multimodal in the second case; the flag says whether
    the CITED paper publishes a size (amplicon_disagrees_with_paper) or does not (amplicon_measured_not_published); and a
    value is only moved where the new +/-25% window still admits every product measured, so a correction cannot silently delete
    calls. Measured on the 2026-11-01 calls. Garner: 350 -> 391, the mode, with the median at 394 one of a tight cluster.
    New window 293-489 bp admits every product measured (341-424)."
