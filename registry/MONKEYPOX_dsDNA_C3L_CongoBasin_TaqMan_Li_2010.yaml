  notes_curator: 'ADDED 2026-10-24 from the paper''s own Section 2 text (see the generic sibling for the quoted sentence and
    the transcription note). The paper''s claim for this assay is the CONGO BASIN clade, now clade I, not the species. THE
    PAPER GIVES NO PRODUCT SIZE. MEASURED 2026-10-24 against the existing taxid 10244 archive, 13,179 records of genome length
    (>=50 kb), of which 13,131 are near-complete (>=180 kb). Products were counted on BOTH strands: this locus sits in the
    inverted terminal repeat, so a first pass that scanned the plus strand only found zero C3L products and undercounted G2R_G
    by a third. C3L gives a product in 1,047 genomes, 100 bp in 1,045 of them and 94 bp in 2. READ THE LOW DETECTION RATE
    AS THE ASSAY WORKING, NOT FAILING. C3L is exact in about 8% of the archive - forward 1,057, reverse 1,052, probe 1,054
    of 13,179 - and the three numbers agreeing to within five records is the signature of a locus that is either wholly present
    or wholly absent, not of drift. That is what the paper says should happen: it chose this gene BECAUSE "all known MPXV
    West African strains delete C3L", so a negative on a clade II genome is the assay''s designed behaviour. Measured on the
    same records, every genome that carries C3L gives the 82 bp form of the sibling G2R_WA product, and the 9,654 genomes
    giving the 85 bp form carry no C3L at all. SCOPE IS NOT NEEDED HERE, AND THE WARNING THIS ENTRY FIRST CARRIED WAS WRONG.
    SCREENED 2026-10-24 with the project''s own scorer (python -m assaywatch.screen) over all 13,757 records of the
    10244 archive. Exact-match counting, which is what the paragraph above uses, is not the scoring model: it cannot
    see a tolerated mismatch and it says nothing about whether a record is EVALUABLE. The first version of this note
    predicted "a permanent ~92% non-detection". It does not happen. The screen reads 1,060 evaluable records and
    99.3% detection (1,053 detect, 7 fail, 2 indeterminate). The 12,695 clade II records do not fail: 12,680 are
    `no_site` and leave the denominator before any verdict, because the C3L gene is ABSENT rather than mismatched -
    precisely the design reasoning the paper gives. EVALUABLE is (detect, reduced, fail), so a gene that is not there
    is silent, not negative. The assay reads as the healthy clade-I-specific assay it is, with no scope_taxids and no
    new mechanism.
    THE SCOPE PROBLEM IS REAL BUT IT BELONGS TO THE SIBLING. MONKEYPOX_dsDNA_G2R_WestAfrican_TaqMan_Li_2010 is the
    entry whose out-of-target records ARE evaluable, because its primers amplify clade I while its probe does not
    bind: 2,688 of its 12,396 evaluable records are clade-I failures. See that entry.
    NCBI HAS NO CLADE NODE, checked exhaustively on 2026-10-24 and recorded so it is not reopened: the species node
    is now 3431483 Orthopoxvirus monkeypox, which holds 10244 at rank `isolate`, and its whole subtree is four nodes
    - 10244, 243803 Callithrix jacchus orthopoxvirus, 619591 Monkeypox virus Zaire-96-I-16 and the species itself.
    Every record in the archive carries the bare 10244. No clade taxon exists to scope to; this entry does not need
    one. status: draft
    and doi_verified: false on entry; only a maintainer sets active.
    ACTIVATED 2026-10-24: the maintainer set status active. The screen reads 99.3% on 1,060 evaluable records with no
    scope_taxids needed; the 12,695 clade II genomes are no_site (C3L absent) and never enter the denominator. Both
    remaining flags (amplicon_measured_not_published, scope_narrower_than_taxid) are recorded caveats, not open
    questions, so the active gate accepts the entry. This takes active from 178 (after the Reid_1999 demotion) back to 179.'
