  notes_curator: 'Added 2026-10-19 from candidate oligo extraction (papers/10.1016_s0166-0934_01_00306-8.pdf).
    Alpha1+ and Alpha1- are the outer (round 1) primers of the nested RT-PCR described
    by Sánchez-Seco et al. 2001. Round 2 (Alpha2+/Alpha2-) is already in the registry
    as ALPHAVIRUSES_Togaviridae_ssRNA_NSP4_gene_round2. Inosine (I) in the published
    sequences has been replaced with N in the seq field per registry convention; the
    original notation is preserved in seq_as_written. AMPLICON_BP: not set; the paper
    gives genome positions (Alpha1+ 6137-6172, Alpha1- 6509-6485 on Sindbis) suggesting
    ~373 bp, but this needs measurement against GenBank records.'
