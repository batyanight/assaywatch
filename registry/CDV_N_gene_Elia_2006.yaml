  notes_curator: 'Added 2026-10-06. SECOND-HAND: Elia et al. 2006 is not in papers/ and neither citing paper prints its DOI,
    so the oligos were read from two papers that cite it and agree with each other base for base: Table 1 of Halecker et al.
    2021 (10.3390/v13081632, ''ELIA-Mix'', reference Elia et al. 2006; table rendered at 220 dpi and read by eye) and the
    Methods of Brown et al. 2020 (10.1371/journal.pone.0232044, used at the Vienna lab, ref 22 = Elia). Roles: CDV-F forward,
    CDV-R reverse, CDV-Pb probe (FAM, TAMRA in both papers). The reference string is built from the reference lists of those
    two papers; the DOI was first left null and then found by a Crossref title search (2026-10-06, see needs_review), and
    oligos_designed_here is null because Elia''s own table was not read (Halecker''s reference column attributes the set to
    Elia without ''modified''). AMPLICON DISAGREES WITH THE PAPERS: both citing papers give 87 bp. Measured, the product is
    83 bp in all 663 records that yield one (no second mode), and on MN267060.1 the sites are forward 905-931, probe 934-963
    (minus strand), reverse 965-987, i.e. 83 bp. The measurement wins; the 4 bp gap is uniform across lineages, so it is the
    stated size, not an indel, that is off, or the Elia primers differ by 4 nt from what Halecker and Brown print; only Elia''s
    own table can settle which. Retrieval: the archive is every GenBank nuccore record under txid11232 (Morbillivirus canis;
    4,063 records on 2026-10-06), fetched whole rather than strided because the total is small. ''Spanning'' below means the
    record holds the whole primer-to-primer window, judged by the screen producing a product or, for records with none, by
    a BLAST of the MN267060.1 window covering both ends. MEASURED: 664 records span the window; 663 give an 83 bp product
    with the probe present: 341 detect, 206 reduced, 116 fail, so 51.4% detect and 82.5% detect+reduced among products (the
    last spanning record is truncated). No single constant mismatch column that would indicate a transcription typo: the commonest
    is reverse-primer position 11 (A in the primer; G in 446 of 663 records, A in 213), a third-codon-type polymorphism, then
    forward positions 14 and 25, reverse position 5 and probe position 5, each in 12-16% of records. The RefSeq genome NC_001921.1
    itself calls fail, with two mismatches in each primer. Halecker 2021 report drawbacks for this assay (weak PDV exclusivity,
    large Cq discrepancies for a few isolates), which fits this much primer-site variation. Of 116 PDV records (txid3052347)
    13 contain a product and all 13 fail (penalty 12.5+), whereas Halecker report 2 of 4 PDV samples positive, so the in-silico
    PDV exclusivity is better than their wet-lab result. The other 3,400 CDV records give no_amplicon: 3,384 carry no primer
    site (records not covering the N-gene site) and 16 are truncated. SCOPE: CDV-wide N-gene assay, used as the reference
    method in Halecker 2021 and in two diagnostic laboratories in Brown 2020.'
