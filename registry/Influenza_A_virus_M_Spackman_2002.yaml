  notes_curator: 'OLIGOS MODIFIED, AND THE PAPER THEY COME FROM: the forward and reverse are modified from what the cited
    paper prints, and that modified form is published by Lindsay et al. 2013 (Viruses), doi 10.3390/v5081964. Each oligo''s
    modified_from holds the cited paper''s own printed sequence. CHECKED against Spackman et al. 2002 on 2026-10-05 (doi:10.1128/JCM.40.9.3256-3260.2002).
    The entry was already flagged MODIFIED_IN_HOUSE; the modifications are now characterised, and they are much larger than
    the flag suggests.\n  forward  paper AGATGAGTCTTCTAACCGAGGTCG / stored ARATGAGTCTTCTRACCGAGGTCG\n           2 changes:
    pos2 G->R, pos14 A->R\n  reverse  paper TGCAAAAACATCTTCAAGTCTCTG / stored TGAAAAGACATCYTCAAGYYTCTG\n           5 changes:
    pos3 C->A, pos7 A->G, pos13 T->Y, pos19 T->Y, pos20 C->Y\n  probe    unchanged - matches the paper exactly (it is printed
    there between FAM and TAMRA).\nThe forward changes only widen degeneracy, but the reverse carries two fixed-base SUBSTITUTIONS
    (C->A, A->G) alongside three widenings, which is a redesign rather than a relaxation. So the stored reverse is not Spackman''s
    primer in any useful sense and the checker reports it as absent from the paper. oligos_designed_here is False. That is
    context a reader needs before trusting either, and it is an argument for the hemagglutinin assay gap noted in docs/journal/2026-10-04-literature-audit.md,
    since a matrix assay cannot see subtype at all.'
