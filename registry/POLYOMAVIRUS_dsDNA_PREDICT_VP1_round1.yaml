  notes_curator: 'PREDICT panel protocol P-040 (VP1), confirmed 2026-10-04 by exact match of every oligo to that protocol''s round 1 primers in the Anthony et al. 2015 supplement (Nat Commun 6:8147, CC-BY). Primer source per the panel: Johne, R (2005). SCOPED 2026-10-24 by copying the scope_taxids list of its sibling POLYOMAVIRUS_dsDNA_VP1_Johne_2005, 424 taxids. The two entries share target.taxid, target.query and citation.doi and are rounds of one protocol, so a record that is out of scope for one is out of scope for the other. Having the list on only one sibling made the two rounds not comparable: they were scored against different denominators. No paper was needed for this, and no judgement is made here about whether the list itself is right. MEASURED EFFECT, and it is small: over the whole 2026-10-24 calls table the list excludes 5 of the 14,537 records retrieved for this group, so the change buys comparability between the rounds rather than a different coverage figure. These enumerated lists are near-complete, which is why they exclude so little. AMPLICON RANGE DECLARED 2026-10-26 FROM THE DESIGN PAPER, superseding a same-day decision not to declare one. The first pass measured only this entry''s own detects - 12,462 no_amplicon, 2,070 fail, 5 reduced and ZERO detect, the five products 902, 902, 903, 903 and 991 bp - and declined to declare on five records. That was the right call on that evidence and the wrong question: the cited design paper PUBLISHES a round 1 product length and nobody had looked. Table 1 of papers/10.1128_JVI.79.6.3883-3887.2005.pdf gives 829-1137 bp for the VP1 1st PCR, and the five measured products sit inside it, so measurement and publication agree and amplicon_bp_range is [829, 1137]. Note the asymmetry this fixes: the sibling round 2 has carried its 249-273 bp since entry and round 1 never did. NEEDS A RESCREEN TO TAKE EFFECT. THREE EXPLANATIONS FOR THE ZERO DETECTS WERE RULED OUT, recorded so nobody re-chases them. (1) NOT AN OLIGO TYPO. The design paper''s Table 1, the Anthony 2015 PREDICT supplement and this registry all print VP1-1r as AACAAGAGACACAAATNTTTCCNCC, byte-identical, three independent sources. VP1-lf agrees the same way. (2) NOT THE MISSING SIZE. Declaring 829-1137 excludes only 75 of this entry''s 2,075 sized products, 3.6 percent; 96.4 percent were already inside it. So the range is worth declaring and it does not explain anything. (3) NOT AN INDEL ARTEFACT, though an indel is visible: 18 of 21 sampled indel hits share one signature, the template reading AACAAAAGA where the primer reads AACAAGAG - one extra base 18 nt from the reverse 3'' end plus a G->A at 20 - and since the primer is confirmed correct that is genuine template divergence, not an error. It covers about 7 percent of the failures. WHAT IS LEFT IS THE HONEST READING: a 2005 consensus pair designed against an alignment of ten genomes finds correctly-sized products on 1,995 records and mismatches badly on every one, while its own round 2 detects 255. STATUS LEFT ACTIVE, 2026-10-26, as a maintainer decision. The entry is doing its job - reporting that a pan-family consensus assay detects almost nothing today is the kind of finding this tool exists to make - and drift.require_working_baseline already stops it being called `declining` without an earlier working year, so it reads as low coverage rather than as drift.'
