  notes_curator: 'Added 2026-10-06 from the paper''s own Table 2 (papers/10.1128_jcm.02505-21.pdf). The table page was rendered
    at 220 dpi and read by eye as well as extracted as text; the two agree base for base. ROLES: panCDV-F (no wobble) is the
    assay''s forward primer and panCDV-PDV-F (R at position 7) is the variant made to also cover phocine distemper virus;
    the paper found no Cq difference between them, so the second is stored as an alternate (screening gives identical results
    with either alone). panCDV-PDV-R is the reverse primer. panCDV-PDV-probe (FAM, BHQ1, Y at position 4) is the probe, written
    reverse-sense in the paper. The paper designed all of these (94 CDV and PDV genome sequences aligned in MEGA7/MAFFT).
    EXCLUDED: EGFP-1-F, EGFP-2-R and EGFP-HEX (heterologous EGFP internal control from Hoffmann 2006, not a CDV target; note
    this paper''s EGFP-1-F is 17 nt GACCACTACCAGAACAC against 20 nt GACCACTACCAGCAGAACAC in the Halecker 2021 table, probably
    a typo here, irrelevant because it is excluded); the CDV-Th and CDV-S443 H-gene ORF primers in Methods (restriction-site
    tailed cloning primers used to sequence strains, not a detection assay); and CDV4.1-F/CDV3-R/CD3.1-FAMas and CDV-1808-F/CDV-1903-R/CDV-1842-FAM,
    which the paper uses as comparators and which are Halecker et al. 2021 assays, entered as CDV_P_gene_Mix3_Halecker_2021
    and CDV_P_gene_Mix7_Halecker_2021. VERIFIED against the paper''s design accession MN267060.1 (strain S460/15, Europe-1,
    complete genome): forward site at 2149-2169, probe at 2267-2286 (minus strand), reverse site at 2290-2308, exactly as
    the text states, giving the stated 160 bp. Retrieval: the archive is every GenBank nuccore record under txid11232 (Morbillivirus
    canis; 4,063 records on 2026-10-06), fetched whole rather than strided because the total is small. ''Spanning'' below
    means the record holds the whole primer-to-primer window, judged by the screen producing a product or, for records with
    none, by a BLAST of the MN267060.1 window covering both ends. MEASURED: 398 records span the amplicon and all 398 give
    exactly 160 bp with the probe site present (unimodal): 387 detect, 8 reduced, 3 fail, so 97.2% detect and 99.2% detect+reduced
    among spanning records; 299 of the 398 are complete or partial genomes. The other 3,665 give no_amplicon: 3,430 carry
    no primer site at all (H, F, N, M, L gene records that do not cover the P region), 231 are truncated, and 184 of the truncated
    ones are P-gene fragments that begin 4 nt inside the forward primer site (deposited primer-trimmed), so the site cannot
    be tested; 4 are labelled diverged (three H or N-gene records without the P region, and MT932497.1, a near-complete genome
    with a run of Ns across the reverse site, so untestable). That is coverage, not primer failure. amplicon_bp 160 is both
    the paper''s figure and the measured one. CROSS-CHECKS against the paper''s own claims: the Asia-4 Thai genomes MH496772-MH496775
    match this assay at penalty 0-0.5, while on MH496772-MH496774 CDV-Mix 3 (forward, probe) and CDV-Mix 7 (reverse, probe)
    carry mismatches and fail or are reduced, which is the paper''s stated reason for adding Asia-4. Screening 116 Phocine
    morbillivirus records (txid3052347, a separate taxon, not in this entry''s archive): 59 span the amplicon and all 59 detect
    at 160 bp with the probe, matching the paper''s PDV claim. SCOPE: taxid is CDV only; the assay is designed to detect PDV
    as well, which the CDV archive does not measure. America-3, America-5 and Asia-3 have no P-gene sequence in GenBank to
    test (the paper says so too). Sensitivity (LOD) figures are the paper''s and were not checked here.'
