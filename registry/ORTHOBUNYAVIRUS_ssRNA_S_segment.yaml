  notes_curator: 'Imported 2026-10-04 from the PREDICT panel''s own protocol sheet (Anthony et al. 2015, Nat Commun 6:8147, Supplementary Methods, CC-BY); sequences read from that document, not transcribed from a secondary list. Single round. The panel notes the source paper gives primer sets for all three segments and recommends screening with at least two; the M-segment assay is P-023. Not assessable as entered: all three terminal primers (BUNS-5-U-6, BUNS-3-L947, BUN-S3-R) appear to carry a non-templated 5'' cloning tail, so 0 of 2056 orthobunyavirus records yield an amplicon. Evidence (2026-10-04): the conserved terminus is present in only 4% of deposits, and even in records that carry it the full primer finds no site within 6 mismatches, while dropping CGGCGCC from BUNS-5-U-6 matches perfectly (0 mismatches in 6 of 6 records) and dropping GCGGCC from BUNS-3-L947 leaves 1. GGCGCC is a KasI/NarI site. The tail boundary is inferred from sequence data, not read from Briese et al. 2007 (paywalled), so the sequences are left exactly as the PREDICT panel prints them and tail_5prime is NOT set; set it once the paper confirms the boundaries. BUN-S3-R is the awkward one: the inferred binding part is 14 nt, under the registry''s 15 nt minimum. M3560-F shows no tail.'
