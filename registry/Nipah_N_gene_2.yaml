  notes_curator: 'TAXON RENAMED: NCBI now calls txid121791 ''Henipavirus nipahense''; this entry carried the superseded name
    ''Nipah henipavirus''. Checked 2026-10-05 during the repo-wide audit. The taxid is unchanged and is what retrieval uses,
    so nothing about the screening changes - but a report naming the old taxon would not match what GenBank now says. SOURCE
    TRACED 2026-10-05, from ''PREDICT protocol'' and no DOI at all. A Europe PMC full-text search on both sequences returns
    one paper, Wong KT et al. 2003 (Am J Pathol 163:2127, PMC1892425), whose Table 1 ''Nipah Virus Nucleoprotein Gene Specific
    Primers and RT-PCR Conditions'' prints 5''-CTGCTGCAGTTCAGGAAACATCAG-3'' and 5''-ACCGGATGTGCTCACAGAACTG-3'', matching this
    entry base for base. Wong is NOT the designer and says so - ''Previously published, specific primers used, 1'' - and its
    reference 1 is Chua KB et al. 2000 Science 288:1432, the paper that named the virus. Cited to Chua 2000, Crossref-verified
    as to author, year and title. READ THE CAVEAT: Chua 2000 itself has not been read, because Science is closed access here,
    so the attribution rests on Wong''s citation of it rather than on seeing the primers in Chua''s own text. That is the
    same footing as the POXVIRUSES_dsDNA_Polymerase_short_2 entry, which takes McAloose 2016 from Vila 2019''s table, and
    both now carry SEQUENCES_READ_FROM_A_CITING_PAPER_NOT_THE_SOURCE so the distinction is visible rather than implied. Confirm
    against Chua''s own methods when that paper is in hand. AMPLICON CONFIRMED, NOT CHANGED: measured against all 426 records
    of the 2026-10-03 Henipavirus nipahense archive, the pair gives a product in 292 and it is 227 bp in every single one
    - exactly the stored value, which until now rested on the spreadsheet alone. A DRIFT FINDING: the forward primer is exact
    in only 56 of those 292 and sits 2 mismatches away in 231; the reverse is exact in 54 and 2 mismatches away in 190. So
    roughly four fifths of deposited Nipah carries two mismatches under each primer while the product length has not moved
    at all. The deposit titles do not separate the two groups - NCBI has renamed the species, so ''Nipah virus'' and ''Henipavirus
    nipahense'' both appear in each - and attributing the split to the Malaysia-versus-Bangladesh lineage divide would need
    the sequences aligned, which has not been done here. The numbers are recorded; the cause is not claimed.'
