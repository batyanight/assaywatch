  notes_curator: 'AMPLICON RANGE DECLARED 2026-10-21. Carried no declared size, so it was screened against the global 50-3000 bp window. The polar tube protein gene is a tandem-repeat locus and Xiao 2001 exists to GENOTYPE E. cuniculi by its length, so the product is bimodal within the one target species: 285 bp (9 records) and 363 bp (8 records), measured from the 2026-10-21 run over 17 amplifying records. Declared as amplicon_bp_range [275, 373] (envelope 285-363 + 10 bp cushion each end; declared_tolerance adds +/-25% at screen time) with the two bands in species_sizes, the ORTHOPOXVIRUS ATI pattern of one taxid carrying several bands. Thin at 17 records but the bimodality is the assay''s designed readout, not noise. Needs a rescreen to take effect.'
needs_review:
