  notes_curator: 'BOTH PRIMERS VERIFY EXACT against Prepens et al. 2007, confirmed 2026-10-05: they are that paper''s CM-gB round 1 pair, 2743s and 2746as. Reading them needed a fix to scripts/verify_oligos_against_paper.py - the paper spells its ambiguous positions out as the literal string (N/I), "N or inosine", so 2743s is printed CGCAAATCGCAGA(N/I)KC(N/I)TGGTG, and until the notation was normalised both primers reported absent. The registry''s N at those positions is the correct reading. THE AMPLICON: the paper gives two different values for this round. Table 3 gives 330 bp, footnoted "approximate values"; the Figure 1 legend says "Amplimers of the first and the second PCR round are 320 bp and 250 bp, respectively" (it does not name the primer set, but 250 appears among Table 3''s product lengths only for CM-gB round 2, so it most plausibly describes this pair). The stored 320 therefore agrees with that figure, if as it appears the figure describes this pair, and differs from the table by 10; it is not evidence of a transcription slip. The round 2 sibling is the clean disagreement: it stores 230 where both the table and the figure say 250. The two offsets differ (-10 against the table, 0 against the figure for round 1; -20 for round 2), so there is no basis for calling them one seed-list error. NOT CHANGED, because this registry measures amplicons on real records and does not quote them, and no sequence database was reachable from this environment - and the precedent cuts against simply taking the paper''s word: the avipox entry measured an invariant 250 bp against a stated 234, and the measurement won. Run the pair against real cytomegalovirus UL55 records and store what it measures. Do not set this to 330 on the table''s word: the paper''s own figure says 320. MEASURED 2026-10-18: 319 bp invariant across 9 UL55 CDS records (OQ857188-OQ857272 series, plus PV662041 at 5mm total), 0 mismatches at best. Stored value updated 320 to 319. Paper figure (320) off by 1; paper table (330) off by 11.'
