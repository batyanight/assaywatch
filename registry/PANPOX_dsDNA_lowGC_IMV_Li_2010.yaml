  notes_curator: 'Added 2026-10-05 from the paper''s own Methods text, read out of the local PDF. Li 2010 publishes two universal
    PCRs rather than one, because Chordopoxvirinae splits into a low-GC group (around 25-35% GC: Orthopoxvirus, Capripoxvirus,
    Leporipoxvirus) and a high-GC group (around 62-64%: Parapoxvirus, Molluscipoxvirus, crocodilepox), and no single primer
    pair covers both. This entry is the low-GC assay; the high-GC one is PANPOX_dsDNA_highGC_RNApol_Li_2010. The forward primer
    sits in the insulin metalloproteinase-like protein gene and the reverse in the IMV membrane protein gene, so the product
    spans two adjacent genes. AMPLICON MEASURED, AND THE PAPER''S FIGURE IS APPROXIMATE: the text says ''about 220 bp''; measured
    with assaywatch.match against all 28,387 records in the 2026-10-03 Chordopoxvirinae archive (up to 4 mismatches per primer)
    it gives a product in 13,734 of them and the size is 230 bp in 13,733 of those, 228 in one. amplicon_bp is the measured
    230. Both primers are near-invariant where they bind: forward exact in 13,321 and reverse in 13,727 of the 13,734. SCOPE,
    flagged rather than scored: the hits are monkeypox (11,906 - the archive is dominated by the 2022 outbreak), lumpy skin
    disease, myxoma, cowpox, variola and vaccinia, which is the low-GC half of the subfamily and exactly what the assay is
    for. Judged against all of Chordopoxvirinae it will look like 48% coverage; that is the design, not drift, and the same
    scoping decision the avipox entry is waiting on.'
