  notes_curator: 'Added 2026-10-05 from the paper''s own Methods text, read out of the local PDF. Li 2010 publishes two universal
    PCRs rather than one, because Chordopoxvirinae splits into a low-GC group (around 25-35% GC: Orthopoxvirus, Capripoxvirus,
    Leporipoxvirus) and a high-GC group (around 62-64%: Parapoxvirus, Molluscipoxvirus, crocodilepox), and no single primer
    pair covers both. This entry is the low-GC assay; the high-GC one is PANPOX_dsDNA_highGC_RNApol_Li_2010. The forward primer
    sits in the insulin metalloproteinase-like protein gene and the reverse in the IMV membrane protein gene, so the product
    spans two adjacent genes. AMPLICON MEASURED, AND THE PAPER''S FIGURE IS APPROXIMATE: the text says ''about 220 bp''; measured
    with assaywatch.match against all 28,387 records in the 2026-10-03 Chordopoxvirinae archive (up to 4 mismatches per primer)
    it gives a product in 13,734 of them and the size is 230 bp in 13,733 of those, 228 in one. amplicon_bp is the measured
    230. Both primers are near-invariant where they bind: forward exact in 13,321 and reverse in 13,727 of the 13,734. SCOPE,
    flagged rather than scored: the hits are monkeypox (11,906 - the archive is dominated by the 2022 outbreak), lumpy skin
    disease, myxoma, cowpox, variola and vaccinia, which is the low-GC half of the subfamily and exactly what the assay is
    for. Judged against all of Chordopoxvirinae it will look like 48% coverage; that is the design, not drift, and the same
    scoping decision the avipox entry is waiting on. DENOMINATOR SCOPED 2026-10-17, FROM MEASURED GC AND NOT FROM MEMORY.
    The pair partitions Chordopoxvirinae by GC content, so a share against the whole subfamily was never this assay''s coverage
    - it was the design. NCBI lists 18 genera in the subfamily (an earlier hand-written list had 11 and would have silently
    dropped 494 records). One record of 100-400 kb was fetched per genus and its GC computed: Sciuripoxvirus 66.7%, Parapoxvirus
    64.4%, Molluscipoxvirus 63.5%, Crocodylidpoxvirus 61.9% | Macropopoxvirus 53.9% | Leporipoxvirus 43.2% | Salmonpoxvirus
    37.4%, Pteropopoxvirus 33.8%, Orthopoxvirus 33.0%, Mustelpoxvirus 31.3%, Avipoxvirus 30.8%, Centapoxvirus 29.5%, Suipoxvirus
    27.4%, Yatapoxvirus 27.0%, Cervidpoxvirus 26.8%, Capripoxvirus 25.9%, Oryzopoxvirus 23.6%, Vespertilionpoxvirus 23.5%.
    That reproduces the paper''s stated ~25-64% span and falls into two clusters with a clear gap. HIGH-GC = the four genera
    above 60%, which contains the three the earlier screen actually hit (Parapoxvirus, Molluscipoxvirus, crocodilepox) plus
    Sciuripoxvirus, which sits in the same band and simply had no record in that measurement. LOW-GC = the twelve below 40%.
    LEPORIPOXVIRUS (43.2%) AND MACROPOPOXVIRUS (53.9%) ARE IN NEITHER QUERY, 783 records: Li 2010 does not say where the crossover
    between its two pairs sits, and putting them in one denominator could hide a real failure while putting them in the other
    could invent one. They are excluded and flagged rather than assigned. THIS CHANGES RETRIEVAL, so this entry''s archive
    and calls are stale until the group is re-retrieved and rescreened. RETRIEVAL_STALE CLEARED 2026-10-31. The flag said
    the numbers predated the 2026-10-17 query change. They no longer do: this group''s archive has been re-fetched under the
    current query and holds deposits through 2026-10-27, and the verdict on this page comes from the 2026-10-31 run over that
    archive. The flag was self-dating and its condition is now false, so it is removed rather than carried.'
