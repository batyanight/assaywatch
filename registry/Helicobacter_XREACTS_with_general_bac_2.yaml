  notes_curator: 'Detects to 1:10,000 dilution of blue iguana positive control (spreadsheet) PUBLISHED, FOUND 2026-10-05 by
    a Europe PMC full-text search on the primer sequences. Conley et al. 2021 (PMC7894872) prints all three oligos exactly
    as stored - GCBI-Helico-F, GCBI-Helico-R and a 6FAM/MGBNFQ TaqMan probe - and states ''we developed a Taqman qPCR assay
    specific for Helicobacter sp. Grand Cayman Blue Iguana 1 (GCBI1)'', with a 194 bp product, matching the stored amplicon_bp
    and the sheet''s blue iguana positive control. SCOPE NOTE: the paper designs this for one provisional Helicobacter species,
    the probe sitting on a 14 bp insertion unique to it, while target is the whole genus Helicobacter (taxid 209). Judged
    against the genus it will look like poor coverage, and that is a scope mismatch, not drift. The sheet''s ''XREACTS with
    general bac'' is lab experience the paper does not report.'
