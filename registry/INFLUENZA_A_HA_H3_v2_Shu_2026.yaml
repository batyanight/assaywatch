source:
  nested_round: null
  notes_curator: 'ENTERED 2026-10-30 beside INFLUENZA_A_HA_H3_CDC_Shu_2026, which is the assay this one replaces. This is
    the documented FIX: the registry holds the redesign next to the assay that decayed, the same arrangement as Ward 2004
    and Yang 2014 on the matrix gene.

    THE REVERSE PRIMER IS NOT A MODIFICATION OF THE OLD ONE, IT IS A NEW PRIMER AT A NEW SITE, which is the whole point of
    the redesign and the reason it carries no modified_from. The original reverse sat at nucleotides 1052-1030 and accumulated
    the mismatches that cost it sensitivity; v2''s sits at 1008-988, "a more highly conserved area of the HA gene segment
    closer to the probe" in the paper''s words. The forward primer and the probe ARE modifications of their predecessors and
    say so: the forward gains one degenerate base (pos10 C->Y) and the probe gains two and loses one (pos13 T->Y, pos17 S->G,
    pos19 C->M), both to cover mixed bases the paper found in circulating viruses.

    Moving the reverse primer shortens the product, which is why this entry''s amplicon is not its predecessor''s: Table 1''s
    positions give 906-1008 against 906-1052.

    Both probes in Table 1 carry the same 27 bases and differ only in quencher chemistry, a BHQnova and a ZEN version. The
    ZEN one is stored, because the paper''s specificity evaluation used it.

    Conditions as for the v1 entry: 0.8 uM primers, 0.8 uM probe and 55 C annealing are the paper''s own comparison runs.
    This assay has no 510(k) of its own yet, so unlike its predecessor there is no cleared protocol it is being held short
    of.


    AMPLICON MEASURED AT 103 bp, over 3000 H3N2 HA records fetched 2026-10-30 for this purpose: both primers bind within 2
    mismatches in 2963 of them, every one of those gives 103 bp with no second mode, and the probe binds in 2763. The paper
    prints no product size, only nucleotide positions, so this is a measurement that CONFIRMS a claim rather than one that
    corrects it: nucleotide positions 906-1008 in Table 1 imply 103, and they agree. The reverse primer''s sites were all
    on the minus strand, which independently confirms the printed orientation is the functional one.


    DOI VERIFIED BY CROSSREF 2026-10-30. This entry passes where its predecessor cannot: its design_year IS the citing paper''s
    year, because Shu 2026 designed it. The blocker recorded in INFLUENZA_A_HA_H3_CDC_Shu_2026 is specific to citing a paper
    that did not design the assay.

    THE CURATE `amplify` FAILURE IS THE SAME ARCHIVE ARTIFACT as its predecessor''s: this group (q2fad34153e) has never been
    fetched, so curate fell back to the segment 7 matrix archive and H3 hemagglutinin oligos found nothing in it. Measured
    on 3,000 real H3N2 HA records instead: both primers within 2 mismatches in 2,963, product 103 bp in every one, probe in
    2,763. For what it is worth as a sanity check and not as a result, that is 23 more records with both primers and 71 more
    with the probe than the v1 oligos reach on the same 3,000, which is the direction the redesign claims.


    THE PROBE CANNOT BE VERIFIED BY printed.py, FOR A NOTATION REASON WORTH KNOWING. Both primers read `exact` against the
    held PDF, and both probes read `absent`. That is not a transcription doubt: Table 1 writes the internal quencher INSIDE
    the sequence ("CAG GAT CAC /ZEN/ATA TGG GSC CTG TCC CAG"), so printed_oligos never sees the 27 bases as one run -- it
    finds the 18-base tail after the marker and loses the 9-base head below its minimum length. The bases are in the paper
    and were read from it; the scanner cannot assemble them. This will recur: double- quenched probes (ZEN, BHQnova, LNA)
    all print this way, and the limitation is recorded in ROADMAP.md under Method debts.

    SCOPE: the same seven H3Nx subtype taxids and the same limitation as the v1 entry.

    CROSSREF AGREED 2026-10-30, AND doi_verified IS HELD FALSE ANYWAY, DELIBERATELY. `assaywatch curate` resolved this DOI
    and matched it to the entry (Shu 2026, "Update to the CDC influenza A(H3) subtyping assay for improved detection") and
    wrote doi_verified: true. It was then set back to false by hand, because "live" in this repository means a verified DOI
    and nothing else: registry.not_live_because looks at the DOI alone and ignores status, so an entry in pending/ carrying
    a verified DOI reads as LIVE while sitting in the directory for things that are not, and tests/test_schema.py::test_nothing_in_pending_is_live_and_nothing_in_registry_is_pending
    fails on exactly that. The maintainer asked for these entries to wait in pending/ for sign-off, and that is incompatible
    with the flag being true, so the flag waits too. No information is lost: the resolution is recorded here and `assaywatch
    curate` re-sets the flag in one command at promotion. '
