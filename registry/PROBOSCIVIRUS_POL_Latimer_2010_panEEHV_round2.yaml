  notes_curator: 'Added 2026-10-06 from Latimer et al. (papers/10.1016_j.vetmic.2010.05.042.pdf). Oligos read from Table 2,
    a text table printed sideways on page 24; sequences, L/R labels and pairing columns were checked by eye on a 220 dpi rendering
    of that page (pymupdf) and agree with the extracted text for every oligo used here. Table 2 lists 21 rows but 19 distinct
    oligos (6784 and 6785 each appear in two blocks). Designed in this paper (Methods: six new sets of EEHV DNA POL primers
    designed for these studies). Not designed here, not in Table 2, not entered: the CODEHOPS pan-herpes set 2595/2596/2597
    and the EEHV3 TER set 6707/6708/6727/6728, both credited to Garner et al. 2009. ORIENTATION was established by locating
    each oligo on GenBank records, not by trusting the table''s L/R column: in the EEHV blocks L is sense and R is antisense
    (as labelled), but in the PAN-EGHV block the labels are inverted (see the note on what was not entered). This entry =
    6712 (PAN-EBP B2, sense) + 6710 (PAN-EBP A1, antisense), Table 2 column 2A, the second (nested) round of the pan-EEHV
    set; its sites lie inside the round-1 6711/6710 product (checked on reference-genome coordinates: 6712 starts 297 nt after
    6711 starts on the EEHV1A genome). HOW MEASURED. Every record the target.query returns was screened (all of them, not
    a sample; retrieved 2026-10-06 with NCBI esearch/efetch, min length 100 bp as in config.yaml) with assaywatch.screen.
    Whether a record SPANS the amplicon was decided independently of the screener: each record was mapped with blastn to complete
    reference genome(s) of the target species, the primer-to-primer interval was taken from the screen of the reference genome,
    and a record counts as spanning when its alignment covers that whole interval, both primer sites included (4 nt end slack
    for BLAST end trimming). Most GenBank EEHV POL deposits are the sequence BETWEEN the amplification primers, so one or
    both primer sites are absent: those records give no_amplicon because the site is missing, not because the primer fails,
    and are excluded from the detected share. Spanning counts include RefSeq NC_ copies of GenBank genomes (NC_020474, NC_024696,
    NC_028379, NC_077039), so the number of independent sequences is a few lower. RESULT. 240 records retrieved; calls over
    all of them {''detect'': 20, ''no_amplicon'': 201, ''reduced'': 18, ''fail'': 1}. Spanning records: 39; calls among spanning
    {''detect'': 20, ''reduced'': 18, ''fail'': 1}; by species EEHV1 {''detect'': 20}; EEHV2 {''fail'': 1}; EEHV3 {''reduced'':
    3}; EEHV4 {''reduced'': 6}; EEHV5 {''reduced'': 7}; EEHV6 {''reduced'': 1}; EEHV7 {''reduced'': 1}. Product sizes among
    spanning records: 239 bp x33, 242 bp x6. SIZE. Table 2 prints 250 bp. Measured: 239 bp on EEHV1A, 1B, 2, 3, 5, 6 and 7
    records and 242 bp on EEHV4. The 250 is a nominal figure, 11 bp above the measured product; amplicon_bp is the modal measurement,
    239. The paper''s own EEHV1A accessions GU350750/GU350752 (491 bp) carry the 6712 site (0 mismatches, 272-297) but not
    6710, which lies beyond the record end, so they cannot check the product length. CALLS. EEHV1A/1B detect cleanly; the
    other species are ''reduced'' (penalties around 0.5-3 per primer) and the single spanning EEHV2 record (genome MZ822421)
    is ''fail'' (6712 penalty 3 there). The paper reports this round detecting EEHV1-6 samples in the lab, so ''reduced''
    is consistent with what was seen at the bench; the tool''s thresholds are not calibrated to degenerate consensus primers.
    SCOPE. Whole genus Proboscivirus (taxid 548689). Note 6712 also amplified two elephant GAMMAherpesviruses (EGHV3A, EGHV5)
    in the lab (250 bp second-round products), which the paper reports as an unintended result; gammaherpesvirus records are
    outside this entry''s retrieval. The PAN-EGHV/EGHV2/EGHV3 block of Table 2 (6784, 6785, 6786, 6787, 6788, 7486, 7489)
    was not entered; the reasons are in the note of the panEEHV_round1 entry.'
