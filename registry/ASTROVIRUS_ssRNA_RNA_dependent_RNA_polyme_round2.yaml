  notes_curator: 'MIXED DESIGN, found 2026-10-06: the same split as round 1 (see that entry). scripts/verify_oligos_against_paper.py
    reads Astr4380F and Astr4722R as exact against Atkins et al. 2009, and AstroFWD3 and AstroFWD4 as absent from it. They are
    not Atkins'' primers. Both sit on the site Atkins'' Astr4380F binds: aligned ungapped, each shares 17 bases with Astr4380F
    with at most 1 incompatible position (FWD3 none, FWD4 one), starting 9 nt downstream of it, where round 1''s AstroFWD1 and
    AstroFWD2 start 6 nt upstream. They look like the panel''s own variants of one forward primer, extending a few bases 3'' past
    Atkins''. What is NOT established: that P-001 prints them. The 2026-10-04 check against the Anthony et al. 2015 supplement is
    recorded for round 1 only, the supplement is not held locally (PubMed Central does not carry it), and this entry has no
    record of that check, so FWD3 and FWD4 rest on the seed-list row and predict_protocol P-001 alone. To settle it, read the
    P-001 round 2 primers in the Supplementary Methods. oligos_designed_here is false for the reason given on round 1: the
    citation names Atkins only, so the pool cross-product pairs Atkins'' primers with the panel''s, and some pairs scored here
    were never run by anyone. CORRECTED 2026-10-23: the AstroFWD3/AstroFWD4 alternates are not Atkins'' or PREDICT''s. P-001 in the Anthony 2015 supplement prints only Astr4380F, Astr4811R and Astr4722R, so the earlier claim that every oligo here matched P-001, and the reading of AstrRVS1 as PREDICT''s modification of Astr4811R, were both wrong. All of them are Chu et al. 2008 (J Virol, 10.1128/jvi.00857-08), printed verbatim in its Methods, and now have their own entry, ASTROVIRUS_RdRp_Chu_2008_round2. Removed from this entry, which is now Atkins'' Astr4380F/Astr4722R pair as printed.'
