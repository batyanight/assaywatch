  notes_curator: 'Imported 2026-10-04 from the PREDICT panel''s own protocol sheet (Anthony et al. 2015, Nat Commun 6:8147,
    Supplementary Methods, CC-BY); sequences read from that document. Hemi-nested: the reverse primer PVO3 is the same molecule
    as in round 1. Modified from Bourhy et al. 2005. SCOPED 2026-10-20 to the animal rhabdoviruses, from Bourhy et al. 2005''s
    own words: the primers were predicted from a ten-sequence L alignment to be "broadly reactive among the animal rhabdoviruses",
    and PVO3/PVO4 "produced PCR products for 38 animal rhabdoviruses, 20 of which are not currently assigned to a particular
    genus". Every isolate amplified in that study carries an AY854xxx accession generated there, while its Table 1 plant entries
    (Nucleorhabdovirus RYSV/SYNV/MMV, Cytorhabdovirus NCMV/SCV/TaasV) all carry pre-existing accessions, so no plant rhabdovirus
    was amplified. scope_taxids is therefore Rhabdoviridae minus the plant subfamily: 2842407 Alpharhabdovirinae, 2842415
    Gammarhabdovirinae, 3152207 Deltarhabdovirinae, 35303 unclassified Rhabdoviridae. 35303 is in deliberately - it holds
    the novel rhabdoviruses PREDICT found with this very assay (Rhabdovirus PREDICT_RbdV-21, -27 among others) and 255 Rhabdoviridae
    sp. records, and an allow-list without it would exclude the assay''s own successes. Gammarhabdovirinae is in because fish
    rhabdoviruses are animal rhabdoviruses, although Bourhy demonstrated no amplification of one and named IHNV as the single
    virus for which his under-three-mismatch design criterion was waived; its 233 evaluable records sit at 0 percent detected,
    which is a lineage to watch rather than a reason to exclude it. MEASURED on the 2026-10-17 calls: 769 of 9,879 records
    go out of scope but only about 60 of them are in the recent window, so both rounds keep the same status and the same firing
    lineage (round1 declining, pooled 11.6 -> 11.7 percent; round2 declining, 25.1 -> 26.8 percent). The denominator now means
    what it says; it does not change a call. Rabies is NOT out of scope and that finding stands: PVO3''s coordinates are given
    on the Rabies virus PV genome, RV PV and SAB-B19 are two of the ten design sequences, and RABV 9911/PV/SADB19 were amplified
    in the paper (AY854660-662). PVOnstF SOURCE FOUND 2026-10-23, and it is not the cited paper. Bourhy et al. 2005 prints
    PVO3/PVO4 and PVO5/PVO6 and names no PVOnstF, so the stored sequence reads `absent` against it. It is printed in Table
    1 of Wray, A.K. et al. 2016, EcoHealth (10.1007/s10393-016-1183-z, PMC5164864), paired with PVO3 as the same hemi-nested
    rhabdovirus assay this entry stores - and that table''s own citation column for the pair reads "Unpublished". So the nested
    forward has no publication that designed it, only one that printed it, and no further reading will produce a design source.
    SIZE READ AND SETTLED 2026-11-10 (ROADMAP, "Sizes to read, from the verifier''s table"). One rule over all eleven entries
    on that list: amplicon_bp takes the measured modal product length where one mode holds a clear majority, and the measured
    median where none does, with amplicon_multimodal in the second case; the flag says whether the CITED paper publishes a
    size (amplicon_disagrees_with_paper) or does not (amplicon_measured_not_published); and a value is only moved where the
    new +/-25% window still admits every product measured, so a correction cannot silently delete calls. Measured on the 2026-11-01
    calls. Bourhy round 2: 260 -> 249. Deliberate and small consequence: the new window 187-311 bp drops three products of
    7,165, at 314 bp (two) and 317 bp (one), all three already `fail`, so they move from `fail` to `no_amplicon` at the frozen
    run.'
