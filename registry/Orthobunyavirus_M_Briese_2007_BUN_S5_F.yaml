  notes_curator: 'Added 2026-10-04 from Briese et al. 2007 Table 1 (doi:10.1007/s00705-007-1069-z), read from the paper itself.
    The table gives each primer''s sequence and the genome position of its 3''-terminal base, numbered on the Bunyamwera virus
    prototype 1943 reference (D00353 = S, M11852 = M, X14383 = L). Degenerate positions are printed as lower-case IUPAC codes
    and are transcribed here in upper case; sequences are printed in triplets, which is how each primer''s length was checked.
    Non-authentic (cloning-tail) bases are marked in the table by a distinct italic font, and NONE of the primers in this
    entry carries one except where tail_5prime is set below. amplicon_bp is COMPUTED, not quoted: the paper gives 3'' positions,
    not product sizes, so the product is taken as the span from the forward primer''s 5'' base to the reverse primer''s 5''
    base using the printed 3'' positions and the primer lengths. BUN-S5-F carries a 5 nt italic tail (GCCGC); its 20 nt of
    authentic sequence has its 3'' base at 20, so it binds 1-20, the M-segment 5'' terminus. M940C-R is 26 nt with its 3''
    base at 936, so it binds 936-961; the product is 1-961 = 961 bp. The arithmetic is corroborated by the primer names, which
    encode their own positions (BUNS-3-L947 at 947, BUNL650R at 601-630). Treat the size as approximate: it is exact only
    on the Bunyamwera reference, and these are consensus primers meant for a whole serogroup. SCOPE. The paper designed these
    from an alignment of ''orthobunyaviruses of the CE and BUN serogroups and Guaroa virus'', so the claim is the California
    encephalitis and Bunyamwera serogroups, not the whole genus. The registry target is genus Orthobunyavirus (~18 serogroups),
    so a low detected share here is very likely scope rather than drift. Screening the two assays already in the registry
    on 2026-10-04 showed the pattern plainly: strong on the design serogroups (Cache Valley 14/15, Maguari 4/5) and near-zero
    on Simbu-serogroup viruses (Oropouche 0/24, Akabane 0/7, Schmallenberg 0/7, Manzanilla 0/4). Left unscoped pending the
    registry-wide decision on lineage scoping. Anchored on the conserved M-segment terminus, like the S-segment assay already
    in the registry, so most partial-CDS deposits will return no_amplicon however well the primers match. Screened on 2026-10-04:
    93 evaluable of 2,056, 8 detected. The low evaluable count is the terminal anchoring, as expected. CORRECTED 2026-11-06:
    the paper states its alignment for the M segment only; the design basis of the S and L primers isn''t stated. SIZE READ
    AND SETTLED 2026-11-10 (ROADMAP, "Sizes to read, from the verifier''s table"). One rule over all eleven entries on that
    list: amplicon_bp takes the measured modal product length where one mode holds a clear majority, and the measured median
    where none does, with amplicon_multimodal in the second case; the flag says whether the CITED paper publishes a size (amplicon_disagrees_with_paper)
    or does not (amplicon_measured_not_published); and a value is only moved where the new +/-25% window still admits every
    product measured, so a correction cannot silently delete calls. Measured on the 2026-11-01 calls. Briese BUN_S5_F: 961
    -> 948. New window 711-1,185 bp admits every product measured (935-1,053).'
