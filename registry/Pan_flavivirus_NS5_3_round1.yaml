  notes_curator: 'PROVENANCE SPLIT, established 2026-10-04 by the provenance audit. The oligo names carry their own attribution and the lab was right to do that: `-Zino-` is Scaramozzino and `-GORO-` is Goro Kuno. cFD2 is conventionally attributed to Kuno et al. 1998, J Virol 72:73-83, doi:10.1128/JVI.72.1.73-83.1998 (DOI verified against Crossref: ''Phylogeny of the Genus Flavivirus'', Kuno, Chang, Tsuchiya, Karabatsos, Cropp). Scaramozzino et al. 2001 contributed MAMD and FS778, and its title - ''Comparison of Flavivirus Universal Primer Pairs and Development of a Rapid, Highly Sensitive Heminested RT-PCR Assay'' - is itself evidence that it evaluated pre-existing pairs rather than designing them all. So this pair is a composite and oligos_designed_here is False: only the forward primer is Scaramozzino''s. Scope therefore cannot be read off Scaramozzino 2001 alone. Not yet confirmed from Kuno 1998''s own methods - that is what would close it.'
