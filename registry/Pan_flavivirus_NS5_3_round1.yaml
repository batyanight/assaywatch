  notes_curator: 'PROVENANCE SPLIT, established 2026-10-04 by the provenance audit. The oligo names carry their own attribution
    and rightly so: `-Zino-` is Scaramozzino and `-GORO-` is Goro Kuno. cFD2 is conventionally attributed
    to Kuno et al. 1998, J Virol 72:73-83, doi:10.1128/JVI.72.1.73-83.1998 (DOI verified against Crossref: ''Phylogeny of
    the Genus Flavivirus'', Kuno, Chang, Tsuchiya, Karabatsos, Cropp). Scaramozzino et al. 2001 contributed MAMD and FS778,
    and its title - ''Comparison of Flavivirus Universal Primer Pairs and Development of a Rapid, Highly Sensitive Heminested
    RT-PCR Assay'' - is itself evidence that it evaluated pre-existing pairs rather than designing them all. So this pair
    is a composite and oligos_designed_here is False: only the forward primer is Scaramozzino''s. Scope therefore cannot be
    read off Scaramozzino 2001 alone. Not yet confirmed from Kuno 1998''s own methods - that is what would close it. TAXON
    RENAMED: NCBI now calls txid11051 ''Orthoflavivirus''; this entry carried the superseded name ''Flavivirus''. Checked
    2026-10-05 during the repo-wide audit. The taxid is unchanged and is what retrieval uses, so nothing about the screening
    changes - but a report naming the old taxon would not match what GenBank now says. SCOPE QUESTION ASKED AND CLOSED 2026-10-20,
    no scope_taxids change. The override fires on Orthoflavivirus usutuense (3048443) at 0 of 428 records. Usutu is not out
    of range: it is in Scaramozzino et al. 2001''s own test panel (Table 3 and Fig. 2 lane 5, "USU, Usutu virus"), and these
    are that paper''s own new primers - Table 2 lists MAMD and FS 778 as "This article", with cFD2 from its ref 19, and all
    three match this registry base for base. The paper''s claim is that the heminested NS5 pair detected "all of the tick-
    and mosquito-borne flaviviruses tested". So 0 of 428 is a finding about the assay, not about the denominator, and it is
    the largest single block of never-detected records in the override set. Worth a bench panel: Table 3 compares six published
    genus primer pairs across about twelve viruses, which would test these two pairs type by type.


    TAXID RETIRED 2026-10-27: NCBI has merged 11051 into 3044782 (Orthoflavivirus), so this entry now carries the canonical
    id. Retrieval resolved the old id and nothing had noticed, which is the point -- an entry on a retired id is one taxonomy
    release from an empty archive. data/retrieved/11051/ moved to data/retrieved/3044782/ and the manifest was rebuilt in
    the same commit, so no archive was re-fetched. Found by scripts/check_taxids.py''s containment check; see docs/journal/2026-10-27-retired-taxids.md.'
