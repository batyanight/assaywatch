  notes_curator: 'ENTERED 2026-10-30 so that Yang 2014''s documented drift observation has a registry assay to attach to (docs/journal/2026-10-30-two-strict-bar-drift-cases.md).

    Oligos read verbatim from the paper''s own section 2.3.2, which prints them in spaced triplets ("5''AAG ACC AAT CCT GTC
    ACC TCT GA 3''"); the spacing is the reason a first pass over the PMC XML found no sequences at all. Open-access copy
    held as papers/ward-2004-10.1016_S1386-6532(03)00122-7.pmc.xml (PMC7128145, Elsevier COVID collection). The paper designed
    its oligos from an alignment of 20 influenza A and 20 influenza B matrix sequences, which is what n_sequences_at_design
    records.

    AMPLICON MEASURED AT 95 bp, NOT THE PUBLISHED 104. Measured over the first 4,000 records of this entry''s own archive
    (data/retrieved/11320/q2ebd5918b3): both primers bind within 2 mismatches in 3,975 of them and every single one of those
    3,975 gives 95 bp, with the probe binding in 3,968. The forward sits at +143, the probe at +183 and the reverse at +216
    on PZ777374.2. There is no second mode. The registry takes the measured value and discloses the difference; see config.yaml
    under amplicon: for why.

    ORIENTATION IS THE PAPER''S, AND IT IS THE FUNCTIONAL ONE. antisenseA as printed binds the MINUS strand, which is what
    a working reverse primer does, and the registry''s existing matrix entry (Spackman) stores its reverse the same way. This
    is recorded because Yang 2014 prints the same primer on the opposite strand; see that entry.

    DISTINCT FROM INFLUENZA_A_ssRNA_Matrix_gene_recognized_h_2003 (Spackman 2002), which is the registry''s other matrix assay:
    different design paper, different primers (no sequence is shared), different target region within the segment, and MGB
    rather than FAM/TAMRA chemistry. The two are siblings on the same locus and the same retrieval group, not duplicates.

    The design paper also prints an influenza B matrix assay (senseB / antisenseB and a VIC probe) which is NOT entered here:
    it is a different target taxon and a separate curation. Recorded so that a later reader knows it was seen and left.

    The paper''s own discussion states the thesis this project is built on: "This highlights the need for regular reviews
    of any primer or probe sequences used diagnostically or for quantification of viruses that are subject to genetic drift."

    rt is two_step: the protocol amplifies 2 ul of separately made cDNA. Conditions are the paper''s: 1x Universal Master
    Mix, 900 nM each primer, 225 nM probe, UNG 50 C for 2 min, activation 95 C for 10 min, then 40 cycles of 15 s at 95 C
    and 1 min at 60 C.

    CROSSREF AGREED 2026-10-30, AND doi_verified IS HELD FALSE ANYWAY, DELIBERATELY. `assaywatch curate` resolved this
    DOI and matched it to the entry (Ward 2004, "Design and performance testing of quantitative real time PCR assays
    for influenza A and B viral load measurement") and wrote doi_verified: true. It was then set back to false by
    hand, because "live" in this repository means a verified DOI and nothing else: registry.not_live_because looks at
    the DOI alone and ignores status, so an entry in pending/ carrying a verified DOI reads as LIVE while sitting in
    the directory for things that are not, and
    tests/test_schema.py::test_nothing_in_pending_is_live_and_nothing_in_registry_is_pending fails on exactly that.
    The maintainer asked for these entries to wait in pending/ for sign-off, and that is incompatible with the flag
    being true, so the flag waits too. No information is lost: the resolution is recorded here and `assaywatch curate`
    re-sets the flag in one command at promotion.
'
needs_review:
- flag: amplicon_disagrees_with_paper
  note: measured 95 bp on 3,975 of 4,000 archive records, unimodal; the paper says 104
