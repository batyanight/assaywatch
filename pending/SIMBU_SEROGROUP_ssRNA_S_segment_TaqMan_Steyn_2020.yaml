source:
  nested_round: null
  notes_curator: 'ADDED 2026-10-25 from the maintainer''s Downloads, and VERIFIED THE SAME DAY against its own design paper''s
    appendix. All three oligos match character for character.

    Found via Table 1 of van der Walt M et al. 2023, Identification and Molecular Characterization of Shamonda Virus in an
    Aborted Goat Fetus in South Africa, Pathogens 12:1100, doi:10.3390/pathogens12091100, held as papers/10.3390_pathogens12091100.pdf,
    which prints them as the "Simbu Serogroup TaqMan Real-Time RT-PCR Assay" and credits its reference [20] = Steyn 2020.

    STEYN 2020 IS THE DESIGN PAPER, AND ITS OLIGOS ARE IN THE APPENDIX, NOT THE ARTICLE. The main PDF (papers/10.3201_eid2607.190770.pdf)
    prints none of the three sequences and none of their names, which looked at first like another citation chain. It is not:
    the article says it screened samples by a SHUV rRT-PCR and "a newly designed rRT-PCR targeting a conserved area of the
    S segment of the Simbu serogroup (Appendix)". The appendix is held under the project''s .supp convention as papers/10.3201_eid2607.190770.supp.pdf,
    and its Methods and Validations section prints, verbatim:

    Ortho(SimbuF152)        5''152 TAGAGTCTTCTTCCTCAAYCAGAAGAAGGCC 3''184 Ortho(SimbuR304)        5''276 GTYAMGGCAMTGTCTGGCACAGGATTTG     3''304
    Ortho(Simbu-probe252)   5''252 TGGTTAATAACCATTTTCC              3''270

    designed on a conserved S-segment region of SHUV KC510272, positions 152-304. Those are the only three oligo-length runs
    anywhere in the appendix, so there is nothing else it could be confused with.

    THE NAME-TO-SEQUENCE MAPPING WAS CHECKED TWICE, and the check mattered. pdftotext without -layout interleaves van der
    Walt''s table columns and read that way the forward and reverse are SWAPPED. Two independent confirmations of the order
    recorded above: van der Walt''s own nested S-segment assay prints Ortho(SimbuF141) as CGRTRYYGYTAGAGTCTTCTTCC, whose 3''
    end TAGAGTCTTCTTCC is the 5'' start of F152, which a reverse primer could not be; and Steyn''s appendix labels each sequence
    with its own 5''/3'' coordinates, which agree.

    COORDINATE ARITHMETIC, recorded because it is loose in the source and must not be mistaken for a transcription error here.
    The probe is exact: 252-270 inclusive is 19 and the sequence is 19 nt. The two primers are not: F152 is 31 nt against
    a printed 152-184 (33), R304 is 28 nt against a printed 276-304 (29). The probe matching exactly argues the extraction
    is sound and the paper''s primer coordinates are a little loose, most likely in the superscripts. Independently, the appendix
    states 152 bp for a span of 152-304 that is 153 bp inclusive. None of this touches the sequences, which are verbatim;
    it is why amplicon_bp carries amplicon_size_unresolved and must be MEASURED rather than taken from either number.

    RETRIEVAL QUERY matches ORTHOBUNYAVIRUS_ssRNA_S_segment_Cac_Briese_2007 exactly, so this entry joins that archive group
    rather than forcing a fresh fetch of the genus. It pulls M-segment records into the denominator of an S-segment assay,
    which is the shape that generates chance pairs - harmless here because this is a probe-bearing assay and drift.chance_pair_test
    (shipped 2026-10-25) guards exactly that case.

    TAXID IS THE GENUS, DELIBERATELY, AND IS WIDER THAN THE ASSAY. "Simbu serogroup" is not a taxonomic rank. NCBI has Simbu
    orthobunyavirus 3052441, Shuni orthobunyavirus 3052440 and Shamonda orthobunyavirus 159150 as separate species, so no
    single species node covers the serogroup and 3052441 would wrongly exclude the Shuni and Shamonda viruses this assay is
    used to detect. 11572 Orthobunyavirus is the same retrieval taxon the four ORTHOBUNYAVIRUS_*_Briese_2007 entries already
    use. It is far wider than the serogroup, so this entry carries scope_narrower_than_taxid and would need scope work before
    it could be screened meaningfully.

    AMPLICON: 152 is the published figure. The printed span 152-304 is 153 bp inclusive, an off-by-one of the kind this registry
    resolves by measurement rather than by argument, so nothing is decided here; amplicon_bp must be measured against real
    records before this goes live and may well disagree with both numbers.

    NOT THE ONLY ASSAY IN THAT PAPER. van der Walt 2023 Table 1 also prints four assays it designed itself ("This study"),
    all conventional and all with degenerate pooled primers: a Simbu S-segment nested pair (F141/R718, 576 bp; nested FN403/RN695,
    291 bp), a Simbu M-segment hemi-nested pair (M2671+/M3476-, 807 bp; nested M2671+/M3110-, 421 bp) and a pan-orthobunyavirus
    hemi-nested assay (Peri-F1 and others, 513 bp). Those have clean provenance - the paper that designed them is the paper
    we hold - and are better candidates than this one on that count, but the paper states the primers could only be tested
    as pools, not individually, which is the pooled_as_one_assay situation and wants a reading of its own before entry. Deliberately
    left out of this entry rather than guessed at.'
needs_review:
- flag: scope_narrower_than_taxid
  note: the assay is Simbu serogroup specific; taxid 11572 is the whole Orthobunyavirus genus because the serogroup is not
    a taxonomic rank
- flag: amplicon_size_unresolved
  note: published 152 bp against a printed 152-304 span that is 153 bp inclusive; to be measured, not argued
