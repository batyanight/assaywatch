  notes_curator: 'MOVED TO pending/ 2026-11-02. The reverse primer 16-23-R3 is Rebelo et al. 2011''s universal R1 (10.1177/1040638711416846),
    but the forward primer 16-23-F3 (AWTWGWTYTTTGAAAACTGAATAGCA) is not in that paper, and no publication printing it has
    been found. With no published source for the pair, the entry is not live. To bring it back: find the paper that prints
    the missing primer, cite it, and run assaywatch curate.

    CITATION ADDED 2026-10-04 by the provenance audit, on sequence evidence rather than inference. This entry had no citation
    at all, but its reverse primer ''16-23 R3 (Rebelo R)'' is byte-identical to RebeloR in Mycoplasma_16S23S_ITS_Rebelo_2011_Myco16_23S_F,
    which carries doi:10.1177/1040638711416846 (verified against Crossref: Rebelo, Parker & Cai, J Vet Diagn Invest 23:932-936).
    So half of this pair is Rebelo 2011 and the partner is from elsewhere - unpublished or in-house, nothing says which. oligos_designed_here
    is False because the pair as entered is a composite, and Rebelo 2011''s claims bound only one of the two primers. Three
    registry entries share Rebelo oligos and only one named the paper; that is the same read-from-versus-designed-by confusion
    that produced the ranavirus scoping error. SEARCHED AND NOT FOUND, 2026-10-23. Rebelo et al. 2011 prints only its universal
    pair, F1 ACACCATGGGAGYTGGTAAT and R1 CTCCWTCGACTTYCAGACCCAAGGCAT, so the partner primer in this entry is not that paper''s
    and reads `absent`. An exact-phrase Europe PMC full-text search on the stored sequence returns nothing, so it has no identifiable
    publication, and the oligo_source_unresolved flag is not a to-do that reading one more paper will clear.'
