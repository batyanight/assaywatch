# DRAFT, read by nothing. ROADMAP "Lineage composition over time", written 2026-11-03
# as step 0 and NOT committable as a step of its own: tests/test_config_keys.py refuses a
# config key nothing reads, and test_settings.py refuses a model key config.yaml lacks, so
# a key, its model field and its first reader land together -- at step 12, when
# `composition.build` reads the block. This file holds all three parts until then and is
# deleted in that step.
#
# Part 1, below: the config.yaml block, comments included.
# Part 2, at the end: the settings.py model and its tests, commented out.

# How each assay's record mix changes over time, and what that does to its
# detection graph (ROADMAP, "Lineage composition over time"; assaywatch/composition.py,
# not built yet). REPORT-ONLY: it moves no status, so it is outside the drift hash.
# Lineages here are sequence clusters over the amplicon plus flank with the primer
# and probe sites masked, so a cluster is defined by sequence the assay does not
# measure -- the same reasoning as decision A of
# docs/journal/2026-10-19-subtaxid-resolution.md.
composition:
  # The flank BUDGET per side, 2 x flank_bp in all. Not the flank itself: each assay's
  # window shape is read from its own archive (subcluster.window_shape), because an
  # amplicon at the end of a sequenced gene has flank on one side only. Spackman's
  # influenza M amplicon sits at segment 7's 5' end -- 9-23 bp of flank to the left,
  # 886-903 to the right over 89,628 records -- so a symmetric 500 bp each side was
  # full-flank in ONE record of 89,628 (measured 2026-11-03, ROADMAP step 4b). With the
  # budget redistributed its shape is (9, 886) and 88.5% of records are full-flank;
  # Messmer 16S reads (20, 959) and 86.9%.
  #
  # 500 is a judgement, not a measurement: long enough that two records of one species
  # share enough k-mers to measure a distance, short enough to stay inside most partial
  # gene records. Assembly cuts carry only 100 bp (amplicon.record_min_overhang_bp) and
  # window archives 300 bp, so those records get what they have; the flank actually
  # used is recorded per window, and a record short of the shape is placed by
  # containment rather than sampled.
  flank_bp: 500
  # Each side of the shape starts at this quantile of what the assay's records offer
  # there, so 90% of records cover the window. A judgement: 0.25 would discard a
  # quarter of the records to gain a little length, 0.0 would let the single shortest
  # record set the shape for the whole assay.
  shape_quantile: 0.1
  # Bases masked beyond each site: a pool's alternate primers sit a few bases off
  # the primary pair's site. 5 covers the offsets seen in the registry by eye; not
  # measured.
  mask_buffer_bp: 5
  # A run of 10 N ends a flank: assembly scaffolds join contigs with N spacers,
  # and sequence on the far side of one is not adjacent to the amplicon.
  stop_n_run: 10
  # 15-mers: at ~1,000-1,300 bp per window a 15-mer is effectively unique
  # (4^15 ~ 1e9), and Mash's distance estimate stays usable well past the 5% cut
  # below -- the measured distributions run to 25%; 21 (subcluster's default) saturates sooner on
  # short, divergent windows. Standard choice, not tuned here.
  kmer_len: 15
  # At most 2,000 windows per assay are clustered, spread across deposit years;
  # every other record is assigned to its nearest sampled member. Sets the cost
  # (2,000^2/2 = 2M distances, seconds vectorised). Not a statistical choice.
  sample_cap: 2000
  # Two sampled windows join one lineage when their Mash distance (~ the fraction of
  # bases that differ) is at most this. ONE NUMBER FOR EVERY ASSAY, so a cluster means
  # the same thing on every panel: sequence within about 5% divergence, which reads as
  # a species or sublineage split on the assays measured.
  #
  # MEASURED 2026-11-03 (ROADMAP step 4b, docs/journal/2026-11-03-composition-cut-measured.md)
  # against the organism GenBank prints in each record's title, which the clustering
  # never sees. Purity is the share of sampled windows matching their cluster's modal
  # organism; completeness is the share of one organism's windows in its own dominant
  # cluster:
  #   Haemosporida cytb (Hellgren HaemF, 1,513 windows, genus labels):
  #     0.02 -> 78 clusters, purity 91%;  0.04 -> 35, 94%;  0.05 -> 24, 83%
  #     (Haemoproteus 90% complete, Hepatocystis 97%);  0.10 -> 5, 68%.
  #   Coronaviridae RdRp (Watanabe 2010, 2,000 windows):
  #     0.02 -> 80 clusters, PEDV 100% complete;  0.05 -> 78, IBV 94%;  0.10 -> 51.
  #   Chlamydia 16S (Messmer round 1, 76 windows): the four species groups the pair
  #     amplifies separate at 0.040.
  # 0.05 is the level where the named taxa separate on all three. Above ~0.10 the
  # clusters become genera and the within-genus structure drift lives in disappears;
  # below ~0.02 an assay runs to 80 clusters, of which a panel can draw 8.
  # What this number is NOT: calibrated on more than three assays, or on anything but
  # the organism in a title. The coronavirus purity figure is held down by the label,
  # not the clustering -- "Human coronavirus" is 265 windows of 229E, OC43, NL63 and
  # HKU1, so its completeness is pinned at 37% at every cut.
  cut: 0.05
  # A component with fewer than 3 sampled members is not a lineage; its records
  # pool into "other". Placeholder.
  min_cluster_size: 3
  # A cluster whose commonest species covers at least this much of it is named for that
  # species alone ("C. trachomatis"). Below it the name carries the share
  # ("P. falciparum 38%"), because a legend entry naming one species would be a false
  # statement about the rest: step 4b produced a 2,000-window cluster that was 15% its
  # modal organism. 0.9 is a judgement about what a reader will take a bare name to mean.
  name_pure_share: 0.9
  # A tooltip token must appear in at least this share of a cluster's titles, so one odd
  # deposit cannot name a lineage, and at least this many times as often in the cluster as
  # outside it. Both are judgements. The lift is what drops the words every cluster shares
  # ("complete", "genome"); the support is what drops a single strange isolate.
  token_min_share: 0.2
  token_min_lift: 2.0
  # Tokens shown per cluster in the tooltip.
  title_tokens_shown: 5
  # Clusters drawn per assay; the rest pool into "other". 8 because a stacked bar
  # stops being readable past about that many colours, not because it is measured.
  show_clusters: 8
  # Bootstrap resamples for the mix/within split's intervals. 2,000 is the usual
  # floor for stable 95% percentile intervals; deterministic under boot_seed.
  n_boot: 2000
  boot_seed: 0
  # A year's same-mix point is drawn only when the clusters present that year
  # carry at least 80% of the whole-period weight; otherwise the "same mix" is
  # mostly extrapolation. Placeholder.
  same_mix_min_covered: 0.8
  # The report section "Where the mix moved the graph" names an assay whose mix
  # part is at least 5 percentage points and whose interval excludes 0. Matches
  # drift.min_decline (0.05), the size of change the verdict already treats as
  # worth naming.
  report_min_mix: 0.05
  # Years re-counted by esearch each run for retrieval coverage; older years come
  # from the cache (data/retrieved/.year-counts.json.gz). 2 because late deposits
  # and re-annotation mostly touch the last two years. Not measured.
  coverage_refresh_years: 2
  # Cap on website/data/composition.json, which is committed every run beside the
  # 2.5 MB run.json. A test fails the build above it.
  site_max_bytes: 1500000

