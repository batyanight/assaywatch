# as step 0 and NOT committable as a step of its own: tests/test_config_keys.py refuses a
# config key nothing reads, and test_settings.py refuses a model key config.yaml lacks, so
# a key, its model field and its first reader land together -- at step 12, when
# `composition.build` reads the block. This file holds all three parts until then and is
# deleted in that step.
#
# Part 1, below: the config.yaml block, comments included.
# Part 2, at the end: the settings.py model and its tests, commented out.

# How each assay's record mix changes over time, and what that does to its
# detection graph (ROADMAP, "Lineage composition over time"; assaywatch/composition.py,
# not built yet). REPORT-ONLY: it moves no status, so it is outside the drift hash.
# Lineages here are sequence clusters over the amplicon plus flank with the primer
# and probe sites masked, so a cluster is defined by sequence the assay does not
# measure -- the same reasoning as decision A of
# docs/journal/2026-10-19-subtaxid-resolution.md.
composition:
  # 500 bp each side: long enough that two records of one species usually share
  # enough k-mers to measure a distance, short enough to stay inside most partial
  # gene records. A judgement, not a measurement. Assembly cuts carry only 100 bp
  # (amplicon.record_min_overhang_bp) and window archives 300 bp, so those records
  # get what they have; the flank actually used is recorded per window.
  flank_bp: 500
  # Bases masked beyond each site: a pool's alternate primers sit a few bases off
  # the primary pair's site. 5 covers the offsets seen in the registry by eye; not
  # measured.
  mask_buffer_bp: 5
  # A run of 10 N ends a flank: assembly scaffolds join contigs with N spacers,
  # and sequence on the far side of one is not adjacent to the amplicon.
  stop_n_run: 10
  # 15-mers: at ~1,000-1,300 bp per window a 15-mer is effectively unique
  # (4^15 ~ 1e9), and Mash's distance estimate stays usable up to the ~15%
  # divergence of cut_max below; 21 (subcluster's default) saturates sooner on
  # short, divergent windows. Standard choice, not tuned here.
  kmer_len: 15
  # At most 2,000 windows per assay are clustered, spread across deposit years;
  # every other record is assigned to its nearest sampled member. Sets the cost
  # (2,000^2/2 = 2M distances, seconds vectorised). Not a statistical choice.
  sample_cap: 2000
  # The cut is the midpoint of the widest gap in the sample's single-linkage tree
  # that lies inside [cut_min, cut_max] (Mash distance, ~ fraction of differing
  # bases). PROVISIONAL: ROADMAP step 4b calibrates both on influenza M (subtypes in
  # record titles must separate) and Messmer 16S (must stay one cluster), and
  # replaces this comment with the distances measured there.
  cut_min: 0.01
  cut_max: 0.15
  # A widest gap narrower than 0.01 is not a gap: the assay reads "no gap in
  # bounds" and is one cluster. Placeholder, revisited with the bounds at step 4b.
  min_gap: 0.01
  # A component with fewer than 3 sampled members is not a lineage; its records
  # pool into "other". Placeholder.
  min_cluster_size: 3
  # Clusters drawn per assay; the rest pool into "other". 8 because a stacked bar
  # stops being readable past about that many colours, not because it is measured.
  show_clusters: 8
  # Bootstrap resamples for the mix/within split's intervals. 2,000 is the usual
  # floor for stable 95% percentile intervals; deterministic under boot_seed.
  n_boot: 2000
  boot_seed: 0
  # A year's same-mix point is drawn only when the clusters present that year
  # carry at least 80% of the whole-period weight; otherwise the "same mix" is
  # mostly extrapolation. Placeholder.
  same_mix_min_covered: 0.8
  # The report section "Where the mix moved the graph" names an assay whose mix
  # part is at least 5 percentage points and whose interval excludes 0. Matches
  # drift.min_decline (0.05), the size of change the verdict already treats as
  # worth naming.
  report_min_mix: 0.05
  # Years re-counted by esearch each run for retrieval coverage; older years come
  # from the cache (data/retrieved/.year-counts.json.gz). 2 because late deposits
  # and re-annotation mostly touch the last two years. Not measured.
  coverage_refresh_years: 2
  # Cap on website/data/composition.json, which is committed every run beside the
  # 2.5 MB run.json. A test fails the build above it.
  site_max_bytes: 1500000

