# Thresholds and run settings. Nothing numeric about scoring lives in code.
registry_dir: registry
retrieved_dir: data/retrieved
results_dir: results

scoring:
  primer_3prime_window: 5        # last N nt of the 3' end
  primer_3prime_penalty: 3.0
  primer_mid_window: 5           # positions 6-10 from the 3' end
  primer_mid_penalty: 1.0
  primer_5prime_penalty: 0.5
  probe_center_penalty: 2.0      # central third of the probe
  probe_outer_penalty: 1.0
  max_ambiguous_per_oligo: 2     # more undetermined record bases under one oligo -> indeterminate
  max_pairs_per_record: 5000     # safety cap on candidate amplicons per record (best-matched kept)
  # Chance-pair guard (assaywatch/chance.py). Every amplicon gets a pair_evalue:
  # the expected number of primer pairs this good in a random record of the same
  # length. Set a number (e.g. 0.01) to call pairs above it no_amplicon instead
  # of scoring them; null reports the E-value but changes no call.
  max_pair_evalue: 0.01
  detect_max: 1.0                # <= detect
  reduced_max: 3.0               # <= reduced efficiency; above = fail
  terminal_mismatch_fails: true  # any mismatch at the 3'-most base = fail

amplicon:
  min_bp: 50
  max_bp: 3000
  record_min_overhang_bp: 100    # record must extend this far past the amplicon

# Sequence retrieval from NCBI. These are the decisions that shape what the
# drift metric can see, so they live here rather than in code.
retrieve:
  page_size: 500              # records per esummary call, and the efetch ceiling
  page_target_bytes: 20000000 # efetch pages shrink so one response stays near this size
  min_length: 100             # skip fragments too short to contain any amplicon
  max_length: null            # whole genomes are fine: an amplicon may sit anywhere
  query_suffix: null          # e.g. 'NOT "whole genome shotgun"[Title]' to trim bulk
  max_records_per_taxon: 100000
  incremental_overlap_days: 3 # each incremental run re-asks for these days, for records NCBI indexes late
  # Taxa allowed past the cap, by taxid. Opt in deliberately. Influenza A
  # segment 7 is ~180,000 records on first fetch (and incremental after);
  # that is a known cost, accepted on 2026-10-03.
  large_taxa_allowed: [11320]

# Assembly-level retrieval (assaywatch/assemblies.py) for bacterial targets whose
# gene-level nuccore deposits stop around 2012, when the same genes started
# arriving inside whole genomes. Each listed taxid gets an extra `asm` group:
# up to `per_year` GenBank assemblies per release year, sampled in a stable
# arbitrary order and cut down to the loci the taxon's assays could bind.
# Complete genomes and chromosomes only: the locus is never split across
# contigs, and plasmid-borne targets (ipaH, LT, O157 hlyA) come with them.
assemblies:
  taxa: [562, 620, 28901, 630, 633, 171]   # E. coli, Shigella, Salmonella, Y. enterocolitica, Y. pseudotuberculosis, Leptospira
  levels: [complete_genome, chromosome]
  per_year: 20
  batch: 10          # genomes per download request
  max_pair_evalue: 0.01   # keep a window only around a pair distinguishable from chance

# Duplex Tm per oligo on its binding site (assaywatch/thermo.py). Shown beside
# the call, never scored. Turn on with `thermo: true` here or
# `--config thermo=true`; needs primer3-py. The conditions below are typical
# qPCR mastermix values; ΔTm (the column worth reading) depends on them much
# less than absolute Tm does.
thermo: false
thermo_conditions:
  mv_conc: 50       # mM monovalent cations
  dv_conc: 3.0      # mM Mg2+
  dntp_conc: 0.8    # mM total dNTPs
  dna_conc: 250     # nM oligo

# Degeneracy is never scored; these tiers only annotate how much weight a
# `detect` call deserves. See assaywatch/degeneracy.py for the rationale.
degeneracy:
  tiers:
    - [8, negligible]
    - [128, moderate]
    - [4096, high]

drift:
  detect_fraction_threshold: 0.90   # below this the assay is considered failing
  recent_window_months: 24          # how far back "recent" reaches
  min_records_for_drift: 20         # fewer evaluable records than this -> report, never flag
  min_records_for_coverage: 10      # fewer than this in total -> a coverage gap, not a result
  min_decline: 0.05                 # a fall smaller than this (5 points) is low coverage, not declining
