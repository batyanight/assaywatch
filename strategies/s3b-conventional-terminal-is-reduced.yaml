# S3, switch 2 of 2, tested alone. For conventional chemistry a 3'-terminal mismatch
# alone is `reduced`, not `fail`.
#
# Expressible as an overlay, and only because of a coincidence worth stating: with
# `terminal_mismatch_fails: false` a lone terminal mismatch costs
# `primer_3prime_penalty` 3.0, which EQUALS `reduced_max` 3.0, so it lands exactly on
# `reduced` rather than `detect`. That is the same coincidence M1 tripped over. It
# means this switch does what its description says only while those two numbers are
# equal, and a future change to either silently changes what this candidate is.
#
# The literature is behind this one. Kwok 1990 (doi:10.1093/nar/18.4.999) and
# Stadhouders 2010 measure under 1.5 Cq of loss for A-C, C-A, T-G and G-T at the 3'
# terminus against over 7 Cq for A-A, G-A, A-G and C-C, so an identity-blind `fail`
# is wrong for roughly half of terminal mismatches - and endpoint PCR forgives a
# yield loss that a Cq cutoff does not.
name: s3b-conventional-terminal-is-reduced
registered: 2026-10-26
question: >
  `terminal_mismatch_fails` is a qPCR-strength rule applied to all 155 conventional
  entries. Does exempting them, so a lone terminal mismatch is `reduced`, agree with
  the literature better than the shipped rule?
predicts: >
  It loosens, and only for conventional entries. The Leptospira panel's five false
  fails will NOT be rescued by it, because their penalties are 4, 5.5, 4, 8 and 11.5
  against `reduced_max` 3.0 and they clear the bar on their remaining mismatches even
  with the terminal rule off - and in any case that assay is a hydrolysis probe, not
  conventional, so this switch does not touch it. Predicted before running, from
  docs/bench-panels/ahmed-2020-leptospira.tsv.
kill: >
  Any documented catch lost. Named per catch and never netted.
scoring:
  by_chemistry:
    conventional:
      terminal_mismatch_fails: false
