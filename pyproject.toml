[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assaywatch"
version = "0.0.1"
description = "Continuous in-silico re-validation of published PCR/qPCR assays against new GenBank sequences"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
import = ["openpyxl", "requests"]

[project.scripts]
assaywatch-validate = "assaywatch.validate:main"

[tool.setuptools.packages.find]
include = ["assaywatch*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
