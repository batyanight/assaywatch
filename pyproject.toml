[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assaywatch"
# Read from assaywatch/__init__.py so there is ONE place to bump. It was two, and
# two is how they drift apart.
dynamic = ["version"]
description = "Continuous in-silico re-validation of published PCR/qPCR assays against new GenBank sequences"
readme = "README.md"
requires-python = ">=3.11"
# Name verified with the author. Email deliberately omitted: it would be published
# in the package index, and only the name and ORCID were given for attribution.
authors = [{name = "Batya R. Nightingale"}]
# requests is NOT optional: both retrieval transports import it lazily
# (retrieve.http_transport, assemblies.datasets_transport) and the laziness is
# so the tests need no network stack, not because the package works without it.
dependencies = ["pydantic>=2", "pyyaml>=6", "numpy>=1.24", "requests>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.10", "pre-commit", "build"]   # build: `python -m build`
import = ["openpyxl"]   # requests is a core dependency
pdf = ["pypdf"]   # scripts/verify_oligos_against_paper.py --pdf-dir
thermo = ["primer3-py"]   # the duplex-Tm columns, opt-in via `thermo: true`
# The per-lineage binomial test and its BH correction, i.e. the lineage-conditional
# verdict. Optional on purpose: assaywatch.lineage imports them inside
# worst_lineage_verdict, so grouping records, reading titles and the diagnostic
# lineage report all work without them, and the CI job that omits them proves it.
# Anything that computes a verdict needs them, including most of tests/test_drift.py.
lineage = ["scipy>=1.11", "statsmodels>=0.14"]

[project.scripts]
assaywatch-validate = "assaywatch.validate:main"

[tool.setuptools.dynamic]
version = {attr = "assaywatch.__version__"}

[tool.setuptools.packages.find]
include = ["assaywatch*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
