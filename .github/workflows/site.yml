# Build the website and publish it to GitHub Pages.
#
# The site is built from website/data/run.json, which is COMMITTED. That is the
# point of the two-phase build in assaywatch/site.py: extraction needs the 22 MB
# calls table and the 9 GB of archives, which CI does not have and never will, so
# CI renders pages from the extracted JSON and nothing else. Refreshing the data
# is a local step after a run:
#
#     python -m assaywatch.site extract results/<date>/calls.tsv.gz --out website/data
#     python -m assaywatch.site_render
name: site
on:
  push:
    branches: [main]
    paths:
      - website/**
      - mkdocs.yml
      - assaywatch/site*.py
      - assaywatch/palette.py
      - GLOSSARY.md
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never cancels
# a deploy half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[site,dev]"
      # Regenerate rather than trust what is committed: if the generated pages
      # and run.json have drifted apart, the published site should show the data,
      # and `git diff --exit-code` below says so loudly rather than silently.
      # The page-rendering tests need Bokeh, so they skip in the core test job
      # (which installs no site extras) and run here, where it is installed.
      - run: pytest tests/test_site.py -q
      - run: python -m assaywatch.site_render --data website/data --out website
      - name: the committed pages match what the data renders
        run: git diff --exit-code --stat website/ || (echo "::error::website/ is stale; re-run assaywatch.site_render and commit" && exit 1)
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
