name: validate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m assaywatch.validate registry
      # No citation may be written from memory. Checks every registry DOI
      # against the committed Crossref cache, so it needs no network.
      - run: python scripts/check_citations.py
